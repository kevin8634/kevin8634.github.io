<style>
  body { background: radial-gradient(ellipse at 70% 0%, var(--bg-hi) 0%, var(--bg) 55%) fixed, var(--bg); }

  /* ① 图腾 */
  .hero { display: grid; grid-template-columns: 1fr; gap: 6px; padding-top: 14px; }
  .hero h1 { margin: 0; font-size: clamp(24px, 6.4vw, 40px); line-height: 1.2; letter-spacing: .5px; }
  .hero h1 .en { color: var(--ac); font-weight: 700; }
  .hero h1 .tag { display: block; font-size: .56em; font-weight: 600; color: var(--ac2); margin-top: 4px; letter-spacing: 1px; }

  .hero .lead { margin: 8px 0 0; color: var(--tx); font-size: 15px; max-width: 34em; }
  .totem { position: relative; height: 54vw; min-height: 230px; max-height: 440px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--glass-bd); background: radial-gradient(ellipse at 50% 40%, var(--bg-hi) 0%, var(--bg) 78%); box-shadow: var(--sh-1); }
  .totem canvas.gl3 { z-index: 1; }
  .totem .cap, .totem .hudtag { z-index: 2; }
  .totem .hudtag { position: absolute; right: 10px; top: 8px; font: 11px/1.3 var(--mono); color: var(--cy2); letter-spacing: 1px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .totem canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .totem .cap { position: absolute; left: 10px; bottom: 6px; font-size: 11px; color: var(--mu); text-shadow: 0 1px 2px #000; pointer-events: none; }
  .gctl { margin: 8px 0 0; }
  .gctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--mu); }
  .gctl output { color: var(--cy2); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .gctl input[type=range] { width: 100%; height: 32px; margin: 0; accent-color: var(--ac); }
  .gctl .hint { font-size: 12px; color: var(--dim); margin: 0; }

  /* ② 任务卡 */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--tx); background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    border: 1px solid var(--glass-bd); border-radius: var(--r-lg); box-shadow: var(--sh-1); padding: 12px 14px; transition: border-color var(--dur), transform var(--dur) var(--ease); }
  .card:hover, .card:focus-visible { border-color: var(--ac); }
  .card:hover { transform: translateY(-2px); }
  .card .top { display: flex; gap: 10px; align-items: center; }
  .card .top canvas { width: 56px; height: 56px; flex: none; }
  .card .who { font-size: 13px; color: var(--cy2); }
  .card .diff { font-size: 12px; color: var(--pred); letter-spacing: 1px; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.4; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--mu); flex-wrap: wrap; }
  .card .meta b { color: var(--pred); font-weight: 600; letter-spacing: 1px; }
  .card .lv { display: flex; gap: 4px; flex-wrap: wrap; }
  .card .lv span { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .card .lv span.ok { border-color: var(--ok-bd); color: var(--ac2); }
  .card .go { margin-top: auto; align-self: flex-start; }

  /* ③ 尺度轴图谱 */
  .maphead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .maphead .cnt { font-size: 13px; color: var(--mu); }
  .maphead .cnt b { color: var(--ac2); }
  .mapbox { display: flex; border: 1px solid var(--glass-bd); border-radius: var(--r-lg); background: var(--map-bg); overflow: hidden; }
  .mapcols { flex: none; width: 76px; border-right: 1px solid var(--map-line); background: var(--map-col); }
  .mapcols div { display: flex; align-items: center; padding: 0 6px 0 9px; font-size: 12px; font-weight: 600; color: var(--ac2); line-height: 1.25; border-top: 1px solid var(--line2); }
  .mapcols div:first-child, .mapcols div:last-child { border-top: 0; }
  .mapwrap { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-color: var(--scroll) var(--map-bg); }
  @media (max-width: 599px) { .mapcols { width: 58px; } .mapcols div { font-size: 11px; padding: 0 4px 0 6px; } }
  .map { position: relative; }
  .map .row { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line2); }
  .map .row:nth-child(even) { background: rgba(167,139,250,.035); }
  .map .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--map-tick); z-index: 0; }
  .map .tl { position: absolute; font-size: 11px; color: var(--mu); transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; z-index: 1; }
  .map .lm { position: absolute; font-size: 11px; color: var(--dim); transform: translateX(-50%); white-space: nowrap; z-index: 1; }
  .star { position: absolute; z-index: 2; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 6px 0 2px; border: 0; background: none;
    font-size: 12px; color: var(--star-tx); cursor: pointer; white-space: nowrap; border-radius: 8px; }
  .star i { width: 9px; height: 9px; border-radius: 50%; background: var(--star-off); flex: none; box-shadow: 0 0 0 2px rgba(74,69,112,.25); }
  .star:hover, .star:focus-visible { background: rgba(167,139,250,.12); color: var(--tx); }
  .star.on { color: var(--tx); font-weight: 600; }
  .star.on i { background: var(--star-on); box-shadow: 0 0 6px 2px var(--ac), 0 0 14px 4px rgba(167,139,250,.55); }
  .star.task i { box-shadow: 0 0 0 2px rgba(167,139,250,.45); }
  .star.on.task i { box-shadow: 0 0 6px 2px var(--ac), 0 0 14px 4px rgba(167,139,250,.55); }
  .maplegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mu); margin: 8px 2px 0; }
  .maplegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; background: var(--star-off); }
  .maplegend i.on { background: var(--star-on); box-shadow: 0 0 6px 2px var(--ac); }
  .maplegend i.task { box-shadow: 0 0 0 2px rgba(167,139,250,.6); }
  .swipe { display: block; font-size: 12px; color: var(--dim); margin: 0 0 6px; }


  /* ③b 宇宙尺度星图 3D(v0.2-α2,仅 gl3d 可用时插入;失败整块移除回 2D) */
  .sm-sec[data-mode="3d"] .swipe, .sm-sec[data-mode="3d"]:not(.show2d) .mapbox { display: none; }
  .smtog { display: none; }
  .sm-sec[data-mode="3d"] .smtog { display: inline-flex; }
  .sm3 { position: relative; height: min(74vh, 680px); min-height: 460px; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--glass-bd);
    background: #05041a; box-shadow: var(--sh-1); isolation: isolate; }
  .sm3-view { position: absolute; inset: 0; touch-action: pan-y; outline: none; -webkit-user-select: none; user-select: none; }
  .sm3-view:focus-visible { box-shadow: inset 0 0 0 2px var(--ac); }
  .sm3:focus-within { border-color: var(--ac); }
  .sm3-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sm3-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .sm3-lb { position: absolute; left: 0; top: 0; font-size: 12px; line-height: 1; padding: 3px 6px; border-radius: 6px; white-space: nowrap; color: #d4cff5;
    background: rgba(5,4,26,.62); text-shadow: 0 1px 2px #000; will-change: transform; }
  .sm3-lb.on { color: #fff; font-weight: 600; }
  .sm3-lb.task { color: #e9e3ff; }
  .sm3-lb.st:not(.on):not(.task) { color: #b9b3dd; }
  .sm3-lb.hi { background: rgba(124,92,240,.85); color: #fff; }
  .sm3-lb.lm { font: 11px/1 var(--mono); letter-spacing: .5px; color: var(--cy2); background: rgba(5,4,26,.7); border: 1px solid var(--cy-line); }
  .sm3-ring { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 3px var(--ac), 0 0 16px var(--ac); pointer-events: none; display: none; }
  .sm3-hud { position: absolute; left: 12px; top: 10px; display: flex; gap: 10px; align-items: baseline; font: 11px/1.3 var(--mono); color: var(--cy2); letter-spacing: 1px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .sm3-hud .sm3-hint { color: var(--mu); letter-spacing: 0; font-family: var(--font); }
  .sm3.has-card .sm3-hud { opacity: 0; }
  .sm3-card { position: absolute; left: 12px; top: 12px; width: 300px; max-height: calc(100% - 112px); overflow: auto; z-index: 3; padding: 14px 16px 12px;
    background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); border: 1px solid var(--glass-bd); border-radius: var(--r-lg); box-shadow: var(--sh-1); color: var(--tx); }
  .sm3-card[hidden] { display: none; }
  .sm3-x { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--mu); font-size: 22px; line-height: 1; cursor: pointer; }
  .sm3-x:hover, .sm3-x:focus-visible { background: rgba(167,139,250,.18); color: var(--tx); }
  .sm3-ch { display: flex; gap: 10px; align-items: center; padding-right: 30px; }
  .sm3-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .sm3-card h3 { margin: 0; font-size: 18px; line-height: 1.3; }
  .sm3-meta { margin: 2px 0 0; font-size: 12px; color: var(--cy2); font-family: var(--mono); }

  .sm3-chip.task { border-color: var(--ac); color: var(--ac2); }
  .sm3-desc { margin: 8px 0; font-size: 14px; line-height: 1.6; }
  .sm3-lk { margin: 0 0 8px; font-size: 13px; color: var(--mu); line-height: 1.5; }
  .sm3-src { margin: 8px 0 0; font-size: 11px; color: var(--dim); }
  .sm3-bar { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 4px 10px;
    padding: 6px 12px 4px; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); border: 1px solid var(--glass-bd); border-radius: var(--r-lg); }
  .sm3-read { min-width: 96px; font-size: 12px; color: var(--mu); white-space: nowrap; }
  .sm3-re { display: block; font: 600 15px/1.2 var(--mono); color: var(--cy2); font-variant-numeric: tabular-nums; }
  .sm3-z { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-bd); background: var(--btn); color: var(--tx); font-size: 18px; line-height: 1; cursor: pointer; flex: none; }
  .sm3-z:hover, .sm3-z:focus-visible { border-color: var(--ac); }
  .sm3-track { position: relative; min-width: 0; padding: 0 16px; }
  .sm3-rule { position: relative; height: 26px; cursor: pointer; }
  .sm3-rule > i { position: absolute; bottom: 0; width: 1px; height: 6px; background: rgba(165,180,252,.45); }
  .sm3-rule > i.mj { height: 10px; background: rgba(199,210,254,.85); }
  .sm3-rule > i.sm3-cur { width: 2px; height: 13px; background: var(--cy); box-shadow: 0 0 8px var(--cy); transform: translateX(-1px); }
  .sm3-tl { position: absolute; top: 0; transform: translateX(-50%); padding: 1px 3px; border: 0; background: none; color: var(--mu); font: 11px/1.2 var(--mono); cursor: pointer; border-radius: 4px; white-space: nowrap; }
  .sm3-tl:hover, .sm3-tl:focus-visible { color: #fff; background: rgba(167,139,250,.25); }
  .sm3-sl { display: block; width: calc(100% + 32px); margin: 0 -16px; height: 26px; accent-color: var(--ac); }
  .smlegend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--mu); margin: 8px 2px 0; }
  .smlegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; }
  .sm-sec:not([data-mode="3d"]) .smlegend.cons { display: none; }
  @media (max-width: 1023px) { .sm3-tl.odd { display: none; } }
  @media (max-width: 419px) { .sm3-tl.n12 { display: none; } }
  @media (orientation: portrait) and (max-width: 820px) {
    .sm3 { height: min(78vh, 640px); min-height: 440px; }
    .sm3-hud .sm3-hint { display: none; }
    .sm3-card { left: 8px; right: 8px; top: auto; bottom: 104px; width: auto; max-height: 46%; padding: 12px 14px 10px; }
    .sm3-bar { left: 6px; right: 6px; bottom: 6px; grid-template-columns: auto 1fr auto; padding: 4px 8px 2px; }
    .sm3-read { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
    .sm3-re { display: inline; font-size: 13px; }
  }
  @media (orientation: landscape) and (max-height: 519px) {
    .sm3 { height: calc(100vh - 64px); min-height: 240px; }
    .sm3-meta { font-size: 11px; }
    .sm3-hud .sm3-hint { display: none; }
    .sm3-card { width: 244px; top: 8px; left: 8px; bottom: 8px; max-height: none; padding: 10px 12px 8px; }
    .sm3.has-card .sm3-bar { left: 260px; }
    .sm3.has-card .sm3-read { display: none; }
    .sm3.has-card .sm3-bar { grid-template-columns: auto 1fr auto; }
    .sm3.has-card .sm3-tl.n12 { display: none; }
    .sm3-src { display: none; }
    .sm3-card h3 { font-size: 15px; }
    .sm3-desc { font-size: 13px; line-height: 1.5; margin: 6px 0; }
    .sm3-bar { left: 6px; right: 6px; bottom: 6px; padding: 3px 8px 1px; }
    .sm3-read { min-width: 84px; }
    .sm3-tl.odd { display: none; }
  }

  /* ⑤ 底部 */
  .hm-foot { margin-top: 30px; padding: 14px 0 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--mu); }
  .hm-foot .nv-row { margin-bottom: 10px; }
  .hm-foot p { margin: 6px 0; }
  .hm-foot .dim { color: var(--dim); font-size: 12px; }

  @media (min-width: 900px) {
    .hero { grid-template-columns: 1fr 1.25fr; gap: 24px; align-items: center; padding-top: 24px; }
    .totem { height: 420px; max-height: none; }
    .hero .txt { order: 0; }
  }
  @media (orientation: landscape) and (max-height: 519px) {
    .hero { grid-template-columns: 1fr 1.1fr; gap: 14px; align-items: center; }
    .hero h1 { font-size: 24px; }
    .hero .lead { font-size: 13px; }
    .totem { height: 230px; min-height: 0; }
  }
  .nv-top .nv-sp { display: block !important; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

  var G3 = null;   // Three.js 场景(可用时)

  }

  gIn.addEventListener("input", function () {
    gTarget = +gIn.value; gOut.textContent = "×" + gTarget.toFixed(1);
    hudtag.textContent = "G ×" + gTarget.toFixed(1) + " · " + (G3 ? "3D" : "2D");
    if (RM) gCur = gTarget;
    kick();
  });
  gIn.addEventListener("change", function () { SND.play("tick"); });
  if (W.IntersectionObserver) new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) kick(); }).observe(cv);
  D.addEventListener("visibilitychange", function () { if (!D.hidden) kick(); });
  var rT; W.addEventListener("resize", function () { clearTimeout(rT); rT = setTimeout(kick, 80); });
  kick();

  /* ---------------- 图腾 3D(Three.js,按需加载;任何失败回到上面的 2D) ---------------- */
  function fallback2D(err) {
    if (G3) { try { G3.dispose(); } catch (e) {} }
    G3 = null; NV.gl3d.disable("3D 运行失败");

    totem.setAttribute("data-mode", "2d"); hudtag.textContent = "G ×" + gTarget.toFixed(1) + " · 2D";
    if (err && W.console && console.warn) console.warn("[宙律] 3D 不可用,已回退 2D:", err && err.message || err);
    kick();
  }
  function mount3D(THREE) {
    var cv3 = el("canvas", { class: "gl3", role: "img", "aria-label": cv.getAttribute("aria-label") });
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: cv3, antialias: true, alpha: true, powerPreference: "low-power" }); }
    catch (e) { throw e; }
    renderer.setPixelRatio(Math.min(2, W.devicePixelRatio || 1));
    renderer.setClearColor(0x000000, 0);
    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x07061a, 4.2, 9.2);
    var cam = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
    cam.position.set(0, 1.75, 4.9); cam.lookAt(0, -0.3, 0);
    scene.add(new THREE.AmbientLight(0x6a5acd, 0.55));
    var sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-3, 3, 2.5); scene.add(sun);
    var rim = new THREE.PointLight(0x67e8f9, 6, 10); rim.position.set(2.6, 0.6, -1.5); scene.add(rim);

    function canvasTex(w, h, paint) { var c = D.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h); var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
    // 弯曲时空网格:LineSegments,随引力更新顶点

    var pos = new Float32Array(segs * 6), col = new Float32Array(segs * 6);
    var gridGeo = new THREE.BufferGeometry();
    gridGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    gridGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    var gridMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85 });
    var grid = new THREE.LineSegments(gridGeo, gridMat); scene.add(grid);
    var cA = new THREE.Color(0xa78bfa), cB = new THREE.Color(0x67e8f9), tmp = new THREE.Color();
    function fillGrid(g) {
      var k = 0;
      function put(x, z) { var y = well(x, z, g), d = Math.min(1, Math.sqrt(x * x + z * z) / 1.6); tmp.copy(cB).lerp(cA, d); pos[k] = x; pos[k + 1] = y; pos[k + 2] = z; col[k] = tmp.r; col[k + 1] = tmp.g; col[k + 2] = tmp.b; k += 3; }
      for (var i = 0; i <= NZ; i++) { var z = -RZ + 2 * RZ * i / NZ; for (var j = 0; j < M; j++) { put(-RX + 2 * RX * j / M, z); put(-RX + 2 * RX * (j + 1) / M, z); } }
      for (var a = 0; a <= NX; a++) { var x = -RX + 2 * RX * a / NX; for (var b = 0; b < M; b++) { put(x, -RZ + 2 * RZ * b / M); put(x, -RZ + 2 * RZ * (b + 1) / M); } }

    var bands = canvasTex(256, 128, function (c, w, h) {
      var g = c.createLinearGradient(0, 0, 0, h);
      [["#2a1d6e", 0], ["#7c5cf0", .18], ["#c4b5fd", .3], ["#8b6cf6", .42], ["#e9e2ff", .5], ["#a78bfa", .6], ["#5b3fc4", .75], ["#c4b5fd", .86], ["#2a1d6e", 1]].forEach(function (s) { g.addColorStop(s[1], s[0]); });
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      c.globalAlpha = .18; for (var i = 0; i < 40; i++) { c.fillStyle = i % 2 ? "#fff" : "#1b1450"; c.fillRect(0, Math.random() * h, w, 1 + Math.random() * 2); }
    });
    var planet = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), new THREE.MeshStandardMaterial({ map: bands, roughness: 0.65, metalness: 0.05, emissive: 0x2a1d6e, emissiveIntensity: 0.35 }));

    var pivot = new THREE.Group(); pivot.add(planet); scene.add(pivot);
    // 轨道环(三层)
    var ringGrp = new THREE.Group(); ringGrp.rotation.set(-Math.PI / 2 + 0.42, 0.0, 0.3);
    [[1.45, 1.75, 0.55], [1.8, 2.05, 0.35], [2.1, 2.22, 0.5]].forEach(function (r) {
      ringGrp.add(new THREE.Mesh(new THREE.RingGeometry(r[0], r[1], 128), new THREE.MeshBasicMaterial({ color: 0xc4b5fd, transparent: true, opacity: r[2], side: THREE.DoubleSide, depthWrite: false })));
    });
    pivot.add(ringGrp);
    // 光晕
    var glowTex = canvasTex(128, 128, function (c, w) { var g = c.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); g.addColorStop(0, "rgba(167,139,250,.55)"); g.addColorStop(1, "rgba(167,139,250,0)"); c.fillStyle = g; c.fillRect(0, 0, w, w); });
    var glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    pivot.add(glow);
    // 卫星 + 虚线轨道
    var moon = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfbe9ff }));
    var orbPts = []; for (var i = 0; i <= 128; i++) { var a = i / 128 * Math.PI * 2; orbPts.push(new THREE.Vector3(Math.cos(a), 0, Math.sin(a))); }
    var orbGeo = new THREE.BufferGeometry().setFromPoints(orbPts);
    var orbit = new THREE.Line(orbGeo, new THREE.LineDashedMaterial({ color: 0xc4b5fd, dashSize: 0.04, gapSize: 0.05, transparent: true, opacity: 0.55 }));

    var orbGrp = new THREE.Group(); orbGrp.rotation.set(0.22, 0, 0.18); orbGrp.add(orbit); orbGrp.add(moon); pivot.add(orbGrp);

    var stG = new THREE.BufferGeometry(); stG.setAttribute("position", new THREE.BufferAttribute(sp, 3));

    }

    cv.style.visibility = "hidden"; cv.setAttribute("aria-hidden", "true");
    totem.setAttribute("data-mode", "3d"); hudtag.textContent = "G ×" + gTarget.toFixed(1) + " · 3D";
    return { render: render, dispose: dispose };
  }
  if (NV.gl3d.ok) {
    NV.gl3d.load().then(function (THREE) {
      try { G3 = mount3D(THREE); kick(); }
      catch (err) { var c3 = totem.querySelector("canvas.gl3"); if (c3) c3.remove(); G3 = null; fallback2D(err); }
    }).catch(function (err) { fallback2D(err); });
  }
})();
