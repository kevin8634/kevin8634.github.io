<style>

  .lb-top .ttl { color: #c4b5fd; font-size: 13px; white-space: nowrap; margin-right: 6px; }
  .tab { appearance: none; border: 1px solid var(--line); background: transparent; color: #ddd6fe; border-radius: 999px; padding: 5px 13px; font: 13px/1.2 var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .tab.on { background: var(--pv); border-color: var(--pv); color: #fff; }

  .btn2 { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: #ede9fe; border-radius: 10px; padding: 6px 12px; font: 13px/1.2 var(--font); cursor: pointer; white-space: nowrap; }
  .btn2:hover, .tab:not([aria-disabled="true"]):hover { border-color: var(--pv2); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
  .lb-q { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); padding: 9px 18px; font-size: 17px; font-weight: 700; max-width: min(640px, 52vw); text-align: center; }
  .lb-left { position: absolute; left: 14px; top: 118px; width: 232px; padding: 12px 14px; }
  .lb-right { position: absolute; right: 14px; top: 118px; width: 272px; padding: 12px 14px; max-height: calc(100% - 230px); overflow: auto; }

  .sl small { display: block; font-size: 11.5px; color: var(--or); min-height: 15px; }

  .dial-t { text-align: center; font-size: 11.5px; color: #a5a1c8; margin-top: 2px; }

  .card { border-radius: 10px; padding: 8px 9px; font-size: 12.5px; line-height: 1.6; }
  .card b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .card.a { background: rgba(103,232,249,.08); border: 1px solid rgba(103,232,249,.45); }
  .card.a b { color: var(--cy); }
  .card.b { background: rgba(251,191,36,.07); border: 1px solid rgba(251,191,36,.45); }
  .card.b b { color: var(--or); }
  .card .mask { color: #8a85b5; letter-spacing: 2px; }
  .fx { background: rgba(0,0,0,.28); border-radius: 8px; padding: 7px 10px; font: 15px/1.4 "Times New Roman", Georgia, serif; color: #fde68a; margin-bottom: 6px; }
  .why { font-size: 12.5px; color: #c4c0e6; margin: 0 0 10px; }
  .pq { font-size: 13px; margin: 0 0 6px; }
  .opt { display: block; width: 100%; text-align: left; appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: #ede9fe; border-radius: 8px; padding: 6px 10px; margin: 0 0 6px; font: 13px/1.35 var(--font); cursor: pointer; }
  .opt::before { content: "○ "; color: #a5a1c8; }
  .opt.sel { border-color: var(--pv); background: rgba(139,92,246,.22); }
  .opt.sel::before { content: "● "; color: #fff; }
  .opt.ok { border-color: #34d399; background: rgba(52,211,153,.14); }
  .opt.no { border-color: #f87171; background: rgba(248,113,113,.12); }
  .pfb { font-size: 12.5px; min-height: 18px; margin: 2px 0 8px; }
  .pfb.ok { color: #6ee7b7; } .pfb.no { color: #fca5a5; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .bdg { font-size: 11px; border-radius: 999px; padding: 2px 8px; border: 1px solid; }
  .bdg.c { color: #86efac; border-color: rgba(134,239,172,.5); }
  .bdg.i { color: #fcd34d; border-color: rgba(252,211,77,.5); }
  .bdg.v { color: #c4b5fd; border-color: rgba(196,181,253,.45); }
  .bdg.k { color: #67e8f9; border-color: rgba(103,232,249,.45); }
  .play { position: absolute; right: calc(272px + 54px); bottom: 118px; width: 64px; height: 64px; border-radius: 50%; border: 0; background: radial-gradient(circle at 35% 30%, #a78bfa, #7c3aed); color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 0 30px rgba(139,92,246,.6); }
  .play[disabled] { opacity: .6; cursor: default; }

  .lb-nb { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(660px, calc(100% - 560px)); min-width: 420px; padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; }

  .nb-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .nbe b { display: block; font-size: 13px; }
  .nbe.empty { color: #8a85b5; }
  .nb-btns { display: flex; flex-direction: column; gap: 6px; }
  .lb-url { position: absolute; left: 14px; bottom: 10px; font: 11px/1.3 ui-monospace, Menlo, monospace; color: #8a85b5; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-note { position: absolute; right: 14px; bottom: 10px; font-size: 11px; color: #8a85b5; text-align: right; max-width: 280px; line-height: 1.45; }
  .lb-note a { color: #a5a1c8; }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 9; background: #1c1752; border: 1px solid var(--pv2); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  /* 大厅 */
  .hall { position: relative; z-index: 2; max-width: 1120px; margin: 0 auto; padding: 84px 18px 50px; }
  .hall h1 { font-size: 26px; margin: 6px 0 4px; }
  .hall .sub { color: #c4c0e6; margin: 0 0 18px; font-size: 14px; }
  .labs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .lc { position: relative; display: block; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); text-decoration: none; color: #ede9fe; background: #0c0a24; transition: transform .2s, border-color .2s; }
  .lc:hover { transform: translateY(-3px); border-color: var(--pv2); }
  .lc .im { aspect-ratio: 16/8; background-size: cover; background-position: center; position: relative; }
  .lc .im::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,6,26,0) 30%, rgba(7,6,26,.9)); }
  .lc .im span { position: absolute; left: 12px; bottom: 8px; z-index: 1; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .lc .tx { padding: 10px 12px 12px; font-size: 13px; color: #c4c0e6; }
  .lc .tx b { display: block; color: #fff; font-size: 15px; margin-bottom: 4px; }
  .lc.soon { opacity: .55; pointer-events: none; border-style: dashed; }
  .hall .nbx { margin-top: 22px; padding: 14px; }
  .ent { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,.07); padding: 8px 2px; font-size: 13px; }
  .ent .d { color: #8a85b5; font-size: 12px; }
  .ent a { color: var(--cy); }
  @media (max-width: 999px), (max-height: 619px) {
    body { overflow-y: auto; }
    .lb-ui { height: auto; }
    .lb-stage { position: relative; height: 52svh; min-height: 260px; }
    .lb-ui { display: flex; flex-direction: column; gap: 10px; padding: 0 10px 18px; }
    .lb-top { position: fixed; z-index: 5; left: 8px; right: 8px; top: 6px; padding: 6px 8px; gap: 5px; }
    .lb-top .ttl, .lb-top .sp { display: none; }
    .tab { padding: 4px 9px; font-size: 12px; }
    .lb-q, .lb-left, .lb-right, .lb-nb, .lb-url, .lb-note, .play, .play-t { position: static; transform: none; width: auto; max-width: none; min-width: 0; max-height: none; }
    .lb-q { order: 1; font-size: 15px; margin-top: 10px; }
    .playrow { order: 2; display: flex; align-items: center; gap: 12px; justify-content: center; }
    .play { width: 56px; height: 56px; }
    .play-t { position: static; width: auto; }
    .lb-left { order: 3; } .lb-right { order: 4; } .lb-nb { order: 5; grid-template-columns: 1fr; } .lb-url { order: 6; max-width: 100%; } .lb-note { order: 7; text-align: left; max-width: none; }
    .nb-row { grid-template-columns: 1fr; } .nb-btns { flex-direction: row; }
    .dial { width: 96px; height: 96px; }
    .labs { grid-template-columns: 1fr; }
    .ent { grid-template-columns: 1fr; }
    .hall { padding-top: 70px; }
  }
  @media (min-width: 1000px) and (min-height: 620px) { .playrow { display: contents; } }
</style>

<body>
<noscript><p style="padding:16px">规则改写台需要开启 JavaScript。<a href="../">返回宙律首页</a></p></noscript>
<div class="lb-stage" id="stage" hidden><canvas id="gl" aria-hidden="true"></canvas><canvas id="ov" role="img" aria-label="实验舞台"></canvas></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="root"></div>
<script src="../core/labmodel.js"></script>
<script>
"use strict";
(function () {
  var M = window.NVLab, D = document, W = window, ROOT = "../";
  var Q = new URLSearchParams(location.search);
  var RM = W.matchMedia && W.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || (W.matchMedia && W.matchMedia("(pointer: coarse)").matches);
  W.NV = W.NV || { perf: { tier: MOBILE ? "mid" : "high", mobile: MOBILE, prCap: MOBILE ? 1.5 : 2 }, RM: RM };
  var NBKEY = "gn:nv:lab", TS = Math.min(20, Math.max(1, +Q.get("ts") || 1));   // ts:自测加速(不影响结果)
  function el(t, a, kids) { var e = D.createElement(t); if (a) for (var k in a) { if (k === "text") e.textContent = a[k]; else if (k === "html") e.innerHTML = a[k]; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]); else if (a[k] != null && a[k] !== false) e.setAttribute(k, a[k]); } (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? D.createTextNode(c) : c); }); return e; }
  function toast(t) { var x = D.getElementById("toast"); x.textContent = t; x.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(function () { x.classList.remove("on"); }, 1800); }
  var NB = {
    list: function () { try { var a = JSON.parse(localStorage.getItem(NBKEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } },
    add: function (e) { var a = NB.list(); a.unshift(Object.assign({ t: new Date().toISOString() }, e)); a.length = Math.min(a.length, 60); try { localStorage.setItem(NBKEY, JSON.stringify(a)); } catch (x) {} return a; },
    remove: function (t) { var a = NB.list().filter(function (e) { return e.t !== t; }); try { localStorage.setItem(NBKEY, JSON.stringify(a)); } catch (x) {} },
    exportJSON: function () { return JSON.stringify({ schema: "gn-lab-notebook/1", world: "nv", exported: new Date().toISOString(), entries: NB.list() }, null, 1); }
  };
  function download(name, blob) { var a = el("a", { href: URL.createObjectURL(blob), download: name }); D.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); }
  var TABS = [["gravity", "重力"], ["friction", "摩擦"], ["sound", "声速"], ["light", "光速"], ["tide", "潮汐"]];
  var root = D.getElementById("root");
  var CREDIT = "简化模型,纯虚拟实验(不计空气阻力、无 ABS)。贴图:Poly Haven(CC0)、NASA(公有领域)、NASA/Goddard SVS 星图;月球 Solar System Scope(<a href='https://creativecommons.org/licenses/by/4.0/'>CC BY 4.0</a>,已缩放)。";

  function topbar(cur) {
    var t = el("header", { class: "lb-top pan" }, [el("a", { class: "home", href: ROOT, text: "← 宙律" }), el("span", { class: "ttl", text: "规则改写台 · 宇宙常数旋钮台" })]);
    TABS.forEach(function (x) {
      if (!x[0]) t.appendChild(el("span", { class: "tab", "aria-disabled": "true", text: x[1] }));
      else t.appendChild(el("a", { class: "tab" + (x[0] === cur ? " on" : ""), href: "?lab=" + x[0], "aria-current": x[0] === cur ? "page" : null, text: x[1] }));
    });
    t.appendChild(el("span", { class: "sp" }));
    return t;
  }

  /* ================= 大厅 ================= */
  var labId = Q.get("lab");
  if (!M.LABS[labId]) { hall(); return; }

  function hall() {
    D.title = "规则改写台 · 宙律 Nomoverse";
    D.body.style.background = "radial-gradient(1200px 600px at 70% -10%, #1c1752, #07061a 60%)";
    var ui = el("div", { class: "lb-ui" }, [topbar(null)]);
    var h = el("main", { class: "hall" }, [
      el("h1", { text: "规则改写台" }),
      el("p", { class: "sub", text: "把一条宇宙规律拧一下:重力变小、路面结冰、声音变慢、光变慢、月亮拉近。左右 A/B 对照只改一个变量,先猜再看。记录本只存在你这台设备上。" })
    ]);
    var cards = el("div", { class: "labs" });
    [["gravity", "重力", "如果月球上的重力只有地球的 1/6,同样的投篮会飞多远?", "../assets/hoop/sky_space_2k.jpg", "地球 · 月球 · 火星 · 木星 · 引力 ×2"],
     ["friction", "摩擦", "路面结冰时,同样车速要多远才能停下?", "../assets/hoop/asphalt_d1k.jpg", "干燥 · 湿滑 · 结冰 · 车速 +20%"],
     ["sound", "声速", "如果声音变慢,救护车会追上自己的声音吗?", "../assets/hoop/sky_dusk_2k.jpg", "空气 · 水 · 氦气 · 慢声速"],
     ["light", "光速", "如果光速只有每秒 10 米,打电话会怎样?", "../assets/hoop/planet_earth_1k.jpg", "现实 · 打到月球 · 打到火星 · 光速 10 m/s"],
     ["tide", "潮汐", "月亮再近一点,潮水会涨多高?", "../assets/tide/moon_2k.jpg", "今天 · 月亮刚形成 · 月球 ×2 · 洛希极限内"]].forEach(function (c) {
      cards.appendChild(el("a", { class: "lc", href: "?lab=" + c[0] }, [el("div", { class: "im", style: "background-image:url(" + c[3] + ")" }, [el("span", { text: c[1] })]), el("div", { class: "tx" }, [el("b", { text: c[2] }), c[4]])]));
    });
    h.appendChild(cards);
    var box = el("section", { class: "pan nbx", "aria-label": "实验记录本" });
    function drawNB() {
      box.innerHTML = "";
      var list = NB.list();
      box.appendChild(el("div", { style: "display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap" }, [el("b", { text: "实验记录本(" + list.length + " 条,只存本机)" }),
        el("button", { class: "btn2", type: "button", text: "导出 JSON", onclick: function () { download("genesis-nv-lab.json", new Blob([NB.exportJSON()], { type: "application/json" })); } })]));
      if (!list.length) box.appendChild(el("p", { class: "dial-t", style: "text-align:left", text: "还没有记录。进一个实验,猜一猜、跑一次,结果会自动记在这里。" }));
      list.forEach(function (e) {
        var lab = (e.id || "").split(".")[2], L = M.LABS[lab] || null, P = L ? M.preset(lab, e.preset) : null;
        box.appendChild(el("div", { class: "ent" }, [el("span", { class: "d", text: new Date(e.t).toLocaleString("zh-CN", { hour12: false }) }),
          el("span", {}, [(L ? L.name : "") + " · " + (P ? P.label : "") + " · " + (e.summary || "") + (e.guess ? (e.correct ? " · 猜对 ✓" : " · 猜「" + e.guess + "」") : "") + " ", el("a", { href: "?lab=" + lab + "&preset=" + e.preset, text: "复现" })]),
          el("button", { class: "btn2", type: "button", "aria-label": "删除这条记录", text: "删除", onclick: function () { NB.remove(e.t); drawNB(); } })]));
      });
    }
    drawNB(); h.appendChild(box);
    h.appendChild(el("p", { class: "lb-note", style: "position:static;text-align:left;max-width:none;margin-top:16px", html: CREDIT + " <a href='../LICENSES.md'>素材台账</a>" }));
    ui.appendChild(h); root.appendChild(ui);
  }

  /* ================= 实验台 ================= */
  var L = M.LABS[labId], pid = M.preset(labId, Q.get("preset")).id;
  var base = Object.assign({}, L.base), bv = null, guess = null, revealed = false, tRun = null, runId = 0, side = "b";
  function curPair() { var o = Object.assign({}, base); if (bv != null) o["b_" + (M.preset(labId, pid).vary || L.vary)] = bv; return M.pair(labId, pid, o); }
  // ?p=k:v,...  自定义参数复现(vary 键写进 B)
  (function () {
    var p = Q.get("p"); if (!p) return; var vary = M.preset(labId, pid).vary || L.vary;
    p.split(",").forEach(function (kv) { var a = kv.split(":"); if (a.length !== 2 || !isFinite(+a[1])) return; var spec = L.params.find(function (q) { return q.k === a[0]; }); if (!spec) return; var v = Math.min(spec.max, Math.max(spec.min, +a[1])); if (a[0] === vary) bv = v; else base[a[0]] = v; });
  })();
  D.title = L.name + " · 规则改写台 · 宙律 Nomoverse";
  var stageEl = D.getElementById("stage"); stageEl.hidden = false;
  var ui = el("div", { class: "lb-ui" });
  var top = topbar(labId);
  var shareB = el("button", { class: "btn2", type: "button", text: "分享复现链接", onclick: share }); top.appendChild(shareB);
  top.appendChild(el("a", { class: "btn2", href: "./", style: "text-decoration:none", text: "大厅 · 记录本" }));
  ui.appendChild(top);
  var qEl = el("h1", { class: "lb-q pan", text: L.question }); ui.appendChild(qEl);
  // 左:改写规则
  var left = el("section", { class: "lb-left pan", "aria-label": "改写规则" }, [el("h2", { class: "h3", text: "改写规则" })]);
  var chips = el("div", { class: "chips", role: "group", "aria-label": "预设" }); left.appendChild(chips);
  var sliders = el("div"); left.appendChild(sliders);
  var dial = el("canvas", { class: "dial", width: 232, height: 232, role: "slider", tabindex: "0", "aria-label": "常数旋钮" }); left.appendChild(dial);
