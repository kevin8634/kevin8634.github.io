    card: { t: "洛希极限", b: "卫星靠自身引力聚在一起;行星的引潮力想把它拉长。卫星越靠近,引潮力按 1/d³ 迅速增大,到洛希极限(流体卫星约为行星半径的 2.44 倍 × 密度比的立方根)时,卫星被撕碎。地球对月亮的洛希极限约 1.8 万 km,对冰卫星约 2.8 万 km;土星的主环就在它对冰的洛希极限(约 2.2 个土星半径)以内。", f: "d洛希 = 2.44·R行星·(ρ行星/ρ卫星)^(1/3);平衡潮差 ∝ (M/M⊕)(R/d)³·R,与 G 无关", src: "OpenStax《Astronomy 2e》12.5 行星环;NASA Saturn Fact Sheet" },
    init: function (L) { L.st = { dv: D_ER, from: D_ER, to: D_ER, k: 1, brk: 0, broke: false, g2broke: false }; },
    run: function (L) {
      var st = L.st; st.from = D_ER; st.to = Math.pow(10, L.v.lg); st.k = 0; st.brk = 0; st.done = false;
      st.rho = MAT[L.v.mat][1]; st.g2 = !!L.v.g2; st.lim = P.roche(1, P.RHO_EARTH, st.rho);
      L.sfx("whoosh");
    },
    frame: function (L, dt) {
      var st = L.st, c = L.ctx, run = L.phase === "running";
      var rho = run ? st.rho : MAT[L.v.mat][1], lim = P.roche(1, P.RHO_EARTH, rho);
      if (run) {
        if (st.k < 1) { st.k = Math.min(1, st.k + dt * (L.RM ? 2 : 0.5)); var e = 1 - Math.pow(1 - st.k, 3); st.dv = Math.exp(Math.log(st.from) + (Math.log(st.to) - Math.log(st.from)) * e); }
        if (st.dv < lim) st.brk = Math.min(1, st.brk + dt * (L.RM ? 2 : 0.4));
      } else if (L.phase !== "compare") { st.dv = Math.pow(10, L.v.lg); st.brk = 0; }
      var d = st.dv, rng = 0.535 * Math.pow(D_ER / d, 3), lvl = Math.min(1.7, 1.15 * Math.pow(D_ER / d, 3));
      var Lay = layout(L, { fx: 0.28, rk: 0.15 });
      var tA = (performance.now() / 1000) * (L.RM ? 0 : 0.35);
      scene(L, Lay, { spin: tA, town: 0, moonAng: 0, moonD: visD(d), moonS: 1.25, Am: Math.min(0.42, 0.13 * Math.pow(D_ER / d, 0.75)), As: 0, sunAng: Math.PI * 0.85, brk: st.brk,
        level: (P.P2(Math.cos(tA)) * 0.6 + 0.4) * lvl, moonAlt: 9 + 6 * Math.min(1, 3 / Math.max(1, d / 6)), moonAz: 0, phase: Math.PI * 0.9 });
      if (Lay.S) {   // 洛希极限圈
        var S = Lay.S, vd = visD(lim);
        c.save(); c.setLineDash([5, 5]); c.strokeStyle = "rgba(248,113,113,.85)"; c.lineWidth = 1.5; c.beginPath();
        for (var i = 0; i <= 72; i++) { var p = PA(L, S, i / 72 * TAU, vd); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } c.stroke(); c.restore();
        var lp = PA(L, S, Math.PI * 0.6, vd);
        chip(c, lp[0] - 40, lp[1] - 30, "洛希极限 " + lim.toFixed(2) + " R⊕", "#fecaca");
      }
      if (Lay.C) {
        var C = Lay.C; c.save(); c.font = "12px system-ui, sans-serif";
        var tx = "平衡潮差 " + (rng < 10 ? rng.toFixed(2) + " m" : rng < 1e4 ? Math.round(rng).toLocaleString("zh-CN") + " m" : (rng / 1000).toFixed(0) + " km"), w = c.measureText(tx).width + 16;
        c.fillStyle = "rgba(14,11,40,.8)"; rr(c, C.x + 10, C.y + C.h - 40, w, 28, 8); c.fill(); c.fillStyle = rng > 5 ? "#fca5a5" : "#ede9fe"; c.fillText(tx, C.x + 18, C.y + C.h - 21); c.restore();
      }
      if (run && st.k >= 1 && !st.done && (st.dv >= lim || st.brk >= 1)) {
        st.done = true;
        if (st.dv < lim) { st.broke = true; if (st.g2) st.g2broke = true; }
        T4.report(L);
      }
      L.hud.innerHTML = "月地距离 <b>" + d.toFixed(d < 10 ? 2 : 1) + " R⊕</b> · 潮差 <b>" + (rng < 100 ? rng.toFixed(2) : Math.round(rng).toLocaleString("zh-CN")) + " m</b><br>洛希极限 <b>" + lim.toFixed(2) + " R⊕</b>(" + km(lim * P.R_EARTH_M) + ")" + (L.v.g2 ? " · <span style='color:#fca5a5'>引力 ×2</span>" : "");
    },
    report: function (L) {
      var st = L.st, d = st.dv, broke = d < st.lim, rng = 0.535 * Math.pow(D_ER / d, 3);
      L.finishRun({ pass: broke, predText: "预测「" + T4.predict.options[L.firstChoice] + "」", resultText: d.toFixed(2) + " 个地球半径:" + (broke ? "月亮被撕碎" : "月亮完好,潮差 " + rng.toFixed(1) + " m"),
        html: broke ? "月亮推到 <b>" + d.toFixed(2) + " R⊕</b>,进了洛希极限(" + st.lim.toFixed(2) + " R⊕):<span class=ok>被潮汐撕碎,铺成一圈光环</span>。" + (st.g2 ? "<br>引力 ×2 时极限还是 " + st.lim.toFixed(2) + " R⊕:两边一起变大,比值不变。" : "")
          : "月亮在 <b>" + d.toFixed(2) + " R⊕</b> 还撑得住,海边平衡潮差已经是 <b>" + (rng < 100 ? rng.toFixed(1) : Math.round(rng).toLocaleString("zh-CN")) + " m</b>。",
        say: broke ? (st.g2 ? "" : "要是引力翻倍,月亮会在更远的地方就被撕碎吗?") : "还完好。离洛希极限的红色虚线还差多少?" });
    },
    predictGood: function (L) { return L.firstChoice === 2; },
    star3: function (L) { return L.st.g2broke; }
  };

  NV.task({
    id: "tide", guide: "abyss", scene3d: "core/tide3d.js",
    bridge: { href: "../../starhelm/", label: "天枢 Starhelm「月亮为什么总用同一面对着我们?」" },
    title: "月亮怎样拉动整片大海?",
    safety: "海边看潮请留意涨潮时间,不要在礁石和滩涂上久留。",
    levels: [T1, T2, T3, T4]
  });
})();
</script>
