<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宙律 3.0 · 宇宙配方台(建造中)</title>
<meta name="robots" content="noindex">
<meta name="description" content="宙律 Nomoverse 3.0:拧动宇宙的常数,看它能不能走到有行星的那一天。">
<meta name="theme-color" content="#05060f">
<link rel="stylesheet" href="/shared/3/tokens.css">
<link rel="stylesheet" href="/shared/3/ui.css">
<link rel="stylesheet" href="nv3.css">
</head>
<body>
<canvas id="stage" role="img" data-i18n-aria="stageAria" aria-label="舞台:玻璃球里的宇宙"></canvas>
<canvas id="stage2d" aria-hidden="true" hidden></canvas>

<header class="bar">
  <a class="gn3-btn bar-back" href="/" data-i18n="home" data-i18n-aria="homeAria" aria-label="返回创世计划">← 创世计划</a>
  <div class="bar-title"><b data-i18n="world">宙律</b><span data-i18n="sub">物理 · 宇宙配方台</span></div>
  <div class="bar-tools">
    <button type="button" class="gn3-btn" id="help" aria-label="新手引导">?</button>
    <button type="button" class="gn3-btn" id="undo" data-i18n-aria="undo" aria-label="撤销">↶</button>
    <button type="button" class="gn3-btn" id="redo" data-i18n-aria="redo" aria-label="重做">↷</button>
    <button type="button" class="gn3-btn" id="q" aria-label="画质:中" aria-haspopup="dialog" aria-expanded="false" aria-controls="qpanel">中</button>
    <button type="button" class="gn3-btn" id="lang" aria-label="English">EN</button>
  </div>
</header>

<div class="ui">
<aside class="left" data-i18n-aria="leftAria" aria-label="配方">
  <div id="mode"></div>
  <div id="ask"></div>
  <div class="knob" id="k-kG"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="knob" id="k-kc"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="knob" id="k-kA"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div id="adv" class="adv">
    <div class="knob" id="k-eps"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    <div class="knob knob-om" id="k-Om"><div class="om-l"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div><div id="gauge"></div></div>
    <div class="dials"><div class="dial-w" id="k-Q"><div class="dial"></div></div><div class="dial-w" id="k-kL"><div class="dial"></div></div></div>
    <div class="seedrow knob" id="k-seed"><span class="seed-l" data-i18n="seed">种子</span><span id="flap"></span><button type="button" class="gn3-btn" id="reseed" data-i18n-aria="reseed" aria-label="换一个种子">⟳</button></div>
    <button type="button" class="gn3-btn rand" id="rand"><span aria-hidden="true">⚄ </span><span data-i18n="rand">随机宇宙</span></button>
  </div>
  <button type="button" class="gn3-btn reset" id="reset" data-i18n="reset">回到真实宇宙</button>
</aside>

<aside class="right gn3-glass" data-i18n-aria="rightAria" aria-label="结果">
  <div class="stat"><span data-i18n="sStatus">结局</span><b id="s-status">…</b></div>
  <div class="stat"><span data-i18n="sAge">宇宙年龄</span><b id="s-age"></b></div>
  <div class="stat"><span data-i18n="sTeff">恒星表面温度</span><b id="s-teff"></b></div>
  <div class="stat"><span data-i18n="sPlanets">行星</span><b id="s-pl"></b></div>
  <div class="stat"><span data-i18n="sHab">宜居带行星</span><b id="s-hab"></b></div>
  <div id="fail"></div>
  <div id="stage-note" class="stage-note" hidden><b></b><p></p></div>
  <section id="cardsec" class="cardsec" aria-labelledby="cardsT"><b id="cardsT" data-i18n="cardsT">题卡</b><div id="stack"></div></section>
  <section id="makesec" class="makesec" aria-labelledby="makeT">
    <b id="makeT" data-i18n="makeT">作品卡</b>
    <label class="nm"><span data-i18n="nameL">给宇宙起名</span><input id="nm-in" type="text" maxlength="40" autocomplete="off" spellcheck="false"></label>
    <div id="pcard"></div>
    <div class="mk-acts">
      <button type="button" class="gn3-btn" id="tohelm"><span class="mk-t" data-i18n="tohelm">带去天枢</span> →</button>
      <button type="button" class="gn3-btn" id="share"><span class="mk-t" data-i18n="share">复制分享链接</span></button>
      <button type="button" class="gn3-btn" id="export"><span class="mk-t" data-i18n="export">导出 JSON</span></button>
    </div>
    <div id="upload"></div>
    <p id="mk-msg" class="mk-msg" role="status"></p>
  </section>
  <button type="button" class="gn3-btn bridge" id="bridge"><span data-i18n="bridge">星桥 · 去天枢看恒星系</span> →</button>
</aside>

<footer class="dock gn3-glass" data-i18n-aria="dockAria" aria-label="推演">
  <button type="button" class="bang" id="bang"><span class="bang-ic" aria-hidden="true">▶</span><span data-i18n="bang">大爆炸</span></button>
  <div id="tl" class="tl"></div>
</footer>
</div>

<div id="coach" class="coach gn3-glass" role="dialog" aria-modal="false" aria-live="polite" hidden><b></b><p></p><div class="coach-b"><button type="button" class="gn3-btn" id="g-skip">跳过</button><button type="button" class="gn3-btn" id="g-next" hidden>知道了</button></div></div>

<div id="qpanel" class="qpanel gn3-glass" role="dialog" aria-modal="false" aria-label="画质与动效" hidden>
  <div class="qp-h"><b data-i18n="qT">画质与动效</b><button type="button" class="gn3-btn qp-x" id="q-close" data-i18n-aria="qClose" aria-label="关闭">×</button></div>
  <span class="qp-l" data-i18n="qTier">画质</span>
  <div id="q-tier"></div>
  <p id="q-note" class="qp-note"></p>
  <span class="qp-l" data-i18n="qMotion">动效</span>
  <div id="q-motion"></div>
</div>
<div id="toasts"></div>
<div id="sr-live"></div>

<p class="note" data-i18n="simp">教学简化:轨道半径对数压缩、行星放大显示;真实数值见结果栏。</p>

<script src="core/universe.js"></script>
<script src="core/nbody.js"></script>
<script src="core/gus0.js"></script>
<script src="core/scene.js"></script>
<script type="module" src="main.mjs"></script>
</body>
</html>
