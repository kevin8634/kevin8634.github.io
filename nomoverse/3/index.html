<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宙律 3.0 · 宇宙配方台(建造中)</title>
<meta name="robots" content="noindex">
<meta name="description" content="宙律 Nomoverse 3.0:拧动宇宙的常数,看它能不能走到有行星的那一天。">
<meta name="theme-color" content="#05060f">
<link rel="stylesheet" href="/shared/3/tokens.css">
<link rel="stylesheet" href="/shared/3/ui.css">
<link rel="stylesheet" href="nv3.css">
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<canvas id="stage2d" aria-hidden="true" hidden></canvas>

<header class="bar">
  <a class="gn3-btn bar-back" href="/" data-i18n="home" data-i18n-aria="homeAria" aria-label="返回创世计划">← 创世计划</a>
  <div class="bar-title"><b data-i18n="world">宙律</b><span data-i18n="sub">物理 · 宇宙配方台</span></div>
  <div class="bar-tools">
    <button type="button" class="gn3-btn" id="undo" data-i18n-aria="undo" aria-label="撤销">↶</button>
    <button type="button" class="gn3-btn" id="redo" data-i18n-aria="redo" aria-label="重做">↷</button>
    <button type="button" class="gn3-btn" id="q" data-i18n-aria="quality" aria-label="画质">中</button>
    <button type="button" class="gn3-btn" id="lang" aria-label="English">EN</button>
  </div>
</header>

<div class="ui">
<aside class="left" aria-label="配方">
  <div id="ask"></div>
  <div class="knob" id="k-kG"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="knob" id="k-kc"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="knob" id="k-kA"><div class="sl"></div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <button type="button" class="gn3-btn reset" id="reset" data-i18n="reset">回到真实宇宙</button>
</aside>

<aside class="right gn3-glass" aria-label="结果" aria-live="polite">
  <div class="stat"><span data-i18n="sStatus">结局</span><b id="s-status">…</b></div>
  <div class="stat"><span data-i18n="sAge">宇宙年龄</span><b id="s-age"></b></div>
  <div class="stat"><span data-i18n="sTeff">恒星表面温度</span><b id="s-teff"></b></div>
  <div class="stat"><span data-i18n="sPlanets">行星</span><b id="s-pl"></b></div>
  <div class="stat"><span data-i18n="sHab">宜居带行星</span><b id="s-hab"></b></div>
  <div id="fail"></div>
</aside>

<footer class="dock gn3-glass">
  <button type="button" class="bang" id="bang"><span class="bang-ic" aria-hidden="true">▶</span><span data-i18n="bang">大爆炸</span></button>
  <div id="tl" class="tl"></div>
</footer>
</div>

<p class="note" data-i18n="simp">教学简化:轨道半径对数压缩、行星放大显示;真实数值见右侧。</p>

<script src="core/universe.js"></script>
<script src="core/nbody.js"></script>
<script src="core/gus0.js"></script>
<script src="core/scene.js"></script>
<script type="module" src="main.mjs"></script>
</body>
</html>
