"use strict";
(function () {

  /* ---------- 通用 ---------- */
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

  }
  function ease(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var STARS = []; for (var i = 0; i < 160; i++) STARS.push([rnd(), rnd() * 0.7, rnd() * 1.2 + 0.3, rnd()]);
  function sky(c, W, H, top, bot) {
    var gs = c.createLinearGradient(0, 0, 0, H); gs.addColorStop(0, top || "#0b0826"); gs.addColorStop(1, bot || "#2a1f5c");
    c.fillStyle = gs; c.fillRect(0, 0, W, H);
    var t = performance.now() / 1000;
    for (var i = 0; i < STARS.length; i++) { var s = STARS[i]; c.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(t * 0.6 + s[3] * 9)); c.fillStyle = "#e9e5ff"; c.fillRect(s[0] * W, s[1] * H, s[2], s[2]); }
    c.globalAlpha = 1;
  }
  /* 舞台可用区:桌面右上留给账本;手机账本放顶部 */
  function zone(L) {

    var led = wide ? { x: L.w - Math.min(300, L.w * 0.36) - 12, y: 56, w: Math.min(300, L.w * 0.36), h: 176 } : { x: 8, y: 52, w: L.w - 16, h: 60, compact: true };

  }
  /* 3D 舞台的取景子区(关卡坐标):桌面避开右上账本,手机账本已在顶部带里 */
  function fit3(Z, ar) {   // ar = 场景宽高比;桌面在「账本左侧」与「账本下方」两块里选能放得更大的

    var D = Z.led, y = D.y + D.h + 6;
    var A = { x: Z.x, y: Z.y, w: Math.max(80, D.x - Z.x - 12), h: Z.h }, B = { x: Z.x, y: y, w: Z.w, h: Math.max(120, Z.y + Z.h - y) };

  var B3 = -3;   // 3D 场景地面高度(与 energy3d.js 一致)

    c.font = "600 12px system-ui, sans-serif"; c.fillStyle = "#c4b5fd"; c.textBaseline = "top";

      var bx = B.x + 10, bw = B.w - 20, x = bx;
      outs.forEach(function (o) { var w = bw * Math.max(0, o.v) / tot; c.fillStyle = o.col; c.fillRect(x, B.y + 25, w, 10); x += w; });
      c.font = "11px system-ui, sans-serif"; x = bx;
      outs.forEach(function (o) { c.fillStyle = o.col; var t = "■ " + o.n + " " + fE(o.v); c.fillText(t, x, B.y + 40); x += c.measureText(t).width + 12; });
      c.restore(); return;
    }
    c.fillText("能量账本 · " + title, B.x + 12, B.y + 9);
    var y0 = B.y + 32, H = B.h - 60, sx = B.x + 12, sw = 12, dx = B.x + B.w * 0.5, dw = 12, t = performance.now() / 1000;
    c.fillStyle = src.col; c.shadowColor = src.col; c.shadowBlur = 10; c.fillRect(sx, y0, sw, H); c.shadowBlur = 0;
    var gap = 4, n = outs.length, Hd = H - gap * (n - 1), ys = y0, yd = y0, lastY = -1e9;
    outs.forEach(function (o) {
      var h = Hd * Math.max(0, o.v) / tot, hs = H * Math.max(0, o.v) / tot;
      if (h > 0.4) {
        var gr = c.createLinearGradient(sx + sw, 0, dx, 0); gr.addColorStop(0, src.col); gr.addColorStop(1, o.col);
        c.globalAlpha = 0.55 + 0.15 * Math.sin(t * 2 + ys * 0.05); c.fillStyle = gr;
        var mx = (sx + sw + dx) / 2; c.beginPath(); c.moveTo(sx + sw, ys); c.bezierCurveTo(mx, ys, mx, yd, dx, yd); c.lineTo(dx, yd + h); c.bezierCurveTo(mx, yd + h, mx, ys + hs, sx + sw, ys + hs); c.closePath(); c.fill();

    });

    c.fillStyle = "#86efac"; c.textAlign = "right"; c.fillText("合计 " + fE(src.v) + " · 一分不少", B.x + B.w - 10, B.y + B.h - 22);

  }

  /* ================= 第 1 关 过山车 ================= */
  var M1 = 500, H0 = 30, MU = 0.03, XS = 10, XH2 = 70, XEND = 104;
  function keys(h2) { return [[0, 24], [10, H0], [40, 2], [XH2, h2], [96, 3], [110, 3]]; }
  function trackH(K, x) { for (var i = 0; i < K.length - 1; i++) if (x <= K[i + 1][0]) { var u = (x - K[i][0]) / (K[i + 1][0] - K[i][0]); return K[i][1] + (K[i + 1][1] - K[i][1]) * (1 - Math.cos(Math.PI * u)) / 2; } return K[K.length - 1][1]; }
  function buildTrack(h2) {   // 采样 + 累计弧长
    var K = keys(h2), xs = [], hs = [], ss = [], s = 0;
    for (var i = 0; i <= 1100; i++) { var x = i / 10, h = trackH(K, x); if (i) s += Math.hypot(0.1, h - hs[i - 1]); xs.push(x); hs.push(h); ss.push(s); }
    return { xs: xs, hs: hs, ss: ss, h2: h2 };
  }
  function idx(x) { return Math.max(0, Math.min(1100, Math.round(x * 10))); }
  function sAt(T, x) { return T.ss[idx(x)] - T.ss[idx(XS)]; }
  /* 小车最远到哪:无摩擦/有摩擦,返回 {pass, xStop, hStop} */
  function reach(T, mu) {
    for (var i = idx(XS) + 1; i <= idx(XEND); i++) { var v2 = P.coasterV2(H0, T.hs[i], T.ss[i] - T.ss[idx(XS)], mu, 0.6); if (v2 <= 0) return { pass: false, xStop: T.xs[i], hStop: T.hs[i] }; }
    return { pass: true };
  }
  var T1 = {
    name: "过山车能爬多高", d3: true,
    goal: "小车从 30 m 高的第一座山顶出发,没有发动机。调第二座山的高度:让小车翻过一座 ≥ 25 m 的第二座山,再打开摩擦试一次。",
    note: "小车连乘客按 500 kg;摩擦与空气阻力合成为 μ = 0.03 的近似(μ·m·g·s);g = 9.80665 m/s²。",
    ask: "高处的小车冲下山谷时越来越快,速度是从哪里来的?爬上第二座山时又去了哪里?",

    controls: [

      { id: "fr", type: "toggle", label: "摩擦与空气阻力", value: false }
    ],
    runLabel: "放车",
    crit: ["翻过 ≥ 25 m 的第二座山", "预测正确", "打开摩擦也翻过去"],
    hints: ["小车在山顶几乎不动,只有「高度」。冲到谷底时,高度变成了什么?", "没有摩擦,势能和动能只是互相换来换去,总数不变。第二座山顶要付多少「高度」?", "第二座山必须比 30 m 低。打开摩擦后还要再低一点——摩擦把一部分能量变成了热。"],
    summary: "势能 mgh 与动能 ½mv² 互相转换,总和不变:没有摩擦,小车最多回到出发的 30 m;有摩擦,一部分能量变成轨道和空气里的热,能翻过的山就更低。能量没有消失,只是换了样子。",
    lights: "动能与势能",
    card: { t: "机械能守恒", b: "只有重力做功时,势能和动能此消彼长,机械能(两者之和)保持不变。所以没有发动机的过山车,后面的山都比第一座低。摩擦存在时,机械能会减少,减少的部分变成了热——把热也算进账本,总能量依然守恒。", f: "mgh₀ = mgh + ½mv² + 热(μ·m·g·s)", src: "OpenStax《University Physics Volume 1》第 8 章 势能与能量守恒;人教版高中物理必修第二册 第八章 机械能守恒定律" },
    init: function (L) { L.st = { x: XS, frOk: false, ok: false, T: buildTrack(34) }; },
    run: function (L) {

    },
    frame: function (L, dt) {
      var st = L.st, c = L.ctx, run = L.phase === "running", Z = zone(L);
      if (!run && (!st.T || st.T.h2 !== L.v.h2)) st.T = buildTrack(L.v.h2);
      var T = st.T, mu = run ? st.mu : (L.v.fr ? MU : 0);
      // 运动:沿弧长前进
      var v2 = P.coasterV2(H0, T.hs[idx(st.x)], sAt(T, st.x), mu, 0.6), v = Math.sqrt(Math.max(0, v2));

        if (!st.r.pass && st.x >= st.r.xStop - 0.15) { st.back += dt; if (st.back > 1.2) { st.done = true; T1.report(L); } }
        else { var i0 = idx(st.x), dsdx = (T.ss[Math.min(1100, i0 + 1)] - T.ss[i0]) / 0.1 || 1; st.x += Math.max(v, 1.2) * dt * sp * 1.1 / dsdx; }
        if (st.r.pass && st.x >= XEND) { st.x = XEND; st.done = true; T1.report(L); }
      }
      // 画面
      AVOID = Z.led && !Z.led.compact ? Z.led : null;
      var hNow = T.hs[idx(st.x)], heatGlow = mu > 0 ? Math.min(1, sAt(T, st.x) / 120) : 0;
      if (L.d3) {   // 3D 舞台:写参数,标签用相机投影对齐
        st.e3 = { key: T.h2 + "", xs: T.xs, hs: T.hs, h2: T.h2, x: st.x, h: hNow, heat: heatGlow, mu: mu, moving: run && !st.done };
        var sx = function (x) { return L.d3.proj(x, 0, 0)[0]; }, sy = function (h) { return L.d3.proj(55, h, 0)[1]; };
      } else {
      sky(c, L.w, L.h);
      var sx = function (x) { return Z.x + x / 110 * Z.w; }, sy = function (h) { return Z.y + Z.h - (h + 3) / 46 * Z.h; };
      c.fillStyle = "#120d2c"; c.beginPath(); c.moveTo(0, L.h); for (var k = 0; k <= 80; k++) c.lineTo(k / 80 * L.w, sy(7 + 4 * Math.sin(k * 0.21) + 2.5 * Math.sin(k * 0.083 + 1))); c.lineTo(L.w, L.h); c.fill();
      c.strokeStyle = "rgba(196,181,253,.25)"; c.lineWidth = 1;
      for (var k2 = 0; k2 <= 1100; k2 += 30) { c.beginPath(); c.moveTo(sx(T.xs[k2]), sy(T.hs[k2])); c.lineTo(sx(T.xs[k2]), sy(-3)); c.stroke(); }
      c.strokeStyle = "#cbd5e1"; c.lineWidth = 3; c.beginPath(); for (var k3 = 0; k3 <= 1100; k3 += 5) { var X = sx(T.xs[k3]), Y = sy(T.hs[k3]); k3 ? c.lineTo(X, Y) : c.moveTo(X, Y); } c.stroke();
      c.strokeStyle = "rgba(167,139,250,.9)"; c.lineWidth = 1.2; c.stroke();
      }
      c.save(); c.setLineDash([6, 6]); c.strokeStyle = "rgba(103,232,249,.6)"; c.beginPath(); c.moveTo(Math.max(0, sx(0)), sy(H0)); c.lineTo(Math.min(L.w, sx(110)), sy(H0)); c.stroke(); c.restore();
      chip(c, sx(XH2) + 8 > L.w - 150 ? L.w - 150 : sx(80), sy(H0) - 26, "出发高度 30 m", "#67e8f9");
      chip(c, sx(XH2) - 30, sy(T.h2) - 30, "第二座山 " + T.h2 + " m", T.h2 >= H0 ? "#fca5a5" : "#ede9fe");
      if (mu > 0) chip(c, Z.x, sy(-3) - 30, "摩擦:每走 1 m 约耗掉 " + Math.round(mu * M1 * g) + " J", "#fdba74");
      // 小车
      var cx = sx(st.x), cy = sy(hNow);
      if (!L.d3) {
      c.save(); c.shadowColor = "#67e8f9"; c.shadowBlur = 18; c.fillStyle = "#e0f2fe"; c.beginPath(); c.arc(cx, cy - 6, 7, 0, TAU); c.fill(); c.restore();
      if (heatGlow > 0) { c.fillStyle = "rgba(251,146,60," + (0.25 + heatGlow * 0.5) + ")"; c.beginPath(); c.arc(cx, cy, 4 + heatGlow * 6, 0, TAU); c.fill(); }
      }
      AVOID = null;

      var h = T.hs[idx(st.x)], PE = P.pe(M1, h), KE = P.ke(M1, v), HEAT = mu * M1 * g * sAt(T, st.x), E0 = P.pe(M1, H0) + P.ke(M1, 0.6);
      ledger(c, Z.led, "过山车", { n: "出发时的势能", v: E0, col: COL.pe }, [{ n: "势能", v: PE, col: COL.pe }, { n: "动能", v: KE, col: COL.ke }, { n: "热(摩擦)", v: HEAT, col: COL.heat }]);
      L.hud.innerHTML = "高度 <b>" + h.toFixed(1) + " m</b> · 速度 <b>" + v.toFixed(1) + " m/s</b>(" + Math.round(v * 3.6) + " km/h)";
    },
    report: function (L) {

    },

  };

  /* ================= 第 2 关 刹车片为什么烫 ================= */
  var MASS = [1000, 1500, 2500], DECEL = 7, DISC = 32;
  var T2 = {
    name: "刹车片为什么烫", d3: true,
    goal: "汽车刹停后动能去哪了?分别用 60 km/h 和 120 km/h 各刹停一次,对比刹车盘的升温。",

    ask: "车停下来了,动能消失了吗?",

    controls: [
      { id: "v", label: "车速", min: 30, max: 130, step: 10, value: 60, unit: " km/h" },
      { id: "m", type: "seg", label: "车重", options: ["1.0 t", "1.5 t", "2.5 t"], value: 1 }
    ],
    runLabel: "刹车",
    crit: ["60 与 120 km/h 各刹停一次", "预测正确", "换一个车重再刹"],
    hints: ["动能 ½mv² 里,速度是平方。", "速度翻倍,v² 变成几倍?", "刹车片把动能变成热。动能是几倍,热就是几倍。"],
