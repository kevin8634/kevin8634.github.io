<script>
"use strict";
(function () {
  var P = NV.Phys, Dr = NV.Draw, MU = P.MU_EARTH, R = P.R_EARTH;
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t); }
  /* 引力强弱 → 低频脉冲音高:以 400 km 处 8.69 m/s² 为 E2(82.4 Hz),按 √g 映射 */
  function pulseHz(gms2) { return Math.max(30, Math.min(260, 82.41 * Math.sqrt(gms2 / 8.694))); }
  function gHere(mu, r) { return mu / (r * r) * 1000; }   // km/s² → m/s²
  function orbitView(L, rMax, cyFrac) {
    var s = Math.min(L.w, L.h * 0.98) / (2 * rMax);
    var V = { s: s, cx: L.w / 2, cy: L.h * (cyFrac || 0.5) };
    return L.d3 ? L.d3.view(V) : V;
  }
  /* 3D 舞台下 toS 走透视投影(被地球挡住的点返回 NaN,画线时自动断开) */
  function toS(V, x, y) { return V.p3 ? V.p3(x, y) : [V.cx + x * V.s, V.cy - y * V.s]; }
  function bg(L) { var c = L.ctx; c.clearRect(0, 0, L.w, L.h); if (!L.d3) Dr.stars(c, L.w, L.h, 11, Math.round(L.w * L.h / 5000)); }
  function earth(L, V) { if (!L.d3) Dr.earth(L.ctx, V.cx, V.cy, R * V.s); }
  function ring(L, V, r, color) {
    var c = L.ctx;
    if (V.p3) { var pts = []; for (var k = 0; k <= 160; k++) { var a = k / 160 * 2 * Math.PI; pts.push(toS(V, r * Math.cos(a), r * Math.sin(a))); } c.save(); c.setLineDash([3, 5]); Dr.path(c, pts, color, 1); c.restore(); return; }
    c.save(); c.setLineDash([3, 5]); c.strokeStyle = color; c.beginPath(); c.arc(V.cx, V.cy, r * V.s, 0, 7); c.stroke(); c.restore();
  }

  /* ================= 第 1 关 扔得更远 ================= */
  var L1 = {
    name: "扔得更远",
    goal: "站在 20 m 高的山顶水平扔球,让球落进远处的旗帜区。",
    note: "近地面视为平地,g = 9.8 m/s²;阻力为二次阻力示意。",
    ask: "先猜一猜:用现在的速度扔出去,球会落在哪里?",
    predict: { type: "tap", q: "点一下地面,猜球落在哪儿",
      alt: function () { return [15, 30, 45].map(function (d) { return { label: "约 " + d + " m", make: function () { return { x: d, y: 0 }; } }; }); } },
    controls: [
      { id: "v", label: "水平扔出速度", min: 2, max: 30, step: 0.5, value: 8, unit: " m/s" },
      { id: "drag", type: "toggle", label: "空气阻力", value: false }
    ],
    runLabel: "扔球",
    crit: ["球落进旗帜区", "落点预测误差 ≤ 15%", "2 次以内完成"],
    hints: ["球离手以后,它在水平方向上有没有被什么东西推着走?", "速度从 8 m/s 换成 16 m/s,落点远了大约几倍?", "只动「速度」这一条规则,别的都别动,再扔一次看看?"],
    summary: "水平速度越大,同样的下落时间里飞得越远。",
    lights: "位移与速度、运动的合成",
    card: { t: "平抛:水平匀速 + 竖直下落", b: "球从同一高度落地所用的时间只由高度和 g 决定;水平速度越大,这段时间里走得越远。", f: "x = v·√(2h/g)", src: "OpenStax《University Physics Volume 1》4.3 抛体运动(CC BY 4.0)" },
    H: 20, zone: [38, 44],
    view: function (L) {
      var s = Math.min(L.w / 82, L.h * 0.78 / 30), gy = L.h * 0.86, ox = Math.max(8, (L.w - 82 * s) / 2) + 8 * s;
      return { s: s, gy: gy, ox: ox };
    },
    toWorld: function (L, x, y) { var V = this.view(L); return { x: Math.max(0, (x - V.ox) / V.s), y: 0 }; },
    init: function (L) { L.st = { path: null, t: 0, land: null }; },
    run: function (L) {
      var r = P.shoot({ v: L.v.v, ang: 0, g: 9.8, x0: 0, y0: this.H, k: L.v.drag ? 0.02 : 0, hoopX: 999, rimY: -9, xMax: 300, dt: 1 / 240 });
      var p = r.pts, a = p[p.length - 2], b = p[p.length - 1];
      L.st.land = a[0] + (b[0] - a[0]) * a[1] / (a[1] - b[1]);
      L.st.path = p; L.st.t = 0; L.st.done = false;
    },
    frame: function (L, dt) {
      var c = L.ctx, V = this.view(L), st = L.st, self = this; bg(L);
      function S(x, y) { return [V.ox + x * V.s, V.gy - y * V.s]; }
      // 地球一角(弯曲地平线示意)
      c.fillStyle = "#1c2f5e"; c.beginPath(); c.moveTo(0, L.h); c.lineTo(0, V.gy); c.quadraticCurveTo(L.w / 2, V.gy - 6, L.w, V.gy); c.lineTo(L.w, L.h); c.fill();
      c.strokeStyle = "rgba(167,139,250,.6)"; c.lineWidth = 2; c.beginPath(); c.moveTo(0, V.gy); c.quadraticCurveTo(L.w / 2, V.gy - 6, L.w, V.gy); c.stroke();
      // 山
      var m0 = S(-7, 0), m1 = S(0, this.H), m2 = S(1.5, 0);
      c.fillStyle = "#3b2f7a"; c.beginPath(); c.moveTo(m0[0] - 20, V.gy); c.lineTo(m1[0] - 6, m1[1]); c.lineTo(m1[0] + 4, m1[1]); c.lineTo(m2[0] + 8, V.gy); c.fill();
      // 小人
      c.strokeStyle = "#eeebff"; c.lineWidth = 2; var hx = m1[0] - 2, hy = m1[1];
      c.beginPath(); c.arc(hx, hy - 22, 4, 0, 7); c.moveTo(hx, hy - 18); c.lineTo(hx, hy - 8); c.lineTo(hx - 4, hy); c.moveTo(hx, hy - 8); c.lineTo(hx + 4, hy); c.moveTo(hx, hy - 15); c.lineTo(hx + 7, hy - 17); c.stroke();
      // 刻度
      for (var d = 10; d <= 70; d += 10) { var q = S(d, 0); c.fillStyle = "rgba(238,235,255,.5)"; c.fillRect(q[0], V.gy, 1, 6); Dr.label(c, d + " m", q[0], V.gy + 18, "#bcb5e2", 11, "center"); }
      // 旗帜区
      var z0 = S(this.zone[0], 0), z1 = S(this.zone[1], 0);
      c.fillStyle = "rgba(110,231,183,.25)"; c.fillRect(z0[0], V.gy - 4, z1[0] - z0[0], 8);
      c.strokeStyle = "#6ee7b7"; c.beginPath(); c.moveTo((z0[0] + z1[0]) / 2, V.gy); c.lineTo((z0[0] + z1[0]) / 2, V.gy - 26); c.stroke();
      c.fillStyle = "#6ee7b7"; c.beginPath(); c.moveTo((z0[0] + z1[0]) / 2, V.gy - 26); c.lineTo((z0[0] + z1[0]) / 2 + 14, V.gy - 21); c.lineTo((z0[0] + z1[0]) / 2, V.gy - 16); c.fill();
      // 预测
      var pr = L.pred || L.runPred;
      if (pr) { var pp = S(pr.x, 0); Dr.dashPath(c, [[pp[0], V.gy - 40], [pp[0], V.gy + 2]], "#fbbf24", 2.5); Dr.label(c, "你的预测", pp[0], V.gy - 44, "#fbbf24", 12, "center"); }
      // 轨迹
      if (st.path) {
        if (L.phase === "running") st.t += dt * (L.RM ? 3 : 1);
        var n = Math.min(st.path.length, Math.floor(st.t * 240) + 1), pts = [];
        for (var i = 0; i < n; i += 2) pts.push(S(st.path[i][0], Math.max(0, st.path[i][1])));
        if (n > 0) pts.push(S(st.path[n - 1][0], Math.max(0, st.path[n - 1][1])));
        Dr.path(c, pts, "#c4b5fd", 2.5);
        var bp = pts[pts.length - 1]; c.fillStyle = "#fff"; c.beginPath(); c.arc(bp[0], bp[1], 5, 0, 7); c.fill();
        if (n >= st.path.length && L.phase === "running") {
          var land = st.land, ok = land >= this.zone[0] && land <= this.zone[1], pe = L.runPred ? Math.abs(L.runPred.x - land) / land : 1;
          L.sfx("thud");
          L.finishRun({ pass: ok, predText: "猜落在 " + L.runPred.x.toFixed(1) + " m", resultText: "速度 " + L.v.v + " m/s,实际落在 " + land.toFixed(1) + " m" + (L.v.drag ? "(有阻力)" : ""),
            html: "你猜 <b>" + L.runPred.x.toFixed(1) + " m</b>,实际 <b>" + land.toFixed(1) + " m</b>(相差 " + Math.round(pe * 100) + "%)。" + (ok ? "<span class=ok>落进旗帜区!</span>" : "<span class=no>" + (land < this.zone[0] ? "没扔到旗帜区。" : "扔过头了。") + "</span>"),
            say: land < this.zone[0] ? "落在旗子前面了。要让它飞得更远,你想改哪一条规则?" : "飞过头了。哪条规则能让它少飞一点?" });
        }
        if (n >= st.path.length) { var lp = S(st.land, 0); c.strokeStyle = "#c4b5fd"; c.lineWidth = 2; c.beginPath(); c.moveTo(lp[0], V.gy - 30); c.lineTo(lp[0], V.gy + 2); c.stroke(); Dr.label(c, "实际", lp[0], V.gy - 34, "#c4b5fd", 12, "center"); }
      }
      L.hud.innerHTML = "速度 <b>" + L.v.v + " m/s</b> · 山高 <b>20 m</b>" + (st.land != null && L.phase !== "running" ? " · 落点 <b>" + st.land.toFixed(1) + " m</b>" : "");
    },
    predictGood: function (L) { return L.runPred && Math.abs(L.runPred.x - L.st.land) <= Math.max(1.5, 0.15 * L.st.land); },
    star3: function (L) { return L.attempts <= 2; }
  };

  /* ================= 第 2 关 牛顿大炮 ================= */
  var H2 = 150, K_DRAG = 1.2e-6;
  var L2 = {
    name: "牛顿大炮", d3: true,
    goal: "在 150 km 高的「牛顿之山」上开炮,把炮弹速度调大,直到它绕地球整整一圈都不落地。",
    note: "地球为均匀球体、无自转,忽略月球与太阳;山高按 150 km 计(示意)。阻力为夸张示意。",
    ask: "炮弹越快,落得越远……快到什么程度,它就再也落不到地上?",
    predict: { type: "slider", q: "要多快,炮弹才会一直掉不到地上?", min: 1, max: 12, step: 0.1, value: 5, unit: " km/s" },
    controls: [
      { id: "v", label: "炮弹速度", min: 1, max: 12, step: 0.05, value: 3, unit: " km/s", fmt: function (x) { return x.toFixed(2); } },
      { id: "drag", type: "toggle", label: "空气阻力(夸张示意)", value: false }
    ],
    runLabel: "开炮",
    crit: ["炮弹绕地球一整圈", "速度预测误差 ≤ 0.6 km/s", "3 次以内完成"],
    hints: ["炮弹落地的地方,随着速度变大,离山越来越远还是越来越近?", "速度 3 km/s 和 6 km/s 的两条轨迹,哪一条更「贴着」地球弯下去?", "只把「炮弹速度」一点点往上调,每次看一眼落点,在哪个速度附近它开始不落地?"],
    summary: "轨道就是一直在往下掉,只是快到地面「弯走」的速度追不上它。",
    lights: "环绕速度、逃逸速度",
    card: { t: "环绕速度", b: "炮弹每下落一点,地球表面也恰好弯下去一点,它就永远落不到地上。在 150 km 高度这个速度约 7.8 km/s;再快到约 11 km/s 就会飞离地球。", f: "v = √(GM/r),GM = 3.986×10¹⁴ m³/s²", src: "OpenStax《University Physics Volume 1》13.4 卫星轨道与能量;GM 取 IERS/WGS-84 地心引力常数" },
    init: function (L) { L.st = { body: null, trail: [], ang: 0, zoom: L.RM ? 1 : 0, out: "" }; },
    run: function (L) {
      var r0 = R + H2;
      L.st.body = P.body(0, r0, L.v.v, 0); L.st.trail = [[0, r0]]; L.st.ang = 0; L.st.prevA = Math.PI / 2; L.st.out = ""; L.st.done = false; L.st.orbits = 0; L.st.minR = r0;
    },
    frame: function (L, dt) {
      var c = L.ctx, st = L.st; bg(L);
      st.zoom = Math.min(1, st.zoom + dt / 1.6);
      var zf = ease(st.zoom), rView = lerp(900, 2.3 * R, zf);
      var V = orbitView(L, rView, lerp(0.9, 0.5, zf));
      // 镜头从山顶拉远到整颗地球
      V.cy = lerp(L.h * 0.5 + (L.d3 ? -L.d3.sinE : 1) * (R + H2) * V.s, L.h * 0.5, zf);
      if (L.d3) L.d3.view(V);
      earth(L, V);
      // 山
      var mt = toS(V, 0, R + H2), hw = Math.max(10 / V.s, 0.05 * R), m0 = toS(V, -hw, R - 2), m1 = toS(V, hw, R - 2);
      c.fillStyle = "#4a3a8f"; c.beginPath(); c.moveTo(m0[0], m0[1]); c.lineTo(mt[0], mt[1]); c.lineTo(m1[0], m1[1]); c.fill();
      Dr.label(c, "牛顿之山", mt[0] + 8, mt[1] - 4, "#bcb5e2", 11);
      if (st.body && L.phase === "running" || st.body && !st.done) {
        var steps = L.RM ? 1600 : 700, sub = 2, n = Math.round(steps * dt / sub);
        for (var i = 0; i < n && !st.done; i++) {
          var dragFn = L.v.drag ? function (x, y, vx, vy) { var h = Math.hypot(x, y) - R, sp = Math.hypot(vx, vy), k = K_DRAG * Math.exp(-(h - H2) / 60); return [-k * sp * vx, -k * sp * vy]; } : null;
          P.advance(st.body, MU, sub, sub, dragFn);
          var b = st.body, r = Math.hypot(b.x, b.y), a = Math.atan2(b.y, b.x), da = a - st.prevA;
          if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
          st.ang += -da; st.prevA = a; st.minR = Math.min(st.minR, r);
          if (st.trail.length === 0 || i % 3 === 0) st.trail.push([b.x, b.y]);
          if (st.ang >= 2 * Math.PI * (st.orbits + 1)) { st.orbits++; L.snd.pulse(pulseHz(gHere(MU, r))); }
          if (r < R) { st.out = "crash"; st.done = true; L.snd.glide(330, 70, 0.9); }
          else if (r > 5.5 * R) { st.out = "escape"; st.done = true; L.sfx("whoosh"); }
          else if (st.orbits >= 3) { st.out = "orbit"; st.done = true; }
          if (L.phase === "running" && (st.out || st.orbits >= 1)) this.report(L);
        }
      }
      var pts = st.trail.map(function (p) { return toS(V, p[0], p[1]); });
      if (st.body && !st.done) pts.push(toS(V, st.body.x, st.body.y));
      Dr.path(c, pts, "#c4b5fd", 2);
      if (st.body) { var bp = toS(V, st.body.x, st.body.y); c.fillStyle = "#fff"; c.beginPath(); c.arc(bp[0], bp[1], 4, 0, 7); c.fill(); }
      var pr = L.pred != null ? L.pred : L.runPred;
      var spd = st.body ? Math.hypot(st.body.vx, st.body.vy) : L.v.v, alt = st.body ? Math.hypot(st.body.x, st.body.y) - R : H2;
      L.hud.innerHTML = "速度 <b>" + spd.toFixed(2) + " km/s</b> · 高度 <b>" + Math.max(0, alt).toFixed(0) + " km</b><br>已绕 <b>" + Math.round(st.ang * 180 / Math.PI) + "°</b> · 时间 <b>" + (st.body ? (st.body.t / 60).toFixed(0) : 0) + " 分钟</b>" + (pr != null ? "<br><span style='color:#fbbf24'>你的预测 " + pr.toFixed(1) + " km/s</span>" : "");
    },
    report: function (L) {
      var st = L.st, out = st.orbits >= 1 ? "orbit" : st.out, pv = L.runPred;
      var txt = out === "orbit" ? "绕地球一整圈!" : out === "crash" ? "落地了(绕了 " + Math.round(st.ang * 180 / Math.PI) + "°)" : "飞离地球了";
      L.finishRun({ pass: out === "orbit", predText: "猜要 " + pv.toFixed(1) + " km/s", resultText: "以 " + L.v.v.toFixed(2) + " km/s 开炮:" + txt + (L.v.drag ? "(开了阻力)" : ""),
        html: "你猜要 <b>" + pv.toFixed(1) + " km/s</b>;这一炮 <b>" + L.v.v.toFixed(2) + " km/s</b> → " + (out === "orbit" ? "<span class=ok>" + txt + "</span>" : "<span class=no>" + txt + "</span>"),
        say: out === "crash" ? "它绕了 " + Math.round(st.ang * 180 / Math.PI) + "° 就落地了。再快一点,落点会跑到哪里去?" : "它飞走了!是不是快过头了?慢一点会怎样?" });
    },
    predictGood: function (L) { return Math.abs(L.runPred - P.vCirc(MU, R + H2)) <= 0.6; },
    star3: function (L) { return L.attempts <= 3; }
  };

  /* ================= 第 3 关 电梯里的苹果 ================= */
  var L3 = {
    name: "电梯里的苹果",
    goal: "左边是舱里,右边是从外面看。宇航员松开苹果,比较三种情形。",
    note: "苹果与空间站只受地球引力;「悬停的空间站」是假想情形。",
    ask: "空间站离地面只有约 400 km,那里还有引力吗?",
    predict: { type: "choice", q: "在轨道上的空间站里,松开苹果,它会……", options: ["掉到地板上", "飘在原地", "飞向天花板"] },
    controls: [{ id: "sc", type: "seg", label: "情形", options: ["地面上的房间", "轨道上的空间站", "悬停的空间站(假想)"], value: 1 }],
    runLabel: "松手",
    crit: ["在轨道情形里松手", "预测正确", "也试了「悬停」情形"],
    hints: ["右边画面里,苹果和空间站各自在做什么运动?", "地面房间里的苹果和空间站里的苹果,受的引力差多少?(看右上角的数)", "只把情形换成「悬停的空间站」,苹果相对宇航员还动吗?空间站自己呢?"],
    summary: "失重不是没有引力,而是你和身边的东西在一起下落。",
    lights: "失重",
    card: { t: "失重 = 一起自由下落", b: "约 400 km 高处的引力仍有地面的约 89%。空间站、宇航员和苹果以同样的加速度一起「掉」向地球,彼此之间就没有挤压,看起来像飘着。", f: "g(r) = GM/r²,g(400 km) ≈ 8.7 m/s²", src: "OpenStax《University Physics Volume 1》13.2;NASA ISS 轨道数据" },
    init: function (L) { L.st = { t: 0, ran: {}, rel: 0, ext: null }; },
    // 切换情形:清空上一次松手的画面状态(保留已试过的情形记录)
    onControl: function (L, id) { if (id === "sc" && L.phase !== "running") L.st = { t: 0, ran: L.st.ran || {}, rel: 0, ext: null }; },
    run: function (L) {
      var st = L.st, sc = L.v.sc, r0 = R + 400;
      st.sc = sc; st.t = 0; st.reported = false;
      var v = sc === 1 ? P.vCirc(MU, r0) : 0;
      st.stn = P.body(0, r0, v, 0); st.apl = P.body(0, r0 + 0.001, v, 0);   // 苹果在宇航员手上方 1 m
      st.ext = P.body(0, r0, v, 0); st.trail = [[0, r0]]; st.crash = false;
      st.appleY = 1.0;   // 地面房间:苹果离地 1 m
    },

      // 近距视图:以飞船为中心,上 = 远离地心,右 = 前进方向
      var box = narrow ? Math.min(92, L.w * 0.25) : Math.min(130, L.w * 0.32), bx = L.w - box - 8, by = 8;
      c.fillStyle = "rgba(11,10,31,.85)"; c.strokeStyle = "#2e2a5e"; c.fillRect(bx, by, box, box); c.strokeRect(bx, by, box, box);
      var rm = Math.hypot(st.me.x, st.me.y), ux = st.me.x / rm, uy = st.me.y / rm, tx = -uy, ty = ux;
      var radial = rel.dx * ux + rel.dy * uy, along = rel.dx * tx + rel.dy * ty, scale = box / 2 / Math.max(200, Math.min(2000, Math.max(Math.abs(radial), Math.abs(along)) * 1.2));
      c.fillStyle = "#fff"; c.beginPath(); c.arc(bx + box / 2, by + box / 2, 3, 0, 7); c.fill();
      var qx = bx + box / 2 + along * scale, qy = by + box / 2 - radial * scale;
      if (qx > bx && qx < bx + box && qy > by && qy < by + box) { c.fillStyle = "#6ee7b7"; c.fillRect(qx - 4, qy - 2, 8, 4); }
      Dr.label(c, (narrow ? "±" : "近距视图 ±") + Math.round(box / 2 / scale) + " km", bx + 4, by + box - 6, "#bcb5e2", 10);
      L.hud.innerHTML = "距离 <b>" + rel.d.toFixed(0) + " km</b> · 相对速度 <b>" + rel.dv.toFixed(0) + " m/s</b><br>燃料 <b>" + st.fuel.toFixed(0) + " m/s</b> · 已绕 <b>" + st.orbits + "</b> 圈" +
        "<br><span style='color:#fbbf24'>黄线:你现在的轨道</span>";
    },
    end: function (L, ok, rel, why) {
      var st = L.st; st.live = false; st.bF.disabled = st.bB.disabled = true; st.ok = ok;
      if (!ok) L.snd.glide(260, 90, 0.7);
      var msg = ok ? "会合成功!用了 " + st.used.toFixed(0) + " m/s 燃料、" + (st.t / 60).toFixed(0) + " 分钟。" : why === "crash" ? "飞船掉进大气层了。" : "绕了 10 圈还没追上。";
      L.finishRun({ pass: ok, predText: "第一步选择「" + L.lv.predict.options[L.firstChoice] + "」", resultText: msg + "(点火 " + st.burns + " 次)",
        html: ok ? "<span class=ok>" + msg + "</span>" : "<span class=no>" + msg + "</span> 最近距离时你在空间站的哪一边?",
        say: why === "crash" ? "减速太多,轨道低到碰到大气了。少减一点会怎样?" : "飞船回到点火的位置时,空间站在你前面还是后面?" });
    },
    predictGood: function (L) { return L.firstChoice === 1; },
    star3: function (L) { return L.st.used <= 80 + 1e-6; }
  };

  NV.task({
    id: "orbit", guide: "abyss", scene3d: "core/orbit3d.js",
    title: "为什么宇航员在空间站会飘起来?",
    bridge: { href: "../../starhelm/", label: "天枢 Starhelm「空间站为什么掉不下来?」" },
    safety: "请勿在现实中模仿:不要从高处抛掷物体;火箭与发射只能在模拟中尝试。",
    levels: [L1, L2, L3, L4, L5]
  });
})();
