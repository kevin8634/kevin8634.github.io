<style>
  :root { --ink: #eef1ff; --mute: #9aa4cf; --line: rgb(160 185 255 / .18);
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 400 15px/1.6 var(--sans); min-height: 100vh;
    background: radial-gradient(1000px 500px at 10% -10%, rgb(70 56 170 / .35), transparent 60%), radial-gradient(800px 500px at 100% 0%, rgb(20 130 170 / .22), transparent 60%), #050817; background-attachment: fixed; }
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 28px) 120px; }
  .top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 16px) 0 0; }
  .top a, .top button { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 100px; border: 1px solid var(--line);
    background: rgb(10 14 36 / .5); color: var(--ink); text-decoration: none; font: 500 13px/1 var(--sans); cursor: pointer; }
  .top a:hover, .top button:hover { background: rgb(40 50 110 / .6); }
  .top .sp { flex: 1; }
  header.hero { text-align: center; padding: 56px 0 26px; }
  .hero p.k { margin: 0 0 12px; letter-spacing: .5em; font-size: 12px; color: var(--mute); }
  .hero h1 { margin: 0; font-weight: 200; font-size: clamp(40px, 7vw, 72px); letter-spacing: .12em;
    background: linear-gradient(100deg, #fff 10%, #8ff5d8 32%, #8ea2ff 50%, #e3a6ff 66%, #fff 88%); background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 10s ease-in-out infinite; }
  @keyframes flow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .hero p.s { color: var(--mute); margin: 12px 0 0; }
  /* 任务切换 */
  .tabs { position: sticky; top: 8px; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 6px; margin: 0 -6px 22px; border-radius: 100px;
    background: rgb(8 12 32 / .7); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--line); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 100px; border: 0; background: transparent;
    color: #c4cbec; font: 500 14px/1 var(--sans); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
  .tab:hover { background: rgb(255 255 255 / .07); }
  .tab.on { color: #071027; background: linear-gradient(135deg, #fff, color-mix(in srgb, var(--c) 55%, #fff)); box-shadow: 0 0 20px color-mix(in srgb, var(--c) 45%, transparent); }
  /* 任务头卡 */
  .head { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 24px; border-radius: 26px;
    background: linear-gradient(140deg, color-mix(in srgb, var(--c) 20%, rgb(20 26 66 / .7)), rgb(8 12 32 / .7)); border: 1px solid var(--line); }
  .head .em { font-size: 52px; line-height: 1; filter: drop-shadow(0 0 18px var(--c)); }
  .head h2 { margin: 0 0 8px; font-size: clamp(20px, 3vw, 28px); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { padding: 3px 10px; border-radius: 100px; font-size: 12px; background: rgb(255 255 255 / .07); border: 1px solid var(--line); }
  .chips .lv { color: #ffd98a; border-color: rgb(255 217 138 / .35); }
  .acts { display: flex; flex-direction: column; gap: 8px; }
  .b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 18px; border-radius: 100px; border: 0; cursor: pointer; text-decoration: none;
    font: 600 14px/1 var(--sans); color: #071027; background: linear-gradient(135deg, #fff, color-mix(in srgb, var(--c) 45%, #fff)); white-space: nowrap; }
  .b.g { background: rgb(255 255 255 / .06); color: var(--ink); border: 1px solid var(--line); }
  @media (max-width: 640px) { .head { grid-template-columns: auto 1fr; } .acts { grid-column: 1 / -1; flex-direction: row; } .acts .b { flex: 1; } }
  /* 区块 */
  .blk { margin-top: 34px; }
  .blk > h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; font-weight: 500; letter-spacing: .3em; color: var(--mute); }
  .blk > h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .blk > h3 i { font-style: normal; font-size: 18px; letter-spacing: 0; }
  .must { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .m { position: relative; padding: 16px 16px 16px 54px; border-radius: 18px; background: rgb(14 20 50 / .62); border: 1px solid var(--line); cursor: pointer;
    transition: transform .25s, border-color .25s, box-shadow .25s; }
  .m:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c) 50%, transparent); box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
  .m .n { position: absolute; left: 14px; top: 14px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600;
    color: #071027; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .m.ok .n { background: #8fe3b8; box-shadow: 0 0 14px #8fe3b8; }
  .m.ok .n::after { content: "✓"; }
  .m.ok .n span { display: none; }
  .m b { display: block; font-size: 15px; margin-bottom: 4px; }
  .m p { margin: 0; color: #c4cbec; font-size: 14px; }
  .hint { font-size: 12px; color: var(--mute); margin: 10px 0 0; }
  .forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .f { padding: 16px 18px; border-radius: 18px; background: linear-gradient(160deg, rgb(20 28 70 / .7), rgb(8 12 32 / .7)); border: 1px solid var(--line); }
  .f small { display: block; color: var(--mute); font-size: 12px; margin-bottom: 6px; }
  .f code { display: block; font: 500 16px/1.5 "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; color: #fff; text-shadow: 0 0 14px color-mix(in srgb, var(--c) 60%, transparent); word-break: break-word; }
  .two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  .tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 1px solid var(--line); }
  .tl li { position: relative; padding: 0 0 14px 6px; color: #d6dbf7; font-size: 14px; }
  .tl li::before { content: ""; position: absolute; left: -24px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .tl li em { font-style: normal; color: var(--c); font-weight: 600; margin-right: 6px; }
  .apps { display: flex; flex-wrap: wrap; gap: 8px; }
  .apps span { padding: 8px 14px; border-radius: 14px; background: rgb(255 255 255 / .05); border: 1px solid var(--line); font-size: 14px; }
  /* 难度路线 */
  .route { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .route button { text-align: left; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgb(14 20 50 / .5); color: var(--ink); cursor: pointer; font: inherit; }
  .route button:hover { border-color: var(--c); }
  .route b { display: block; font-size: 13px; } .route small { color: var(--mute); font-size: 12px; }
  .view { animation: in .45s cubic-bezier(.2,.9,.3,1); }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  footer { text-align: center; color: var(--mute); font-size: 12px; margin-top: 60px; }
</style>
</head>
