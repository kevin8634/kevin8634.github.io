    <script>
      /* ---------- audio ---------- */
      const Audio_ = (() => {
        let ctx = null, master = null, musicGain = null, sfxOn = true, musicOn = false, vol = 0.3, started = false;
        function ensure() {
          if (ctx) return ctx;
          const AC = window.AudioContext || window.webkitAudioContext;
          ctx = new AC();
          master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
          musicGain = ctx.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
          return ctx;
        }
        function unlock() { ensure(); if (ctx.state === "suspended") ctx.resume(); started = true; }
        function env(node, t, a, d, peak) {
          const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(peak, t + a);
          g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
          node.connect(g); g.connect(master); return g;
        }
        function tone(freq, t, dur, type, peak) {
          const o = ctx.createOscillator(); o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
          env(o, t, 0.012, dur, peak || 0.18); o.start(t); o.stop(t + dur + 0.08); return o;
        }
        const sfx = {
          click() { const t = ctx.currentTime; tone(880, t, 0.05, "triangle", 0.08); },
          correct() { const t = ctx.currentTime; [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t + i * 0.07, 0.22, "sine", 0.14)); },
          wrong() { const t = ctx.currentTime; tone(150, t, 0.22, "sine", 0.16); tone(110, t + 0.06, 0.26, "sine", 0.12); },
          star() { const t = ctx.currentTime; [784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.055, 0.3, "triangle", 0.09)); },
          fanfare() { const t = ctx.currentTime; [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.3]].forEach(([f, d]) => { tone(f, t + d, 0.4, "sawtooth", 0.07); tone(f * 2, t + d, 0.3, "sine", 0.05); }); },
          /* 渗流: a short, soft squeak */
          squeak() {
            const t = ctx.currentTime, o = ctx.createOscillator(); o.type = "sine";
            o.frequency.setValueAtTime(1300, t); o.frequency.exponentialRampToValueAtTime(1900, t + 0.05); o.frequency.exponentialRampToValueAtTime(1500, t + 0.11);
            env(o, t, 0.01, 0.11, 0.05); o.start(t); o.stop(t + 0.16);
          },
          bonk() {
            const t = ctx.currentTime, o = ctx.createOscillator();
            o.type = "square"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
            env(o, t, 0.005, 0.22, 0.12); o.start(t); o.stop(t + 0.3); tone(95, t + 0.02, 0.2, "sine", 0.18);
          },
          siren() {
            const t = ctx.currentTime, o = ctx.createOscillator(); o.type = "square"; o.frequency.setValueAtTime(660, t);
            [0.3, 0.6, 0.9, 1.2].forEach((d, i) => o.frequency.linearRampToValueAtTime(i % 2 ? 660 : 990, t + d));
            env(o, t, 0.02, 1.2, 0.05); o.start(t); o.stop(t + 1.3);
          },
          tick(f) { tone(f || 600, ctx.currentTime, 0.06, "sine", 0.07); },
          pop(f) { const t = ctx.currentTime; tone(f || 200 + Math.random() * 500, t, 0.18, "triangle", 0.05); },
          chord() { const t = ctx.currentTime; [523.25, 659.25, 783.99, 987.77, 1318.5].forEach((f, i) => tone(f, t + i * 0.012, 0.55, "triangle", 0.06)); },
        };
        /* tension bed for later BOSS rounds */
        let sw = null;
        function swarm(on) {
          if (on) {
            if (sw || !sfxOn || !started) return; ensure();
            const t = ctx.currentTime, g = ctx.createGain(), f = ctx.createBiquadFilter(), nodes = [];
            f.type = "bandpass"; f.frequency.value = 650; f.Q.value = 1.2;
            g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.028, t + 1.5); f.connect(g); g.connect(master);
            [196, 203, 247, 252].forEach((fr, i) => {
              const o = ctx.createOscillator(), l = ctx.createOscillator(), lg = ctx.createGain();
              o.type = "sawtooth"; o.frequency.value = fr; l.frequency.value = 5 + i * 1.7; lg.gain.value = 9;
              l.connect(lg); lg.connect(o.frequency); o.connect(f); o.start(t); l.start(t); nodes.push(o, l);
            });

            const t = ctx.currentTime, s = sw; sw = null;
            s.g.gain.cancelScheduledValues(t); s.g.gain.setValueAtTime(s.g.gain.value, t); s.g.gain.linearRampToValueAtTime(0.0001, t + 0.8);
            setTimeout(() => { s.nodes.forEach((n) => n.stop()); s.g.disconnect(); }, 900);

        }
        function play(name, arg) { if (!sfxOn || !started) return; ensure(); if (ctx.state === "suspended") ctx.resume(); duckMusic(); (sfx[name] || sfx.click)(arg); }
        /* ---------- 专注音乐: generative engine, lookahead scheduler (25ms tick, 0.1s ahead) ---------- */
        const PENTA = [0, 2, 4, 7, 9];
        const CH = { I: [0, 4, 7, 11], ii: [2, 5, 9, 12], iii: [4, 7, 11, 14], IV: [5, 9, 12, 16], V: [7, 11, 14, 17], vi: [9, 12, 16, 19] };
        const P = (s) => s.split(" ").map((n) => CH[n]);
        const TRACKS = [
          { id: "lofi", name: "星空 Lo-fi", bpm: 72, swing: 0.2, key: 57, cb: 1, wet: 0.3, progs: [P("ii V I vi"), P("IV iii ii I"), P("vi IV I V")] },

            ok: "对！βSI/N < γI ⇔ S/N < 1/R₀。R₀ = 4 时，S 降到 250 人以下，I 就开始减少。" },
        ];
        const qs = Q.map(() => ({ tries: 0, solved: false, first: false })), quiz = $$("#quiz4");
        Q.forEach((item, qi) => {
          const bx = el("div", "x-sub", `<p>${qi + 1}. ${item.q}</p>`), opts = el("div", "x-opts");
          item.o.forEach((txt, oi) => {
            const bn = el("button", "x-opt x-qopt"); bn.textContent = txt; opts.append(bn);
            bn.addEventListener("click", () => {
              const s = qs[qi]; if (s.solved) return;
              if (oi === item.a) {
                s.solved = true; s.first = s.tries === 0; bn.classList.add("good");
                opts.querySelectorAll("button").forEach((x) => (x.disabled = true));
                Audio_.play("correct"); say("✓ " + item.ok, s.first ? "一次答对。" : "答出来了；一次答对才算满星。");
                got.quiz = qs.filter((x) => x.solved).length >= 2 ? 1 : 0; paint(); check();
              } else {
                s.tries++; bn.classList.add("bad"); bn.disabled = true; Audio_.play("wrong");
                opts.classList.remove("x-flash"); void opts.offsetWidth; opts.classList.add("x-flash");
                say(s.tries >= 2 ? item.hint : item.nudge, s.tries >= 2 ? "" : "再想想，答错两次我就给提示。");
              }
            });
          });
          bx.append(opts); quiz.append(bx);
        });

        /* clear */
        let awarded = 0, card = null;
        function check() {
          if (!(got.full && got.a && got.b && got.quiz)) return;
          const right = qs.filter((x) => x.first).length, stars = right === 3 ? 3 : right === 2 ? 2 : 1;
          if (stars <= awarded) return;
          const first = !awarded; done(stars, first ? 40 + 20 * stars : 20 * (stars - awarded)); awarded = stars;
          if (first) { award("model"); light(["c01", "c15", "m16"]); say("建模师，任务完成！三个水桶、两根管子、两个参数，就把一场疫情的起落算了出来。", "第 5 关「BOSS 压平曲线」已解锁。"); }
          const nc = endCard(stars, "建模师上任！", [
            ["变化率 = 每天流量", "dS/dt = −βSI/N，dI/dt = βSI/N − γI，dR/dt = γI：流进流出多少，桶里就变多少。"],
            ["差分近似（欧拉法）", "把一天当一步：S′ = S − βSI/N，I′ = I + βSI/N − γI，R′ = R + γI。每按一次「逐日推进」就是一步。"],
            ["R₀ = β/γ 与过冲", "S/N < 1/R₀ 时 I 开始减少，但最终感染会冲过 1 − 1/R₀：R₀ = 4 时阈值 750 人，第 160 天 R ≈ 985 人。"],
            ["数学建模", "假设 → 方程 → 模拟 → 对照现实（Kermack & McKendrick, 1927）。也能用来预测谣言传播、产品扩散。"],
          ], "c01 变化率 · c15 常微分方程 · m16 数学建模全流程");
          card ? card.replaceWith(nc) : root.append(nc); card = nc;
          renderSky(); renderFinal();
        }
      } });
      /* ===== LEVEL 5 · BOSS 压平曲线 ===== */
      LEVELS.push({ id: 5, title: "BOSS 压平曲线", init(root, done) {
        const N = 1000, D = 300, BED = 150, BUD = 10, lv = { m: 0, q: 0, v: 0 };
        const K = [["m", "😷 口罩", 2, "β × (1 − 0.15·级)：每次接触更难传染"], ["q", "🏠 隔离", 3, "γ + 0.05·级：病人更早离开传播"], ["v", "💉 疫苗", 3, "开始前把 15%·级 的 S 直接移到 R"]];
        const cost = () => K.reduce((s, [k, , c]) => s + c * lv[k], 0), r1 = (x) => Math.round(x);
        function sim(L) {
          const b = 0.5 * (1 - 0.15 * L.m), g = 0.1 + 0.05 * L.q, S0 = (N - 1) * (1 - 0.15 * L.v), ys = [{ x: 0, y: 1 }];
          let S = S0, I = 1, R = N - 1 - S0, pk = { d: 0, v: 1 };
          for (let d = 1; d <= D; d++) { const n = (b * S * I) / N, r = g * I; S -= n; I += n - r; R += r; ys.push({ x: d, y: I }); if (I > pk.v) pk = { d, v: I }; }
          return { r0: ((b / g) * S0) / N, ys, pk, inf: R - (N - 1 - S0) };
        }
        const base = sim(lv);
        const say = guide(root, `小镇 1000 人，医院只有 150 张床。不干预时感染峰值约 ${r1(base.pk.v)} 人，医院会被挤爆。你只有 10 枚预算币。`, "给三张干预卡加减等级，再点「模拟 300 天」。峰值低于 150 张床就过关。");
        const rest = el("div", "x-sub"); root.append(rest);
        rest.innerHTML = `<div class="x-row"><span class="x-meter">🪙 剩余 <b id="left"></b>/10 币</span><span class="x-meter">R₀_eff = β′/γ′ × S₀/N = <b id="r0e"></b></span></div>
          <div class="x-hbar" id="bud" role="meter" aria-valuemin="0" aria-valuemax="10" aria-label="已用预算"><i></i></div>
          <div class="x-cards">${K.map(([k, n, c, d]) => `<div class="x-card"><h3>${n} <span class="pill">${c} 币/级</span></h3><p class="fineprint">${d}</p>
            <div class="x-row x-yn"><button class="x-btn" data-k="${k}" data-d="-1" aria-label="${n} 降一级">−</button><span class="x-meter">第 <b id="l${k}">0</b>/3 级</span><button class="x-btn" data-k="${k}" data-d="1" aria-label="${n} 升一级">+</button></div></div>`).join("")}</div>
          <div class="x-row"><button class="x-btn x-btn--go" id="go">模拟 300 天</button><span class="x-meter">第 <b id="day">0</b>/300 天</span></div>
          <div class="stats"><div class="stat"><span class="stat__fig" id="pv">—</span><span class="stat__label">感染峰值 I（人）</span></div>
            <div class="stat"><span class="stat__fig" id="pd">—</span><span class="stat__label">峰值日（第几天）</span></div>
            <div class="stat"><span class="stat__fig" id="tr">—</span><span class="stat__label">累计感染 R(300)，不含疫苗移入</span></div></div>
          <figure class="chart"><figcaption class="chart__cap" id="cap">感染人数 I 与 150 张床<small>N = 1000，起始 I = 1；灰线为不干预；横轴 = 天，纵轴 = 同时生病的人</small></figcaption>
            <div class="chart__canvas chart__canvas--tall"><canvas id="flc" role="img" aria-label="不干预时感染峰值约 ${r1(base.pk.v)} 人，远超 150 张床"></canvas></div></figure>`;
        const $$ = (s) => rest.querySelector(s);
        let fin = false, cur = null, timer = null, fails = 0, best = 0, card = null;
        const chart = new Chart($$("#flc"), {
          type: "line",
          data: { datasets: [{ label: "不干预", data: base.ys, borderColor: "var(--chart-muted)", backgroundColor: "var(--chart-muted)" },
            { label: "你的方案", data: [], borderColor: "var(--chart-ink)", backgroundColor: "var(--chart-ink)", pointRadius: (c) => (fin && c.dataIndex === cur.pk.d ? 4 : 0) },
            { label: "床位 150", data: [{ x: 0, y: BED }, { x: D, y: BED }], borderColor: "var(--chart-bad)", borderDash: [3, 4], borderWidth: 1, pointRadius: 0 }] },
          options: { scales: { x: { type: "linear", min: 0, max: D, title: { display: true, text: "天" } }, y: { min: 0, max: 550 } },
            plugins: { tooltip: { callbacks: { title: (i) => `第 ${i[0].parsed.x} 天`, label: (c) => `${c.dataset.label}：${r1(c.parsed.y)} 人` } },
              datalabels: { ...Hark.labels.points, display: (c) => fin && c.datasetIndex === 1 && c.dataIndex === cur.pk.d, formatter: (v) => `峰值 ${r1(v.y)} 人` } } },
        });
        function paint() {
          const c = cost(), r = sim(lv), busy = !!timer;
          $$("#left").textContent = BUD - c; $$("#r0e").textContent = r.r0.toFixed(2);
          $$("#bud i").style.width = (c / BUD) * 100 + "%"; $$("#bud").setAttribute("aria-valuenow", c);
          K.forEach(([k]) => ($$("#l" + k).textContent = lv[k]));
          rest.querySelectorAll("[data-k]").forEach((x) => { const k = x.dataset.k, up = +x.dataset.d > 0, kc = K.find((y) => y[0] === k)[2];
            x.disabled = busy || (up ? lv[k] >= 3 || c + kc > BUD : lv[k] <= 0); });
          $$("#go").disabled = busy;
        }
        rest.querySelectorAll("[data-k]").forEach((x) => x.addEventListener("click", () => {
          lv[x.dataset.k] += +x.dataset.d; Audio_.play("tick", 400 + cost() * 40); paint();
        }));
        $$("#go").addEventListener("click", () => {
          if (timer) return; Audio_.play("click"); fin = false; cur = sim(lv);
          const ds = chart.data.datasets[1]; ds.data = []; let d = 0, crossed = false;
          const frame = (n) => {
            for (const to = Math.min(D, d + n); d <= to; d++) { ds.data.push(cur.ys[d]); if (!crossed && cur.ys[d].y >= BED) { crossed = true; Audio_.play("siren"); } }
            $$("#day").textContent = d - 1; chart.update("none");
            if (d > D) { clearInterval(timer); timer = null; Audio_.swarm(false); end(); }
          };
          if (reduced()) return frame(D);
          Audio_.swarm(true); timer = setInterval(() => (rest.isConnected ? frame(6) : (clearInterval(timer), Audio_.swarm(false))), 40); paint();
        });
        function end() {
          const r = cur, pv = r1(r.pk.v); fin = true; chart.update("none"); paint();
          $$("#pv").textContent = pv; $$("#pd").textContent = r.pk.d; $$("#tr").textContent = r1(r.inf);
          const sum = `峰值第 ${r.pk.d} 天 ${pv} 人（不干预：第 ${base.pk.d} 天 ${r1(base.pk.v)} 人）`;
          $$("#cap").innerHTML = `${sum}<small>方案：口罩 ${lv.m} 级 · 隔离 ${lv.q} 级 · 疫苗 ${lv.v} 级，花 ${cost()} 币；灰线为不干预；横轴 = 天，纵轴 = 同时生病的人</small>`;
          $$("#flc").setAttribute("aria-label", `${sum}，${r.pk.v < BED ? "低于" : "超过"} 150 张床`);
          if (r.pk.v >= BED) {
            fails++;
            return say(`医院挤爆了：峰值 ${pv} 人，超过 150 张床 ${pv - BED} 人。`, fails >= 3 ? "提示：试试把口罩加满，再看隔离。" : fails === 2 ? "提示：哪个手段每一枚币最划算？" : "调整干预卡，再模拟一次。");
          }
          const stars = r.pk.v < 120 ? 3 : r.pk.v < 135 ? 2 : 1;
          say(`守住了！峰值 ${pv} 人 < 150 张床，而且推迟到第 ${r.pk.d} 天。${stars < 3 ? `峰值低于 ${stars === 1 ? 135 : 120} 人能拿 ${stars + 1} 星。` : "三星方案！"}`, "累计感染不一定少很多，但病床一直够用。");
          if (stars <= best) return Audio_.play("fanfare");
          const first = !best; done(stars, first ? 60 + 20 * stars : 20 * (stars - best)); best = stars;
          const nc = endCard(stars, "曲线压平者！", [
            ["压平曲线不一定减少总感染", `累计感染 ${r1(base.inf)} → ${r1(r.inf)} 人；但峰值从第 ${base.pk.d} 天 ${r1(base.pk.v)} 人，推迟、降低到第 ${r.pk.d} 天 ${pv} 人，医院不崩溃。`],
            ["有限预算优化", "10 枚币怎么分：比的是每一枚币能把峰值压下多少，而不是哪张卡单看最强。"],
            ["建模 = 假设 → 方程 → 模拟 → 检验 → 改进", "假设均匀混合、参数固定 → SIR 差分方程 → 跑 300 天 → 峰值对照 150 张床 → 换方案再跑。"],
          ], "m16 数学建模全流程 · m04 指数模型");
          card ? card.replaceWith(nc) : root.append(nc); card = nc;
          if (first) { award("flat"); light(["m16", "m04"]); renderSky(); renderFinal(); setTimeout(() => $("#sky").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }), 1600); }
          else renderFinal();
        }
        paint();
      } });
      /* ---------- boot ---------- */
      renderBar(); renderBadges(); renderMap(); renderSky(); renderFinal();
      const once = () => { Audio_.unlock(); window.removeEventListener("pointerdown", once); window.removeEventListener("keydown", once); };
      window.addEventListener("pointerdown", once); window.addEventListener("keydown", once);
      $("#notes-btn").addEventListener("click", () => toggleNotes($("#notes").hidden));
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#notes").hidden) toggleNotes(false); });
      $("#sfx").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.setSfx(on); if (on) Audio_.play("click");
      });
      $("#music").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.unlock(); Audio_.setMusic(on); Audio_.play("click");
      });
      $("#vol").addEventListener("input", (e) => Audio_.setVol(+e.target.value / 100));
      $("#track").addEventListener("change", (e) => Audio_.setTrack(+e.target.value));
    </script>
      <script src="../ma.js"></script>
  </body>
</html>
