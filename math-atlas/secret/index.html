<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星图任务 · 怎样把秘密藏进数字里</title>
    <meta name="description" content="两千年来,人类一直在用数学藏秘密。今天,你要学会藏,也要学会破。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      /* x- classes: the game shell. Tokens only. */
      .x-bar {
        position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 30;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        padding: 8px 12px; border-radius: var(--r-pill);
        background: var(--mat-agent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-primary); box-shadow: var(--hark-shadow);
      }
      .x-brand { font: var(--type-label); margin-right: auto; white-space: nowrap; }
      .x-meter { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--fill-tertiary); font: var(--type-tag); color: var(--text-primary); }
      .x-meter b { font-weight: var(--weight-bold); }
      .x-toggle {
        display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap);
        padding: 4px 12px; border: 1px solid var(--stroke-primary); border-radius: var(--r-pill);
        background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-tag); cursor: pointer;
      }
      .x-toggle[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
      .x-vol { width: 86px; accent-color: var(--fill-primary); }
      .x-map { position: relative; padding: 8px 0 4px; }
      .x-path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .x-nodes { position: relative; display: grid; gap: 10px; }
      .x-node {
        display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 12px;
        width: min(100%, 560px); padding: 10px 14px; border-radius: var(--r-l);
        border: 1px solid var(--stroke-primary); background: var(--fill-primary-on);
        color: var(--text-primary); font: var(--type-body); text-align: left; cursor: pointer;
        transition: box-shadow var(--dur-quick) var(--ease-out), transform var(--dur-quick) var(--ease-out);
      }
      .x-node:nth-child(even) { justify-self: end; }
      .x-node:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--hark-shadow); }
      .x-node:disabled { opacity: 0.55; cursor: not-allowed; }
      .x-node__num { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--fill-tertiary); font: var(--type-heading); }
      .x-node.is-open .x-node__num { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-node__t { display: block; font: var(--type-body-strong); }
      .x-node__s { display: block; font: var(--type-caption); color: var(--text-secondary); }
      .x-stars { font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
      .x-panel { padding: 16px; border-radius: var(--r-l); background: var(--fill-tertiary); display: grid; gap: 14px; }
      .x-cat { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
      .x-cat__face { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--fill-primary-on); font-size: 24px; border: 1px solid var(--stroke-primary); }
      .x-bubble { position: relative; padding: 10px 14px; border-radius: var(--r-m); background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); font: var(--type-body); }
      .x-bubble small { display: block; margin-top: 4px; font: var(--type-caption); color: var(--text-secondary); }
      .x-opts { display: flex; flex-wrap: wrap; gap: 10px; }
      .x-opt { padding: 8px; border-radius: var(--r-m); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); cursor: pointer; display: grid; gap: 6px; justify-items: center; font: var(--type-tag); color: var(--text-primary); }
      .x-qopt { text-align: left; font: var(--type-small); min-height: var(--tap); padding: 8px 14px; }
      .x-qopt.good { border-color: var(--fill-system-green); box-shadow: inset 0 0 0 1px var(--fill-system-green); }
      .x-qopt.bad { border-color: var(--fill-system-red); opacity: 0.6; }
      .x-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .x-btn {
        display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 6px 16px;
        border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on);
        color: var(--text-primary); font: var(--type-label); cursor: pointer;
      }
      .x-btn--go, .x-btn[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
      .x-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .x-toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
      .x-toast { padding: 10px 16px; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-tag); box-shadow: var(--hark-shadow); animation: x-pop 320ms var(--ease-out); }
      @keyframes x-pop { from { opacity: 0; transform: translateY(10px); } }
      .x-shelf { display: flex; flex-wrap: wrap; gap: 8px; }
      .x-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); background: var(--fill-tertiary); font: var(--type-tag); color: var(--text-secondary); }
      .x-badge.got { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-end { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-l); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); }
      .x-end h3 { font: var(--type-heading); }
      .x-end dl { display: grid; gap: 8px; margin: 0; }
      .x-end dt { font: var(--type-body-strong); }
      .x-end dd { margin: 0; font: var(--type-small); color: var(--text-secondary); }
      .x-starid { font: var(--weight-regular) 12px/1.3 "Geist Mono", monospace; }
      .x-flash { animation: x-shake 320ms var(--ease-out); }
      @keyframes x-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      #stage [hidden] { display: none; }
      /* level 1: cipher wheel */
      .x-card { display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--r-l); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); }
      .x-card h3 { font: var(--type-body-strong); }
      .x-card p { font: var(--type-small); color: var(--text-secondary); }
      .x-wheelbox { display: grid; grid-template-columns: minmax(0, 320px) 1fr; gap: 16px; align-items: center; }
      .x-wheel { width: 100%; max-width: 320px; aspect-ratio: 1; display: block; touch-action: none; cursor: grab; border-radius: 50%; outline-offset: 4px; }
      .x-wheel:active { cursor: grabbing; }
      .x-wheel text { font: var(--weight-medium) 15px/1 "Geist Mono", monospace; fill: var(--text-primary); user-select: none; }
      .x-wheel .x-in { fill: var(--text-secondary); font-size: 14px; }
      .x-wheel .x-kc { font: var(--weight-bold) 22px/1 var(--sans); }
      .x-w-inner { transition: transform 220ms var(--ease-out); }
      .x-k { font: var(--type-figure); }
      .x-out { font: var(--weight-regular) 17px/1.4 "Geist Mono", monospace; letter-spacing: 0.12em; padding: 10px 12px; border-radius: var(--r-s); background: var(--fill-tertiary); color: var(--text-primary); word-break: break-all; transition: box-shadow var(--dur-quick) var(--ease-out); }
      .x-glow { box-shadow: 0 0 0 2px var(--fill-system-green), 0 0 18px var(--fill-system-green); }
      .x-field { min-height: var(--tap); padding: 8px 12px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--weight-regular) 16px/1.3 "Geist Mono", monospace; text-transform: uppercase; width: min(100%, 360px); }
      .x-field--num { width: 96px; text-transform: none; }
      /* level 2: frequency charts */
      .x-fchart { width: 100%; height: auto; display: block; overflow: visible; }
      .x-fchart text { font: var(--weight-regular) 11px/1 "Geist Mono", monospace; fill: var(--text-secondary); user-select: none; }
      .x-fchart .x-fl { font-size: 12px; fill: var(--text-primary); }
      .x-fbar rect.x-fb { fill: var(--text-primary); transition: height 90ms var(--ease-out), y 90ms var(--ease-out), fill var(--dur-quick) var(--ease-out); }
      .x-fbar.is-good rect.x-fb { fill: var(--fill-system-green); }
      .x-fbar.is-bad rect.x-fb { fill: var(--fill-system-red); }
      .x-fbar[role="button"] { cursor: pointer; outline: none; }
      .x-fbar[role="button"]:hover rect.x-fb, .x-fbar[role="button"]:focus-visible rect.x-fb { opacity: 0.7; }
      .x-fbar[role="button"]:focus-visible rect.x-fhit { stroke: var(--fill-system-orange); stroke-width: 2; }
      .x-fref rect { fill: var(--fill-tertiary); stroke: var(--stroke-primary); }
      .x-slide { touch-action: pan-y; cursor: grab; }
      .x-slide:active { cursor: grabbing; }
      .x-slide .x-fc { transition: transform 200ms var(--ease-out); }
      .x-slide .x-fc rect { fill: var(--text-primary); opacity: 0.55; }
      .x-slide .x-fc text { fill: var(--text-primary); }
      .x-corr { height: 12px; border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; border: 1px solid var(--stroke-secondary); }
      .x-corr > i { display: block; height: 100%; width: 0; border-radius: var(--r-pill); background: var(--text-secondary); transition: width 200ms var(--ease-out), background var(--dur-quick) var(--ease-out); }
      .x-corr.is-hit > i { background: var(--fill-system-green); }
      .x-out--long { font-size: 14px; letter-spacing: 0.06em; word-break: normal; }
      @media (prefers-reduced-motion: reduce) { .x-fbar rect.x-fb, .x-slide .x-fc, .x-corr > i { transition: none; } }
      @media (prefers-reduced-motion: reduce) { .x-toast, .x-flash { animation: none; } .x-w-inner { transition: none; } }
      @media (max-width: 599px) { .x-brand { width: 100%; } .x-vol { width: 70px; } .x-wheelbox { grid-template-columns: 1fr; justify-items: center; } }
    </style>
    <style>
      /* level 3: clock arithmetic */
      .x-k3-box { display: grid; grid-template-columns: minmax(0, 320px) 1fr; gap: 16px; align-items: center; }
      .x-k3-side { display: grid; gap: 10px; align-content: start; }
      .x-k3-clock { width: 100%; max-width: 320px; aspect-ratio: 1; display: block; margin-inline: auto; }
      .x-k3-face { fill: var(--fill-primary-on); stroke: var(--stroke-primary); }
      .x-k3-line { fill: none; stroke: var(--fill-system-green); stroke-width: 1.5; stroke-linejoin: round; opacity: 0.85; }
      .x-k3-pos text { fill: var(--text-primary); user-select: none; }
      .x-k3-pos .x-k3-lab { font: var(--weight-medium) 15px/1 "Geist Mono", monospace; }
      .x-k3-pos .x-k3-wk { font: var(--weight-medium) 16px/1 var(--sans); }
      .x-k3-pos .x-k3-sub { font: var(--weight-regular) 12px/1 "Geist Mono", monospace; fill: var(--text-secondary); }
      .x-k3-hit { fill: transparent; stroke: transparent; transition: fill var(--dur-quick) var(--ease-out); }
      .x-k3-dot { fill: var(--fill-tertiary); stroke: var(--stroke-primary); transition: fill var(--dur-quick) var(--ease-out); }
      .x-k3-pos.is-lit .x-k3-dot, .x-k3-pos.is-good .x-k3-dot { fill: var(--fill-system-green); stroke: transparent; }
      .x-k3-pos.is-good .x-k3-hit { fill: var(--fill-tertiary); stroke: var(--fill-system-green); stroke-width: 2; }
      .x-k3-pos.is-pick .x-k3-hit { stroke: var(--fill-system-orange); stroke-width: 2; }
      .x-k3-pos.is-bad .x-k3-hit { stroke: var(--fill-system-red); stroke-width: 2; }
      .x-k3-pos.is-dark { opacity: 0.28; }
      .x-k3-pos[role="button"] { cursor: pointer; outline: none; }
      .x-k3-pos[role="button"]:hover .x-k3-hit { fill: var(--fill-tertiary); }
      .x-k3-pos[role="button"]:focus-visible .x-k3-hit { fill: var(--fill-tertiary); stroke: var(--fill-system-orange); stroke-width: 2; }
      .x-k3-hand { transition: transform 180ms var(--ease-out); }
      .x-k3-hand line { stroke: var(--text-primary); stroke-width: 3; stroke-linecap: round; }
      .x-k3-hand circle, .x-k3-hub { fill: var(--text-primary); }
      .x-k3-n { font: var(--weight-medium) 12px/1 "Geist Mono", monospace; fill: var(--text-primary-on); }
      .x-card .x-k3-q { font: var(--type-body-strong); color: var(--text-primary); }
      .x-card .x-k3-expr { font: var(--weight-regular) 15px/1.4 "Geist Mono", monospace; color: var(--text-primary); padding: 8px 12px; border-radius: var(--r-s); background: var(--fill-tertiary); }
      .x-k3-rows { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font: var(--weight-regular) 14px/1.4 "Geist Mono", monospace; color: var(--text-primary); }
      .x-k3-range { width: min(100%, 320px); min-height: var(--tap); accent-color: var(--fill-primary); }
      @media (prefers-reduced-motion: reduce) { .x-k3-hand, .x-k3-dot, .x-k3-hit { transition: none; } }
      @media (max-width: 599px) { .x-k3-box { grid-template-columns: 1fr; } }
    </style>
    <style>
      /* level 4: prime factory */
      .x-k4-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
      .x-k4-n { min-height: var(--tap); min-width: 0; padding: 0; border: 1px solid var(--stroke-secondary); border-radius: 8px; background: var(--fill-primary-on); color: var(--text-primary); font: var(--weight-medium) 14px/1 "Geist Mono", monospace; cursor: pointer; transition: opacity 260ms var(--ease-out), background var(--dur-quick) var(--ease-out), box-shadow var(--dur-quick) var(--ease-out); }
      .x-k4-n:hover { background: var(--fill-tertiary); }
      .x-k4-n:focus-visible { outline: 2px solid var(--fill-system-orange); outline-offset: 1px; }
      .x-k4-n.is-one { color: var(--text-secondary); }
      .x-k4-n.is-out { opacity: 0.22; text-decoration: line-through; }
      .x-k4-n.is-p { background: color-mix(in srgb, var(--fill-system-orange) 32%, var(--fill-primary-on)); border-color: var(--fill-system-orange); }
      .x-k4-n.is-glow { border-color: var(--fill-system-green); box-shadow: 0 0 0 1px var(--fill-system-green), 0 0 10px var(--fill-system-green); }
      .x-k4-n.is-p.is-glow { border-color: var(--fill-system-orange); }
      .x-k4-n.is-bonk { animation: x-k4-shake 260ms var(--ease-out); }
      .x-k4-spark { animation: x-k4-pop 520ms var(--ease-out); }
      @keyframes x-k4-shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
      @keyframes x-k4-pop { 40% { transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .x-k4-n { transition: none; } .x-k4-n.is-bonk, .x-k4-spark { animation: none; } }
      @media (max-width: 599px) { .x-k4-grid { gap: 3px; } .x-k4-n { font-size: 12px; border-radius: 6px; } }
    </style>
    <style>
      /* level 5: RSA */
      .x-k5-lane { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-m); background: var(--fill-tertiary); font: var(--type-label); }
      .x-k5-track { position: relative; height: 40px; border-bottom: 1px dashed var(--stroke-primary); }
      .x-k5-item { position: absolute; top: 4px; left: 0; font-size: 24px; line-height: 32px; font-style: normal; white-space: nowrap; }
      .x-k5-item[data-f="0"] { left: calc(100% - 52px); animation: x-k5-out 900ms var(--ease-out); }
      .x-k5-item[data-f="1"] { left: 0; animation: x-k5-back 900ms var(--ease-out); }
      .x-k5-item[data-f="2"] { left: 0; animation: x-k4-pop 520ms var(--ease-out); }
      @keyframes x-k5-out { from { left: 0; } }
      @keyframes x-k5-back { from { left: calc(100% - 52px); } }
      .x-k5-lab { font: var(--type-body); }
      .x-k5-tip { min-width: var(--tap); min-height: var(--tap); border-radius: 50%; border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); cursor: pointer; }
      .x-k5-keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      .x-k5-key { display: grid; gap: 4px; padding: 12px 14px; border-radius: var(--r-m); background: var(--fill-tertiary); border: 1px solid var(--stroke-secondary); animation: x-k4-pop 520ms var(--ease-out); }
      .x-k5-key b { font: var(--type-label); }
      .x-k5-key span { font: var(--weight-regular) 16px/1.3 "Geist Mono", monospace; }
      .x-k5-key.is-priv { border-color: var(--fill-system-orange); }
      .x-k5-dot { fill: var(--fill-tertiary); stroke: var(--stroke-primary); transition: fill var(--dur-quick) var(--ease-out); }
      .x-k5-dot.is-lit { fill: var(--fill-system-green); stroke: transparent; }
      .x-k5-num { font: var(--weight-regular) 12px/1 "Geist Mono", monospace; fill: var(--text-secondary); }
      .x-k5-big { font: var(--weight-medium) 28px/1 "Geist Mono", monospace; fill: var(--text-primary); }
      .x-k5-spk { position: relative; }
      .x-k5-sp { position: absolute; left: 50%; top: 50%; font-style: normal; font-size: 18px; color: var(--fill-system-orange); pointer-events: none; animation: x-k5-burst 900ms var(--ease-out) forwards; }
      .x-k5-sp:nth-child(odd) { color: var(--fill-system-green); }
      @keyframes x-k5-burst { from { transform: translate(-50%, -50%) scale(0.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .x-k5-item, .x-k5-key { animation: none; } .x-k5-dot { transition: none; } }
    </style>
    <style>
      /* level 6: boss + mission complete */
      .x-k6-bat { display: inline-flex; align-items: center; gap: 4px; font: var(--type-label); }
      .x-k6-bat i { font-style: normal; font-size: 20px; transition: opacity var(--dur-quick) var(--ease-out); }
      .x-k6-bat i.is-off { opacity: 0.22; filter: grayscale(1); }
      .x-k6-bars { display: flex; gap: 2px; align-items: flex-end; }
      .x-k6-bars span { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .x-k6-bars i { width: 100%; border-radius: 2px; background: var(--text-primary); }
      .x-k6-bars b { font: var(--weight-regular) 12px/1 "Geist Mono", monospace; color: var(--text-secondary); }
      .x-k6-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
      .x-k6-nums span { display: grid; gap: 4px; justify-items: center; padding: 10px 6px; border-radius: var(--r-m); background: var(--fill-tertiary); transition: box-shadow var(--dur-quick) var(--ease-out); }
      .x-k6-nums b { font: var(--weight-medium) 20px/1 "Geist Mono", monospace; }
      .x-k6-nums small { font: var(--weight-regular) 12px/1.2 "Geist Mono", monospace; color: var(--text-secondary); }
      .x-k6-nums em { font: var(--type-figure); font-style: normal; min-height: 1.2em; }
      .x-k6-nums span.is-ok { box-shadow: 0 0 0 2px var(--fill-system-green); }
      .x-k6-time { height: 8px; border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; }
      .x-k6-time i { display: block; height: 100%; background: var(--fill-system-orange); transform-origin: left; transition: transform 1s linear; }
      .x-k6-mc { position: fixed; inset: 0; z-index: 70; display: flex; padding: var(--gutter); overflow: auto; background: color-mix(in srgb, var(--fill-primary) 45%, transparent); }
      .x-k6-fw { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .x-k6-mcard { position: relative; margin: auto; width: min(100%, 580px); box-shadow: var(--hark-shadow); animation: x-pop 320ms var(--ease-out); }
      .x-k6-mcard .stats { margin: 0; }
      .x-k6-eye { font: var(--type-caption); letter-spacing: 0.12em; color: var(--text-secondary); }
      .x-k6-ids { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
      .x-k6-ids li { padding: 4px 10px; border-radius: var(--r-pill); background: var(--fill-tertiary); font: var(--weight-regular) 12px/1.3 "Geist Mono", monospace; }
      @media (prefers-reduced-motion: reduce) { .x-k6-bat i, .x-k6-nums span, .x-k6-time i { transition: none; } .x-k6-mcard { animation: none; } }
    </style>
  </head>
  <body>
    <div class="page" id="top">
      <main class="main">
        <div class="x-bar" role="toolbar" aria-label="游戏状态">
          <span class="x-brand">星图任务 · 怎样把秘密藏进数字里</span>

    <script src="hark.js"></script>
    <script>
      /* ---------- audio ---------- */
      const Audio_ = (() => {
        let ctx = null, master = null, musicGain = null, sfxOn = true, musicOn = false, vol = 0.3, started = false;
        function ensure() {
          if (ctx) return ctx;
          const AC = window.AudioContext || window.webkitAudioContext;
          ctx = new AC();
          master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
          musicGain = ctx.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
          return ctx;
        }
        function unlock() { ensure(); if (ctx.state === "suspended") ctx.resume(); started = true; }
        function env(node, t, a, d, peak) {
          const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(peak, t + a);
          g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
          node.connect(g); g.connect(master); return g;
        }
        function tone(freq, t, dur, type, peak) {
          const o = ctx.createOscillator(); o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
          env(o, t, 0.012, dur, peak || 0.18); o.start(t); o.stop(t + dur + 0.08); return o;
        }
        const sfx = {
          click() { const t = ctx.currentTime; tone(880, t, 0.05, "triangle", 0.08); },
          correct() { const t = ctx.currentTime; [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t + i * 0.07, 0.22, "sine", 0.14)); },
          wrong() { const t = ctx.currentTime; tone(150, t, 0.22, "sine", 0.16); tone(110, t + 0.06, 0.26, "sine", 0.12); },
          star() { const t = ctx.currentTime; [784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.055, 0.3, "triangle", 0.09)); },
          fanfare() { const t = ctx.currentTime; [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.3]].forEach(([f, d]) => { tone(f, t + d, 0.4, "sawtooth", 0.07); tone(f * 2, t + d, 0.3, "sine", 0.05); }); },
          /* soft owl hoot: two low sine notes, each with a slight pitch drop */
          hoot() {
            const t = ctx.currentTime;
            [[392, 370, 0, 0.26], [330, 300, 0.32, 0.42]].forEach(([f0, f1, d, len]) => {
              const o = ctx.createOscillator(); o.type = "sine";
              o.frequency.setValueAtTime(f0, t + d); o.frequency.exponentialRampToValueAtTime(f1, t + d + len);
              const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t + d);
              g.gain.exponentialRampToValueAtTime(0.09, t + d + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + d + len);
              o.connect(g); g.connect(master); o.start(t + d); o.stop(t + d + len + 0.05);
            });
          },
          bonk() {
            const t = ctx.currentTime, o = ctx.createOscillator();
            o.type = "square"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
            env(o, t, 0.005, 0.22, 0.12); o.start(t); o.stop(t + 0.3); tone(95, t + 0.02, 0.2, "sine", 0.18);
          },
          tick(f) { tone(f || 600, ctx.currentTime, 0.06, "sine", 0.07); },
          pop(f) { const t = ctx.currentTime; tone(f || 200 + Math.random() * 500, t, 0.18, "triangle", 0.05); },
          chord() { const t = ctx.currentTime; [523.25, 659.25, 783.99, 987.77, 1318.5].forEach((f, i) => tone(f, t + i * 0.012, 0.55, "triangle", 0.06)); },
        };
        function play(name, arg) { if (!sfxOn || !started) return; ensure(); if (ctx.state === "suspended") ctx.resume(); duckMusic(); (sfx[name] || sfx.click)(arg); }
        /* ---------- 专注音乐: generative engine, lookahead scheduler (25ms tick, 0.1s ahead) ---------- */
        const PENTA = [0, 2, 4, 7, 9];
        const CH = { I: [0, 4, 7, 11], ii: [2, 5, 9, 12], iii: [4, 7, 11, 14], IV: [5, 9, 12, 16], V: [7, 11, 14, 17], vi: [9, 12, 16, 19] };
        const P = (s) => s.split(" ").map((n) => CH[n]);
        const TRACKS = [
          { id: "lofi", name: "星空 Lo-fi", bpm: 72, swing: 0.2, key: 57, cb: 1, wet: 0.3, progs: [P("ii V I vi"), P("IV iii ii I"), P("vi IV I V")] },
          { id: "rain", name: "雨夜书房", bpm: 60, swing: 0, key: 50, cb: 2, wet: 0.4, progs: [P("I iii vi IV"), P("vi ii V I"), P("IV I ii vi")] },
          { id: "dawn", name: "晨光", bpm: 90, swing: 0.08, key: 60, cb: 1, wet: 0.25, progs: [P("I V vi IV"), P("IV I V vi"), P("I ii IV V")] },
        ];
        let comp = null, duck = null, bus = null, echo = null, noiseBuf = null, players = [], timer = null, offT = null, mode = -1;
        const rnd = (n) => (Math.random() * n) | 0;
        const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
        const newMotif = () => [0, 0, 0, 0].map(() => rnd(8));
        function mutate(m) { const c = m.slice(); for (let i = 0, n = 1 + rnd(2); i < n; i++) { const j = rnd(4); c[j] = Math.max(0, Math.min(9, c[j] + [-2, -1, 1, 2][rnd(4)])); } return c; }
        function graph() {
          if (bus) return; ensure();
          comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.3;
          duck = ctx.createGain(); bus = ctx.createGain(); echo = ctx.createDelay(1.5);
          const fb = ctx.createGain(), lp = ctx.createBiquadFilter(); fb.gain.value = 0.32; lp.type = "lowpass"; lp.frequency.value = 1800;
          echo.connect(lp); lp.connect(fb); fb.connect(echo); lp.connect(bus);
          bus.connect(comp); comp.connect(duck); duck.connect(musicGain);
          const len = ctx.sampleRate * 2; noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        function note(p, m, t, dur, type, peak, a, wet) {
          const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = mtof(m);
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(p.out); if (wet) g.connect(p.wet); o.start(t); o.stop(t + dur + 0.05);
        }
        function hit(p, t, dur, peak, ftype, freq) {
          const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
          s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
          g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          s.connect(f); f.connect(g); g.connect(p.out); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
        }
        function kick(p, t) {
          const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.2);
          g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
          o.connect(g); g.connect(p.out); o.start(t); o.stop(t + 0.35); hit(p, t, 0.05, 0.05, "lowpass", 400);
        }
        function ep(p, ch, t, dur) {
          const tr = ctx.createGain(), lfo = ctx.createOscillator(), dep = ctx.createGain(), env = ctx.createGain();
          tr.gain.value = 0.75; lfo.frequency.value = 3.8; dep.gain.value = 0.22; lfo.connect(dep); dep.connect(tr.gain);
          env.gain.setValueAtTime(0.0001, t); env.gain.exponentialRampToValueAtTime(1, t + 0.02); env.gain.exponentialRampToValueAtTime(0.35, t + 0.9); env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          ch.forEach((m) => [["sine", 0.045], ["triangle", 0.01]].forEach(([ty, v]) => {
            const o = ctx.createOscillator(), g = ctx.createGain(); o.type = ty; o.frequency.value = mtof(m); o.detune.value = rnd(7) - 3; g.gain.value = v;
            o.connect(g); g.connect(tr); o.start(t); o.stop(t + dur + 0.05);
          }));
          tr.connect(env); env.connect(p.out); env.connect(p.wet); lfo.start(t); lfo.stop(t + dur + 0.05);
        }
        function pad(p, ch, t, dur, type, peak, lo, hi) {
          const f = ctx.createBiquadFilter(), env = ctx.createGain(); f.type = "lowpass";
          f.frequency.setValueAtTime(lo, t); f.frequency.linearRampToValueAtTime(hi, t + dur * 0.5); f.frequency.linearRampToValueAtTime(lo, t + dur);
          env.gain.setValueAtTime(0.0001, t); env.gain.linearRampToValueAtTime(peak, t + dur * 0.35); env.gain.linearRampToValueAtTime(0.0001, t + dur);
          ch.forEach((m) => [-7, 7].forEach((dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = mtof(m); o.detune.value = dt; o.connect(f); o.start(t); o.stop(t + dur + 0.05); }));
          f.connect(env); env.connect(p.out); env.connect(p.wet);
        }
        function rain(p) {
          const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), dep = ctx.createGain();
          s.buffer = noiseBuf; s.loop = true; f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 0.5; g.gain.value = 0.05;
          lfo.frequency.value = 0.07; dep.gain.value = 0.02; lfo.connect(dep); dep.connect(g.gain);
          s.connect(f); f.connect(g); g.connect(p.out); s.start(); lfo.start(); p.nodes.push(s, lfo);
        }
        function section(p) {
          let n; do n = rnd(3); while (n === p.prog); p.prog = n;
          if (Math.random() < 0.25) p.key = p.t.key + [0, 2, -2, 5, -3][rnd(5)];
          p.drums = Math.random() > 0.3;
          if (Math.random() < 0.4) p.motif = newMotif();
        }
        function step(p, t) {
          const T = p.t, s = p.step % 16, bar = (p.step / 16) | 0, beat = 60 / T.bpm;
          if (s === 0) {
            if (bar && bar % 8 === 0) section(p);
            p.cur = bar % 4 === 2 ? mutate(p.motif) : bar % 4 === 0 ? p.motif : p.cur;
          }
          const ch = T.progs[p.prog][((bar / T.cb) | 0) % 4].map((x) => p.key + x);
          const mel = (d) => p.key + 12 + PENTA[d % 5] + 12 * ((d / 5) | 0);
          if (T.id === "lofi") {
            if (s === 0) { ep(p, ch, t, beat * 4); note(p, ch[0] - 24, t, beat * 1.8, "sine", 0.16, 0.02); }
            if (s === 10) note(p, ch[0] - 24, t, beat * 1.2, "sine", 0.12, 0.02);
            if (p.drums) {
              if (s === 0 || s === 10 || (s === 7 && Math.random() < 0.3)) kick(p, t);
              if (s === 4 || s === 12) hit(p, t, 0.16, 0.07, "bandpass", 1800);
              if (s % 2 === 0 || Math.random() < 0.15) hit(p, t, 0.04, s % 4 === 2 ? 0.03 : 0.018, "highpass", 7000);
            }
            if (bar % 2 === 1 && s % 4 === 0 && Math.random() > 0.28) note(p, mel(p.cur[s / 4]), t, beat * 1.3, "sine", 0.035, 0.01, true);
          } else if (T.id === "rain") {
            if (s === 0 && bar % 2 === 0) pad(p, ch, t, beat * 8 + 1, "sawtooth", 0.022, 280, 1300);
            if (s % 8 === 0 && Math.random() < 0.45) { const m = mel(p.cur[(bar * 2 + s / 8) % 4]) - 12; note(p, m, t, 3.5, "triangle", 0.045, 0.005, true); note(p, m, t, 2.5, "sine", 0.03, 0.005); }
          } else {
            if (s === 0) pad(p, ch.map((m) => m + 12), t, beat * 4 + 0.6, "sine", 0.014, 2500, 5000);
            if (s % 2 === 0 && Math.random() > 0.18) { const m = mel(p.cur[(s / 2) % 4] + (s >= 8 ? 1 : 0)); note(p, m, t, 0.55, "sine", 0.05, 0.004, true); note(p, m + 28, t, 0.08, "sine", 0.008, 0.002); }
            if (p.drums) hit(p, t, 0.05, s % 2 ? 0.022 : 0.01, "highpass", 6000);
          }
        }
        function sched() {
          const now = ctx.currentTime;
          players.forEach((p) => {
            if (p.next < now - 0.05) p.next = now + 0.02; /* tab was throttled: skip, don't burst */
            while (p.next < now + 0.1) { const sx = 60 / p.t.bpm / 4; step(p, p.next + (p.step % 2 ? p.t.swing * sx : 0)); p.step++; p.next += sx; }
          });
          const live = players.find((p) => !p.dead);
          if (mode < 0 && live && now - live.born > 180) switchTo((live.i + 1 + rnd(2)) % 3);
        }
        function label(i) { const n = document.getElementById("nowplaying"); if (n) n.textContent = "正在播放:" + (i == null ? "—" : TRACKS[i].name); }
        function kill(p) { p.nodes.forEach((n) => { try { n.stop(); } catch (e) {} }); p.out.disconnect(); p.wet.disconnect(); players = players.filter((x) => x !== p); }
        function switchTo(i) {
          const now = ctx.currentTime;
          players.filter((p) => !p.dead).forEach((p) => {
            p.dead = true; p.out.gain.cancelScheduledValues(now); p.out.gain.setValueAtTime(p.out.gain.value, now);
            p.out.gain.linearRampToValueAtTime(0.0001, now + 2); setTimeout(() => kill(p), 2300);
          });
          const T = TRACKS[i], p = { t: T, i, step: 0, next: now + 0.1, born: now, key: T.key, prog: 0, drums: true, motif: newMotif(), out: ctx.createGain(), wet: ctx.createGain(), nodes: [] };
          p.cur = p.motif; p.out.gain.setValueAtTime(0.0001, now); p.out.gain.linearRampToValueAtTime(1, now + 2);
          p.out.connect(bus); p.wet.gain.value = T.wet; p.wet.connect(echo);
          echo.delayTime.setTargetAtTime((60 / T.bpm) * 0.75, now, 0.5);
          if (T.id === "rain") rain(p);
          players.push(p); label(i);
        }
        function fadeTo(v) { const n = ctx.currentTime; musicGain.gain.cancelScheduledValues(n); musicGain.gain.setValueAtTime(musicGain.gain.value, n); musicGain.gain.linearRampToValueAtTime(v, n + 2); }
        function startMusic() {
          graph(); if (ctx.state === "suspended") ctx.resume();
          clearTimeout(offT); if (!timer) timer = setInterval(sched, 25);
          if (!players.some((p) => !p.dead)) switchTo(mode < 0 ? rnd(3) : mode);
          fadeTo(vol);
        }
        function stopMusic() {
          if (!bus) return; fadeTo(0.0001);
          offT = setTimeout(() => { clearInterval(timer); timer = null; players.slice().forEach(kill); label(null); }, 2100);
        }
        function setTrack(v) {
          mode = v; if (!musicOn || !bus) return;
          const live = players.find((p) => !p.dead);
          if (mode >= 0 && (!live || live.i !== mode)) switchTo(mode); else if (live) live.born = ctx.currentTime;
        }
        function duckMusic() {
          if (!musicOn || !duck) return; const t = ctx.currentTime, g = duck.gain;
          g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0.45, t + 0.05);
          g.setValueAtTime(0.45, t + 0.35); g.linearRampToValueAtTime(1, t + 1);
        }
        return {
          unlock, play,
          setSfx(v) { sfxOn = v; }, isSfx: () => sfxOn,
          setMusic(v) { musicOn = v; v ? startMusic() : stopMusic(); }, isMusic: () => musicOn,
          setVol(v) { vol = v; if (ctx && timer && musicOn) { const n = ctx.currentTime; musicGain.gain.cancelScheduledValues(n); musicGain.gain.setValueAtTime(musicGain.gain.value, n); musicGain.gain.linearRampToValueAtTime(vol, n + 0.3); } },
          setTrack,
        };
      })();
      /* ---------- state ---------- */
      const State = { xp: 0, stars: 0, perLevel: {}, badges: {}, unlocked: 1 };
      const BADGES = [
        { id: "apprentice", name: "密码学徒", hint: "完成第 1 关「凯撒密码轮」" },
        { id: "freq", name: "频率侦探", hint: "完成第 2 关「字母侦探」" },
        { id: "clock", name: "时钟大师", hint: "完成第 3 关「钟表算术」" },
        { id: "prime", name: "质数猎人", hint: "完成第 4 关「质数工厂」" },
        { id: "lock", name: "锁匠", hint: "完成第 5 关「公开的锁·私人的钥匙」" },
        { id: "chief", name: "首席破译官", hint: "完成第 6 关「BOSS 截获情报」" },
      ];
      const LEVELS_META = [
        { id: 1, title: "凯撒密码轮", sub: "模运算" },
        { id: 2, title: "字母侦探", sub: "频率与统计" },
        { id: 3, title: "钟表算术", sub: "同余与逆元" },
        { id: 4, title: "质数工厂", sub: "质数与分解" },
        { id: 5, title: "公开的锁·私人的钥匙", sub: "RSA" },
        { id: 6, title: "BOSS 截获情报", sub: "BOSS 关" },
      ];

      const $ = (s) => document.querySelector(s);
      function toast(msg) {
        const el = document.createElement("div"); el.className = "x-toast"; el.textContent = msg;
        $("#toasts").appendChild(el); setTimeout(() => el.remove(), 3200);
      }
      function award(id) {
        if (State.badges[id]) return;
        State.badges[id] = true;
        const b = BADGES.find((x) => x.id === id);
        Audio_.play("star"); toast("🏅 获得徽章:" + b.name); renderBadges();
      }
      function renderBadges() {
        $("#badges").innerHTML = BADGES.map((b) =>
          `<span class="x-badge ${State.badges[b.id] ? "got" : ""}">${State.badges[b.id] ? "🏅" : "🔒"} ${b.name}<small style="opacity:.75"> · ${b.hint}</small></span>`
        ).join("");
      }
      function renderBar() { $("#xp").textContent = State.xp; $("#stars").textContent = State.stars; }
      function starStr(n) { return n ? "⭐".repeat(n) + "☆".repeat(3 - n) : "☆☆☆"; }
      function renderMap() {
        $("#nodes").innerHTML = LEVELS_META.map((m) => {
          const open = m.id <= State.unlocked && !!getLevel(m.id);
          const got = State.perLevel[m.id] || 0;
          const note = getLevel(m.id) ? (open ? m.sub : "完成上一关解锁") : "即将开放";
          return `<button class="x-node ${open ? "is-open" : ""}" data-level="${m.id}" ${open ? "" : "disabled"}>
            <span class="x-node__num">${m.id}</span>
            <span><span class="x-node__t">${m.title}</span><span class="x-node__s">${m.sub} · ${note === m.sub ? "可以开始" : note}</span></span>
            <span class="x-stars">${starStr(got)}</span></button>`;
        }).join("");
        $("#nodes").querySelectorAll("button[data-level]").forEach((b) =>
          b.addEventListener("click", () => { Audio_.play("click"); openLevel(+b.dataset.level); }));
      }

          dIn.addEventListener("input", () => {
            const d = +dIn.value, r = (5 * d) % 72; q("#k6-dl").textContent = `(5 × ${d}) mod 72 = ${5 * d} mod 72 = ${r}`;
            if (r !== 1) return Audio_.play("tick", 300 + d * 12);
            dIn.disabled = true; q("#k6-dl").classList.add("x-glow"); q("#k6-s4").hidden = false; Audio_.play("chord"); say("d = 29,私钥到手!", "按「解密」:每个数字自乘 29 次,每次 mod 91。");
          });
          q("#k6-dec").addEventListener("click", (e) => {
            e.currentTarget.disabled = true; const cells = [...c.querySelectorAll(".x-k6-nums span")]; let j = 0, k = 1, v = NUMS[0];
            const id = setInterval(() => {
              if (!c.isConnected) return clearInterval(id);
              const n = NUMS[j], cell = cells[j]; v = (v * n) % 91; k++; Audio_.play("tick", 300 + v * 8);
              cell.querySelector("small").textContent = `^${k} → ${v}`;
              if (k < 29) return;
              cell.querySelector("small").textContent = `${n}^29 mod 91 = ${v}`; cell.querySelector("em").textContent = AZ[v - 1]; cell.classList.add("is-ok");
              if (++j < 4) { k = 1; v = NUMS[j]; return; }
              clearInterval(id); Audio_.play("star"); beat[1] = true; say("S T A R——情报是「STAR」!", "最后一波:30 秒速答。"); box.append(nextBtn(2)); refresh();
            }, reduced() ? 10 : 35);
          });
        }

        function w3() {
          let qi = 0, t = 30;
          const c = el("div", "x-card", `<h3>第 3 波 · 速答</h3><div class="x-row"><span class="x-k" id="k6-t">30 秒</span><span class="pill" id="k6-qn"></span></div>
            <div class="x-k6-time" aria-hidden="true"><i></i></div><p class="x-k3-q" id="k6-q"></p><div class="x-opts" id="k6-o"></div>`);
          box.append(c);
          const q = (s) => c.querySelector(s);
          const show = () => {
            const [text, opts] = QS[qi]; q("#k6-q").textContent = text; q("#k6-qn").textContent = `${qi + 1} / 3`; q("#k6-o").innerHTML = "";
            [...opts].sort(() => Math.random() - 0.5).forEach((o) => {
              const b = el("button", "x-opt x-qopt"); b.textContent = o;
              b.addEventListener("click", () => {
                if (o !== opts[0]) { b.classList.add("bad"); return drain(b, "再想想,时间还在走!"); }
                b.classList.add("good"); Audio_.play("correct");
                if (++qi < 3) return setTimeout(() => c.isConnected && show(), 350);
                clearInterval(timer); q("#k6-o").querySelectorAll("button").forEach((x) => (x.disabled = true)); beat[2] = true; refresh();
              });
              q("#k6-o").append(b);
            });
          };
          timer = setInterval(() => {
            if (!c.isConnected) return clearInterval(timer);
            t--; q("#k6-t").textContent = `${t} 秒`; q(".x-k6-time i").style.transform = `scaleX(${t / 30})`;
            if (t <= 0) { clearInterval(timer); drain(c, "时间到!耗掉一颗电池,这一波重来。", true); }
          }, 1000);
          show();
        }

        /* tasks + finish */
        const tasks = el("ul", "checklist");
        const finRow = el("div", "x-row", `<button class="x-btn x-btn--go" disabled>结算本关</button><span style="font:var(--type-caption);color:var(--text-secondary)">破解前两波后可以结算</span>`);
        const finBtn = finRow.querySelector("button");
        root.append(tasks, finRow);
        const T = [["a", "破解第 1、2 波", "1★"], ["b", "三波全部完成", "2★"], ["c", "三波全部完成,且剩下至少 2 颗电池", "3★"]];
        const starsNow = () => (!beat[0] || !beat[1] ? 0 : !beat[2] ? 1 : !emptied && lives >= 2 ? 3 : 2);
        function refresh() {
          const n = starsNow();
          tasks.innerHTML = taskList(T, { a: n >= 1, b: n >= 2, c: n >= 3 });
          finBtn.disabled = !n;
          if (beat[2] && !endEl) finish();
        }
        function finish() {
          const s = starsNow(); if (!s) return;
          if (endEl) endEl.remove();
          endEl = endCard(s, "BOSS 截获情报", [
            ["你刚刚串起了", "模运算 → 统计 → 同余与逆元 → 质数 → 欧拉定理 → RSA。"],
            ["就在身边", "手机支付、微信加密每天都在用这套数学。"],
          ], "t07 同余 · t08 费马小定理与欧拉定理 · d17 密码学");
          root.append(endEl);
          if (s > best) { done(s, 40 + 20 * (s - best)); best = s; }
          award("chief");
          say(s < 3 ? "干得好,首席破译官!还想拿更多星?把没完成的任务做完,再结算一次。" : "满分!你就是首席破译官。");
          missionComplete();
        }
        finBtn.addEventListener("click", () => { Audio_.play("click"); finish(); });
        renderBat(); wave(0); refresh();
      } });
      /* ---------- mission complete ---------- */
      const LIT14 = ["n05 除法与余数", "n19 模运算", "p01 分类与计数统计", "p02 统计图表", "p04 可能性", "t01 奇数与偶数", "t02 倍数与因数", "t03 质数", "t04 质因数分解", "t05 最大公约数与最小公倍数", "t06 辗转相除法", "t07 同余", "t08 费马小定理与欧拉定理", "d17 密码学"];
      function missionComplete() {
        document.querySelector(".x-k6-mc")?.remove();
        const got = BADGES.filter((b) => State.badges[b.id]);
        const back = document.activeElement;
        const ov = el("div", "x-k6-mc", `<div class="x-k6-fw" aria-hidden="true"></div>
          <div class="x-end x-k6-mcard" role="dialog" aria-modal="true" aria-labelledby="k6-mct">
            <p class="x-k6-eye">MISSION COMPLETE</p><h3 id="k6-mct">任务完成,特工!</h3>
            <section class="stats"><div class="stat"><span class="stat__fig">${State.stars}/18</span><span class="stat__label">总星数</span></div>
              <div class="stat"><span class="stat__fig">${State.xp}</span><span class="stat__label">XP</span></div>
              <div class="stat"><span class="stat__fig">${got.length}</span><span class="stat__label">徽章</span></div></section>
            <div class="x-shelf">${got.map((b) => `<span class="x-badge got">🏅 ${b.name}</span>`).join("")}</div>
            <p style="font:var(--type-body-strong)">你点亮了 14 颗星</p>
            <ul class="x-k6-ids">${LIT14.map((s) => `<li>${s}</li>`).join("")}</ul>
            <p style="font:var(--type-body)">这些在传统课本里分散在小学到大学。今天,一个秘密把它们串在了一起。</p>
            <div class="x-row"><button class="x-btn x-btn--go">回到星图</button></div></div>`);
        document.body.append(ov);
        const close = () => { ov.remove(); $("#map").scrollIntoView({ behavior: reduced() ? "auto" : "smooth" }); if (back && back.focus) back.focus(); };
        ov.querySelector(".x-btn--go").addEventListener("click", close);
        ov.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
        ov.querySelector(".x-btn--go").focus();
        if (reduced()) return;
        const fw = ov.querySelector(".x-k6-fw");
        for (let b = 0; b < 7; b++) setTimeout(() => {
          if (!ov.isConnected) return;
          const x = 10 + Math.random() * 80, y = 10 + Math.random() * 50; Audio_.play("pop");
          for (let i = 0; i < 16; i++) {
            const s = el("i", "x-k5-sp", "✦"), a = (i / 16) * 2 * Math.PI;
            s.style.left = x + "%"; s.style.top = y + "%";
            s.style.setProperty("--dx", Math.cos(a) * 110 + "px"); s.style.setProperty("--dy", Math.sin(a) * 110 + "px");
            fw.append(s); setTimeout(() => s.remove(), 950);
          }
        }, b * 380);
      }
      /* ---------- boot ---------- */
      renderBar(); renderBadges(); renderMap();
      const once = () => { Audio_.unlock(); window.removeEventListener("pointerdown", once); window.removeEventListener("keydown", once); };
      window.addEventListener("pointerdown", once); window.addEventListener("keydown", once);
      $("#sfx").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.setSfx(on); if (on) Audio_.play("click");
      });
      $("#music").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.unlock(); Audio_.setMusic(on); Audio_.play("click");
      });
      $("#vol").addEventListener("input", (e) => Audio_.setVol(+e.target.value / 100));
      $("#track").addEventListener("change", (e) => Audio_.setTrack(+e.target.value));
    </script>
  </body>
</html>
