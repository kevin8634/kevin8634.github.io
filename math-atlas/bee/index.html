    <script type="text/plain" id="bee-notes">任务3 为什么蜜蜂选六边形
### 必须掌握
1. 正 n 边形每个内角 = (n−2)×180°/n:三角形 60°,正方形 90°,正六边形 120°。
2. 一个顶点周围的角必须拼成 360°,所以能单独铺满平面的正多边形只有 3 种:正三角形、正方形、正六边形。
3. 面积相同时,边越多越接近圆,周长越短;圆最省但不能密铺。
4. 蜂巢猜想:把平面分成等面积的格子,正六边形网格的总周长最短(1999 年被证明)。
5. Voronoi 图:每个点归离它最近的"种子";反复把种子移到自己区域的中心(Lloyd 松弛),格子会自己趋向六边形。
6. 大自然常常在做"最优化":用最少的材料完成任务。
### 公式
- 内角:(n−2)×180°/n;多边形内角和 (n−2)×180°
- 密铺条件:360° ÷ 内角 必须是整数
- 等面积 A 时周长:正三角形 ≈ 4.559√A,正方形 = 4√A,正六边形 ≈ 3.722√A,圆 ≈ 3.545√A
- 等周不等式:L² ≥ 4πA(圆取等号)
- 正六边形面积:A = (3√3/2)·a²
- 质心:x̄ = 区域内所有点 x 坐标的平均
### 经典文献与历史
- 瓦罗(Varro,公元前36年)最早提出蜂巢猜想
- 帕普斯(约公元4世纪)《数学汇编》称赞蜜蜂的"几何远见"
- 开普勒《论六角雪花》(1611)
- 开尔文勋爵(1887)三维泡沫问题;Weaire & Phelan(1993)找到更优结构
- Lloyd (1982) "Least squares quantization in PCM", IEEE Trans. Information Theory
- Thomas C. Hales (2001) "The Honeycomb Conjecture", Discrete & Computational Geometry 25:1–22(1999 年发布)
- Karihaloo et al. (2013) J. R. Soc. Interface:蜂蜡受热流动,圆形巢室变成圆角六边形
### 领域应用与案例
- 北京奥运"水立方"外墙:Weaire–Phelan 泡沫结构
- 石墨烯、碳纳米管:碳原子的六边形晶格
- 飞机和高铁的蜂窝夹层板:又轻又硬
- 手机"蜂窝网络"基站覆盖规划
- Uber H3 六边形地图网格、外卖配送分区(Voronoi)</script>
    <script>
      /* knowledge notes: card builder, copy, modal (independent of game logic) */
      const NOTES_MD = document.getElementById("bee-notes").textContent.trim();
      const NOTES_TXT = NOTES_MD.replace(/^### /gm, "\n");
      function notesCard() {
        const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
        let html = "", list = "";
        const close = () => { if (list) { html += `</${list}>`; list = ""; } };
        NOTES_MD.split("\n").slice(1).forEach((ln) => {
          const m = ln.match(/^(\d+)\. (.*)$/), b = ln.match(/^- (.*)$/);
          if (ln.startsWith("### ")) { close(); html += `<h4>${esc(ln.slice(4))}</h4>`; }
          else if (m || b) { const t = m ? "ol" : "ul"; if (list !== t) { close(); html += `<${t}>`; list = t; } html += `<li>${esc((m ? m[2] : b[1]))}</li>`; }
        });
        close();
        const d = document.createElement("details"); d.className = "x-notes"; d.open = true;
        d.innerHTML = `<summary>📒 知识笔记 · 任务3 为什么蜜蜂选六边形</summary><div class="x-notes__body">${html}</div>
          <div class="x-row"><button class="x-btn x-btn--go" type="button">一键复制笔记</button><a class="x-btn" href="../notes/#bee" target="_top">完整笔记与其他任务 →</a></div>`;
        d.querySelector("button").addEventListener("click", () => copyNotes(d.querySelector(".x-notes__body")));
        return d;
      }
      function copyNotes(body) {
        const done = () => toast("已复制");
        const fallback = () => {
          const ta = document.createElement("textarea"); ta.value = NOTES_TXT; ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;left:-9999px;opacity:0"; document.body.append(ta); ta.select();
          let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove();
          if (ok) return done();
          const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
          toast("请按 Ctrl/⌘+C 复制已选中的笔记");
        };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(NOTES_TXT).then(done, fallback); else fallback();
      }
      document.addEventListener("DOMContentLoaded", () => {
        const dlg = document.getElementById("notes-dlg");
        dlg.append(notesCard());
        document.getElementById("notes-btn").addEventListener("click", () => (dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", "")));
        document.getElementById("notes-close").addEventListener("click", () => (dlg.close ? dlg.close() : dlg.removeAttribute("open")));
        dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
      });
    </script>

              <div class="stat"><span class="stat__fig">${n.h.toFixed(1)}</span><span class="stat__label">存蜜量(总面积)${n.G.length ? ` · 漏掉 ${(n.G.length * GAP).toFixed(1)}` : ""}</span></div>
              <div class="stat"><span class="stat__fig">${n.eff.toFixed(2)}</span><span class="stat__label">效率 = 蜜/蜡</span></div>
              <div class="stat"><span class="stat__fig">${goal[0]}</span><span class="stat__label">${goal[1]}</span></div>`;
          }
          new MutationObserver((m, o) => (cv.isConnected ? draw() : (o.disconnect(), Audio_.swarm(false)))).observe(document.documentElement, { attributes: true });

          function act(x, y, mode) {
            const i = L.findIndex((c) => inCell(c, x, y)); if (i < 0 || i === last) return; last = i;
            if (mode === "rm") { if (on.delete(i)) { Audio_.play("tick", 420); draw(); } return; }
            if (on.has(i)) return;
            if (wave === 1 && !inBlob(L[i].o[0], L[i].o[1])) { Audio_.play("bonk"); return say("风暴区外面不能建。", "只在虚线圈里放格子。"); }
            const nx = new Set(on).add(i);
            if (wax(nx) > BUDGET + 1e-9) { Audio_.play("bonk"); return toast("🕯️ 蜡不够了"); }
            const sh = shared(L[i], on); on = nx;
            if (sh >= 3) Audio_.play("chord"); else Audio_.play("pop", 300 + sh * 120);
            draw();
          }
          const at = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * CW, ((e.clientY - r.top) / r.height) * CH]; };
          cv.addEventListener("pointerdown", (e) => {
            if (busy || finished) return; const [x, y] = at(e), i = L.findIndex((c) => inCell(c, x, y));
            drag = i >= 0 && on.has(i) ? "rm" : "add"; last = -1; cv.setPointerCapture(e.pointerId); act(x, y, drag);
          });
          cv.addEventListener("pointermove", (e) => { if (drag) act(...at(e), drag); });
          ["pointerup", "pointercancel"].forEach((t) => cv.addEventListener(t, () => (drag = null)));

          function startWave(w) {
            wave = w; on = new Set(); busy = false;
            if (w === 2) doc = docBuild();
            head.textContent = ["第 1 波 · 自由建造", "第 2 波 · 风暴来了", "第 3 波 · 挑战蜂博士"][w];
            [() => say(`自由建造:效率达到 ${TARGET} 就拿星。`, "哪种格子墙最短，又能和最多邻居共用墙?"),
             () => say("风暴来了!只能在虚线圈里建，压到边界的格子要多花一半蜡。", "把风暴区填满 80% 就拿星。"),
             () => say(`蜂博士用正方形、同样 100 蜡币，存了 ${doc} 蜜。比他多就赢!`, "他的格子挤得很紧，你得更聪明。")][w]();
            Audio_.swarm(true); renderTasks(); draw();
          }
          function next() { if (wave < 2) startWave(wave + 1); else finish(); }
          clearB.addEventListener("click", () => { if (busy || finished) return; on = new Set(); Audio_.play("click"); draw(); });
          skipB.addEventListener("click", () => { if (busy || finished) return; Audio_.play("click"); next(); });
          goB.addEventListener("click", () => {
            if (busy || finished) return; const n = nums();
            const ok = [n.eff >= TARGET, n.f >= 0.8, n.h > doc][wave];
            if (ok) {
              got[wave] = true; busy = true; Audio_.swarm(false); Audio_.play("fanfare"); toast(`⭐ 第 ${wave + 1} 波通过!`); renderTasks();
              say(["效率达标!挤紧的六边形，墙最短、共墙最多。", `风暴区填满 ${Math.round(n.f * 100)}%!`, `你存了 ${n.h.toFixed(1)} 蜜，赢了蜂博士的 ${doc}!`][wave], wave < 2 ? "下一波马上来……" : "");
              return setTimeout(next, 1800);
            }
            Audio_.play("wrong");
            if (wave === 1) return say(`现在填满 ${Math.round(n.f * 100)}%，还差一点。`, "边上的格子贵，先铺满中间，再补边。");
            say(shape !== 6 ? "还不够。试试六边形:同样大的格子，它的墙最短，还能和 6 个邻居共墙。" : "还不够。把六边形挤成一整团，别留缺口，也别拉成长条。",
              wave ? `你 ${n.h.toFixed(1)} 蜜，蜂博士 ${doc} 蜜。` : `现在效率 ${n.eff.toFixed(2)}，目标 ${TARGET}。`);
          });
          function finish() {
            finished = true; Audio_.swarm(false); [clearB, goB, skipB].forEach((b) => (b.disabled = true));
            const stars = got.filter(Boolean).length;
            done(stars, 60 + stars * 25); award("builder");
            say("在限制下找最好:这就是蜜蜂几千万年来一直在做的事。", stars ? "星图全部点亮，看看你的任务成绩!" : "拿到 1 颗星就能完成整个任务，再来一次吧。");
            root.append(endCard(stars, "蜂巢建造者", [
              ["最优化", "在限制下找最好:蜡币有限，就要让每一枚蜡装下最多的蜜。"],
              ["为什么是六边形", "六边形 = 能铺满 + 墙最短。三角形、正方形也能铺满但墙更长;圆的墙最短，却铺不满，会漏蜜。"],
            ], "m05 线性规划 · m06 最优化与极值 · g05 周长与面积"));
            if (stars) setTimeout(() => missionComplete(root), 1800);
          }
          startWave(0);
        },
      });

      /* ---------- mission complete ---------- */
      function missionComplete(root) {
        const R = 15, w = Math.sqrt(3) * R; let burst = "";
        for (let q = -3; q <= 3; q++) for (let r = -3; r <= 3; r++) {
          const d = Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)); if (d > 3) continue;
          burst += `<polygon class="x-tile" style="animation-delay:${d * 140}ms;fill:${d % 2 ? "var(--fill-tertiary)" : "var(--chart-5)"};stroke:var(--text-primary)" stroke-width="1" points="${pts(ngon(w * (q + r / 2), 1.5 * R * r, R - 1, 6, 30))}"/>`;
        }
        const nb = BADGES.filter((b) => State.badges[b.id]);
        const card = el("div", "x-end", `<h3>🎉 任务完成 · 为什么蜜蜂选六边形</h3>
          <svg viewBox="-110 -95 220 190" style="width:min(100%,260px);justify-self:center" role="img" aria-label="蜂巢从中心一圈圈绽开">${burst}</svg>
          <section class="stats"><div class="stat"><span class="stat__fig">${State.stars}/15</span><span class="stat__label">总星数 ⭐</span></div>
            <div class="stat"><span class="stat__fig">${State.xp}</span><span class="stat__label">总 XP</span></div>
            <div class="stat"><span class="stat__fig">${nb.length}/${BADGES.length}</span><span class="stat__label">徽章</span></div></section>
          <div class="x-shelf">${nb.map((b) => `<span class="x-badge got">🏅 ${b.name}</span>`).join("")}</div>
          <div><p style="font:var(--type-body-strong)">点亮的星星</p><p class="x-starid">g01 · g04 · g06 · g09 · n04 · g05 · g16 · c07 · m06 · m05</p></div>
          <p style="font:var(--type-body-strong)">从一块地砖到一整座蜂巢,你自己发现了蜂巢定理——数学家 Thomas Hales 在1999年才证明它。</p>`);
        const again = el("button", "x-btn x-btn--go", "再玩一次"); again.type = "button"; card.append(notesCard(), el("div", "x-row")); card.lastChild.append(again);
        root.append(card); Audio_.play("fanfare"); setTimeout(() => Audio_.play("star"), 600);
        card.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
        again.addEventListener("click", () => {
          Object.assign(State, { xp: 0, stars: 0, perLevel: {}, badges: {}, unlocked: 1 });
          renderBar(); renderBadges(); renderMap(); Audio_.play("click");
          $("#play-title").textContent = "选一关开始"; $("#play-sub").textContent = "蜂博士在星图上等你。";
          $("#stage").innerHTML = ""; guide($("#stage"), "新的一轮开始了!点开第 1 关「哪些形状能铺满地面」。", "蜂博士只问问题，不直接给答案。");
          $("#map").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
        });
      }

      /* ---------- boot ---------- */
      renderBar(); renderBadges(); renderMap();
      const once = () => { Audio_.unlock(); window.removeEventListener("pointerdown", once); window.removeEventListener("keydown", once); };
      window.addEventListener("pointerdown", once); window.addEventListener("keydown", once);
      $("#sfx").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.setSfx(on); if (on) Audio_.play("click");
      });
      $("#music").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.unlock(); Audio_.setMusic(on); Audio_.play("click");
      });
      $("#vol").addEventListener("input", (e) => Audio_.setVol(+e.target.value / 100));
      $("#track").addEventListener("change", (e) => Audio_.setTrack(+e.target.value));
    </script>
  </body>
</html>
