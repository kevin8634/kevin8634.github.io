<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星图任务 · 让AI认出一只猫</title>
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <link rel="stylesheet" href="hark-charts.css" />
    <style>
      /* x- classes: the game shell. Tokens only. */
      .x-bar {
        position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 30;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        padding: 8px 12px; border-radius: var(--r-pill);
        background: var(--mat-agent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-primary); box-shadow: var(--hark-shadow);
      }
      .x-brand { font: var(--type-label); margin-right: auto; white-space: nowrap; }
      .x-meter { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--fill-tertiary); font: var(--type-tag); color: var(--text-primary); }
      .x-meter b { font-weight: var(--weight-bold); }
      .x-toggle {
        display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap);
        padding: 4px 12px; border: 1px solid var(--stroke-primary); border-radius: var(--r-pill);
        background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-tag); cursor: pointer;
      }
      .x-toggle[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
      .x-vol { width: 86px; accent-color: var(--fill-primary); }
      .x-map { position: relative; padding: 8px 0 4px; }
      .x-path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .x-nodes { position: relative; display: grid; gap: 10px; }
      .x-node {
        display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 12px;
        width: min(100%, 560px); padding: 10px 14px; border-radius: var(--r-l);
        border: 1px solid var(--stroke-primary); background: var(--fill-primary-on);
        color: var(--text-primary); font: var(--type-body); text-align: left; cursor: pointer;
        transition: box-shadow var(--dur-quick) var(--ease-out), transform var(--dur-quick) var(--ease-out);
      }
      .x-node:nth-child(even) { justify-self: end; }
      .x-node:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--hark-shadow); }
      .x-node:disabled { opacity: 0.55; cursor: not-allowed; }
      .x-node__num {
        width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%;
        background: var(--fill-tertiary); font: var(--type-heading);
      }
      .x-node.is-open .x-node__num { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-node__t { display: block; font: var(--type-body-strong); }
      .x-node__s { display: block; font: var(--type-caption); color: var(--text-secondary); }
      .x-stars { font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
      .x-panel { padding: 16px; border-radius: var(--r-l); background: var(--fill-tertiary); display: grid; gap: 14px; }
      .x-cat { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
      .x-cat__face { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--fill-primary-on); font-size: 24px; border: 1px solid var(--stroke-primary); }
      .x-bubble { position: relative; padding: 10px 14px; border-radius: var(--r-m); background: var(--fill-primary-on); border: 1px solid var(--stroke-primary); font: var(--type-body); }
      .x-bubble small { display: block; margin-top: 4px; font: var(--type-caption); color: var(--text-secondary); }
      .x-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: min(100%, 288px); touch-action: none; }
      .x-px { aspect-ratio: 1; border-radius: 3px; display: grid; place-items: center; font: var(--weight-regular) 11px/1 "Geist Mono", monospace; background: var(--fill-primary-on); color: var(--text-secondary); border: 1px solid var(--stroke-secondary); }
      .x-px.on { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-px.num { font-size: clamp(9px, 2.4vw, 11px); }
      .x-pad .x-px { cursor: pointer; }
      .x-vec { font: var(--weight-regular) 12px/1.5 "Geist Mono", monospace; color: var(--text-secondary); word-break: break-all; background: var(--fill-primary-on); border: 1px solid var(--stroke-secondary); border-radius: var(--r-s); padding: 10px; max-height: 120px; overflow: auto; }
      .x-opts { display: flex; flex-wrap: wrap; gap: 10px; }
      .x-opt { padding: 8px; border-radius: var(--r-m); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); cursor: pointer; display: grid; gap: 6px; justify-items: center; font: var(--type-tag); color: var(--text-primary); }
      .x-opt canvas { display: block; width: 72px; height: 72px; image-rendering: pixelated; border-radius: var(--r-s); }
      .x-opt.good { border-color: var(--fill-system-green); box-shadow: inset 0 0 0 1px var(--fill-system-green); }
      .x-opt.bad { border-color: var(--fill-system-red); opacity: 0.6; }
      .x-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .x-btn {
        display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 6px 16px;
        border-radius: var(--r-s); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on);
        color: var(--text-primary); font: var(--type-label); cursor: pointer;
      }
      .x-btn--go { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
      .x-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .x-toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
      .x-toast {
        padding: 10px 16px; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on);
        font: var(--type-tag); box-shadow: var(--hark-shadow); animation: x-pop 320ms var(--ease-out);
      }
      @keyframes x-pop { from { opacity: 0; transform: translateY(10px); } }
      .x-shelf { display: flex; flex-wrap: wrap; gap: 8px; }
      .x-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); background: var(--fill-tertiary); font: var(--type-tag); color: var(--text-secondary); }
      .x-badge.got { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-end { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-l); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); }
      .x-end h3 { font: var(--type-heading); }
      .x-end dl { display: grid; gap: 8px; margin: 0; }
      .x-end dt { font: var(--type-body-strong); }
      .x-end dd { margin: 0; font: var(--type-small); color: var(--text-secondary); }
      .x-starid { font: var(--weight-regular) 12px/1.3 "Geist Mono", monospace; }
      .x-flash { animation: x-shake 320ms var(--ease-out); }
      @keyframes x-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      /* levels 2–3: coordinate plane, cards, handles */
      .x-split { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }
      .x-axes { font: var(--type-caption); color: var(--text-secondary); margin-bottom: 6px; }
      .x-plane { position: relative; width: min(100%, 420px); aspect-ratio: 1; border-radius: var(--r-m); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); user-select: none; -webkit-user-select: none; }
      .x-plane svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .x-tick { position: absolute; transform: translate(-50%, -50%); font: var(--weight-regular) 12px/1 "Geist Mono", monospace; color: var(--text-secondary); pointer-events: none; }
      .x-dot { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; display: grid; place-items: center; border-radius: 50%; font-size: 16px; line-height: 1; pointer-events: none; transition: left var(--dur-quick) var(--ease-out), top var(--dur-quick) var(--ease-out); }
      .x-dot.mis { box-shadow: 0 0 0 2px var(--fill-system-red); animation: x-pulse 1.1s var(--ease-out) infinite; }
      @keyframes x-pulse { 50% { box-shadow: 0 0 0 2px var(--fill-system-red), 0 0 0 7px transparent; transform: scale(1.15); } }
      .x-zone { position: absolute; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: var(--r-pill); background: var(--fill-primary-on); font: var(--type-tag); color: var(--text-primary); pointer-events: none; white-space: nowrap; }
      .x-handle { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 3px solid var(--fill-primary-on); background: var(--fill-primary); box-shadow: var(--hark-shadow); cursor: grab; touch-action: none; }
      .x-handle::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
      .x-deck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .x-card {
        position: relative; display: flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 8px 10px;
        border-radius: var(--r-m); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on);
        color: var(--text-primary); font: var(--type-tag); text-align: left; cursor: grab; touch-action: none;
      }
      .x-card > span:first-child { font-size: 22px; line-height: 1; }
      .x-card b { display: block; font: var(--type-label); }
      .x-card small { display: block; font: var(--type-caption); color: var(--text-secondary); }
      .x-card.is-sel { box-shadow: inset 0 0 0 2px var(--fill-primary); }
      .x-card.is-drag { z-index: 40; box-shadow: var(--hark-shadow); cursor: grabbing; }
      .x-card.is-done { border-color: var(--fill-system-green); cursor: default; }
      .x-card.is-done small { color: var(--text-primary); font-family: "Geist Mono", monospace; }
      .x-eq { font: var(--weight-regular) 13px/1.5 "Geist Mono", monospace; padding: 8px 12px; border-radius: var(--r-s); background: var(--fill-primary-on); border: 1px solid var(--stroke-secondary); }
      /* levels 4–5: fog canvas, sliders, training */
      #stage [hidden] { display: none; }
      .x-fog { position: relative; width: 100%; max-width: 680px; aspect-ratio: 16 / 9; border-radius: var(--r-m); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); overflow: hidden; }
      .x-fog canvas { display: block; width: 100%; height: 100%; }
      .x-lbl { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); font: var(--type-tag); color: var(--text-primary); }
      .x-lbl output { min-width: 2.5em; font: var(--type-label); }
      .x-range { width: 130px; accent-color: var(--fill-primary); }
      .x-plane.is-pick { cursor: crosshair; box-shadow: inset 0 0 0 2px var(--fill-primary); }
      .x-dot.hit { animation: x-hit 520ms var(--ease-out); }
      @keyframes x-hit { 35% { transform: scale(1.6); box-shadow: 0 0 0 4px var(--fill-system-orange); } }
      @media (prefers-reduced-motion: reduce) { .x-dot.hit { animation: none; box-shadow: 0 0 0 3px var(--fill-system-orange); } }
      @media (prefers-reduced-motion: reduce) { .x-dot.mis { animation: none; } .x-dot { transition: none; } }
      @media (prefers-reduced-motion: reduce) { .x-toast, .x-flash { animation: none; } }
      /* levels 6–7 and the finale: square canvas, matrix, network, confidence bar, fireworks */
      #stage { position: relative; }
      .x-cv { position: relative; width: min(100%, 440px); aspect-ratio: 1; border-radius: var(--r-m); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); overflow: hidden; }
      .x-cv canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      .x-cv canvas:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: -2px; }
      .x-mat { display: grid; grid-template-columns: repeat(2, auto); gap: 0 12px; justify-content: start; padding: 2px 12px; border-left: 2px solid var(--text-primary); border-right: 2px solid var(--text-primary); border-radius: var(--r-s); }
      .x-mat .x-range { width: 84px; }
      .x-net { width: 100%; max-width: 360px; height: auto; display: block; }
      .x-net text { font: var(--type-caption); fill: var(--text-primary); text-anchor: middle; dominant-baseline: central; }
      .x-net circle { transition: fill-opacity var(--dur-quick) var(--ease-out); }
      .x-boss { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-l); border: 1px dashed var(--stroke-primary); background: var(--fill-primary-on); }
      .x-boss h3 { font: var(--type-heading); }
      .x-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
      .x-thumbs .x-opt canvas { width: 48px; height: 48px; }
      .x-conf { height: 12px; width: min(100%, 320px); border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; }
      .x-conf span { display: block; height: 100%; border-radius: inherit; background: var(--fill-primary); transition: width 600ms var(--ease-out); }
      .x-fw { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: inherit; z-index: 2; }
      .x-recap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; list-style: none; margin: 0; padding: 0; }
      .x-recap li { display: inline-flex; align-items: center; gap: 6px; font: var(--weight-regular) 12px/1.3 "Geist Mono", monospace; }
      .x-recap li + li::before { content: "→"; color: var(--text-secondary); }
      .x-big { font: var(--type-title); }
      @media (prefers-reduced-motion: reduce) { .x-conf span, .x-net circle { transition: none; } }
      .x-notes { border-radius: var(--r-l); border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); padding: 16px; }
      .x-notes summary { font: var(--type-heading); cursor: pointer; min-height: var(--tap); display: flex; align-items: center; }
      .x-notes__body { display: grid; gap: 8px; margin-top: 8px; }
      .x-notes h4 { font: var(--type-label); font-weight: var(--weight-bold); margin-top: 8px; }
      .x-notes ol, .x-notes ul { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; font: var(--type-body); }
      .x-notes .x-row { margin-top: 12px; }
      .x-dlg { width: min(92vw, 720px); max-height: 86vh; padding: 0; border: 0; border-radius: var(--r-l); background: transparent; color: var(--text-primary); }
      .x-dlg::backdrop { background: rgba(0, 0, 0, 0.45); }
      .x-dlg .x-close { position: absolute; top: 12px; right: 12px; }
      @media (max-width: 599px) { .x-brand { width: 100%; } .x-vol { width: 70px; } }
    </style>

    <template id="notes-tpl">
      <details class="x-notes" open>
        <summary>📒 知识笔记</summary>
        <div class="x-notes__body">
          <h4>任务2 让AI认出一只猫</h4>
          <h4>必须掌握</h4>
          <ol>
            <li>图片就是数字:灰度像素 0–255,彩色是 RGB 三层;28×28 的图就是 784 个数的向量。</li>
            <li>每个样本是空间里的一个点,特征就是坐标。</li>
            <li>线性分类器用一条线(高维里是"超平面")把两类分开。</li>
            <li>损失函数衡量"错了多少",学习就是让损失变小。</li>
            <li>梯度下降:沿着最陡的下坡方向走一小步,反复走。学习率太大会来回震荡,太小走得慢。</li>
            <li>一条直线分不开时,可以"升维"或叠加多层神经元。</li>
            <li>神经网络 = 很多"加权求和 + 激活函数"叠在一起;反向传播就是链式法则。</li>
            <li>数据有偏,模型就有偏:AI 只会学到你喂给它的东西。</li>
          </ol>
          <h4>公式</h4>
          <ul>
            <li>分界线:w₁x₁ + w₂x₂ + b = 0;&gt; 0 判为猫,&lt; 0 判为狗</li>
            <li>均方误差:L = (1/n)·Σ(ŷᵢ − yᵢ)²</li>
            <li>梯度下降:θ ← θ − η·∇L(η 为学习率)</li>
            <li>感知机规则:分错时 w ← w + η·y·x</li>
            <li>升维示例:(x₁, x₂) → (x₁, x₂, x₁² + x₂²),圆圈数据变得可用平面分开</li>
            <li>神经元:a = σ(w·x + b);Sigmoid σ(z) = 1/(1+e^(−z));ReLU(z) = max(0, z)</li>
          </ul>
          <h4>经典文献与历史</h4>
          <ul>
            <li>McCulloch &amp; Pitts (1943) "A Logical Calculus of the Ideas Immanent in Nervous Activity"</li>
            <li>Rosenblatt (1958) "The Perceptron"</li>
            <li>Minsky &amp; Papert (1969)《Perceptrons》:单层感知机解不了异或</li>
            <li>Rumelhart, Hinton &amp; Williams (1986) Nature "Learning representations by back-propagating errors"</li>
            <li>Cybenko (1989):通用逼近定理</li>
            <li>Cortes &amp; Vapnik (1995) 支持向量机(核技巧 = 升维思想)</li>
            <li>LeCun et al. (1998) "Gradient-based learning applied to document recognition"(LeNet、MNIST 手写数字)</li>
            <li>Le et al. (2012) Google Brain "Building high-level features using large scale unsupervised learning":从 YouTube 视频中自己学出"猫脸神经元"</li>
            <li>Krizhevsky, Sutskever &amp; Hinton (2012) AlexNet:深度学习赢下 ImageNet</li>
          </ul>
          <h4>领域应用与案例</h4>
          <ul>
            <li>手机人脸解锁、相册按人物/宠物自动分类</li>
            <li>医学影像辅助诊断(肺结节、眼底病变)</li>
            <li>自动驾驶识别行人和红绿灯</li>
            <li>垃圾邮件过滤、拍照识物、拍照搜题</li>
          </ul>
        </div>
        <div class="x-row">
          <button class="x-btn x-btn--go" data-copy-notes>一键复制笔记</button>
          <a class="btn" href="../notes/#cat" target="_top">完整笔记与其他任务 →</a>
        </div>
      </details>

    <script>
      /* ---------- audio ---------- */
      const Audio_ = (() => {
        let ctx = null, master = null, musicGain = null, sfxOn = true, musicOn = false, vol = 0.3, loopTimer = null, started = false;

        }
        const sfx = {
          click() { const t = ctx.currentTime; tone(880, t, 0.05, "triangle", 0.08); },
          correct() { const t = ctx.currentTime; [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t + i * 0.07, 0.22, "sine", 0.14)); },
          wrong() { const t = ctx.currentTime; tone(150, t, 0.22, "sine", 0.16); tone(110, t + 0.06, 0.26, "sine", 0.12); },
          star() { const t = ctx.currentTime; [784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.055, 0.3, "triangle", 0.09)); },
          fanfare() { const t = ctx.currentTime; [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.3]].forEach(([f, d]) => { tone(f, t + d, 0.4, "sawtooth", 0.07); tone(f * 2, t + d, 0.3, "sine", 0.05); }); },
          meow() {
            const t = ctx.currentTime, o = ctx.createOscillator(), f = ctx.createBiquadFilter();

            o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(860, t + 0.12);
            o.frequency.exponentialRampToValueAtTime(400, t + 0.42);
            const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.12, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
            o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.5);
          },
          boing() {
            const t = ctx.currentTime, o = ctx.createOscillator(), l = ctx.createOscillator(), lg = ctx.createGain();
            o.type = "triangle"; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(540, t + 0.09); o.frequency.exponentialRampToValueAtTime(170, t + 0.5);
            l.frequency.value = 14; lg.gain.value = 45; l.connect(lg); lg.connect(o.frequency);
            env(o, t, 0.01, 0.5, 0.16); o.start(t); o.stop(t + 0.6); l.start(t); l.stop(t + 0.6);

          tick(f) { tone(f || 600, ctx.currentTime, 0.06, "sine", 0.07); },
          wah() {

          },
          finale() {
            const t = ctx.currentTime;
            [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36], [784, 0.6], [1047, 0.72]].forEach(([f, d]) => { tone(f, t + d, 0.35, "sawtooth", 0.06); tone(f / 2, t + d, 0.35, "triangle", 0.08); });
            [523, 659, 784, 1047, 1319].forEach((f) => tone(f, t + 0.96, 1.4, "sine", 0.07));

          pop() { const t = ctx.currentTime; tone(200 + Math.random() * 500, t, 0.18, "triangle", 0.05); },
        };
        function play(name, arg) { if (!sfxOn || !started) return; ensure(); if (ctx.state === "suspended") ctx.resume(); duckMusic(); (sfx[name] || sfx.click)(arg); }
        /* ---------- 专注音乐: generative engine, lookahead scheduler (25ms tick, 0.1s ahead) ---------- */
        const PENTA = [0, 2, 4, 7, 9];
        const CH = { I: [0, 4, 7, 11], ii: [2, 5, 9, 12], iii: [4, 7, 11, 14], IV: [5, 9, 12, 16], V: [7, 11, 14, 17], vi: [9, 12, 16, 19] };
        const P = (s) => s.split(" ").map((n) => CH[n]);
        const TRACKS = [
          { id: "lofi", name: "星空 Lo-fi", bpm: 72, swing: 0.2, key: 57, cb: 1, wet: 0.3, progs: [P("ii V I vi"), P("IV iii ii I"), P("vi IV I V")] },
          { id: "rain", name: "雨夜书房", bpm: 60, swing: 0, key: 50, cb: 2, wet: 0.4, progs: [P("I iii vi IV"), P("vi ii V I"), P("IV I ii vi")] },
          { id: "dawn", name: "晨光", bpm: 90, swing: 0.08, key: 60, cb: 1, wet: 0.25, progs: [P("I V vi IV"), P("IV I V vi"), P("I ii IV V")] },
        ];
        let comp = null, duck = null, bus = null, echo = null, noiseBuf = null, players = [], timer = null, offT = null, mode = -1;
        const rnd = (n) => (Math.random() * n) | 0;
        const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
        const newMotif = () => [0, 0, 0, 0].map(() => rnd(8));
        function mutate(m) { const c = m.slice(); for (let i = 0, n = 1 + rnd(2); i < n; i++) { const j = rnd(4); c[j] = Math.max(0, Math.min(9, c[j] + [-2, -1, 1, 2][rnd(4)])); } return c; }

        function kick(p, t) {
          const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.2);
          g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

            const o = ctx.createOscillator(), g = ctx.createGain(); o.type = ty; o.frequency.value = mtof(m); o.detune.value = rnd(7) - 3; g.gain.value = v;

        }
        function rain(p) {
          const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), dep = ctx.createGain();
          s.buffer = noiseBuf; s.loop = true; f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 0.5; g.gain.value = 0.05;
          lfo.frequency.value = 0.07; dep.gain.value = 0.02; lfo.connect(dep); dep.connect(g.gain);
          s.connect(f); f.connect(g); g.connect(p.out); s.start(); lfo.start(); p.nodes.push(s, lfo);
        }
        function section(p) {
          let n; do n = rnd(3); while (n === p.prog); p.prog = n;
          if (Math.random() < 0.25) p.key = p.t.key + [0, 2, -2, 5, -3][rnd(5)];
          p.drums = Math.random() > 0.3;
          if (Math.random() < 0.4) p.motif = newMotif();
        }
        function step(p, t) {
          const T = p.t, s = p.step % 16, bar = (p.step / 16) | 0, beat = 60 / T.bpm;
          if (s === 0) {
            if (bar && bar % 8 === 0) section(p);
            p.cur = bar % 4 === 2 ? mutate(p.motif) : bar % 4 === 0 ? p.motif : p.cur;
          }
          const ch = T.progs[p.prog][((bar / T.cb) | 0) % 4].map((x) => p.key + x);
          const mel = (d) => p.key + 12 + PENTA[d % 5] + 12 * ((d / 5) | 0);
          if (T.id === "lofi") {
            if (s === 0) { ep(p, ch, t, beat * 4); note(p, ch[0] - 24, t, beat * 1.8, "sine", 0.16, 0.02); }

              if (s === 4 || s === 12) hit(p, t, 0.16, 0.07, "bandpass", 1800);
              if (s % 2 === 0 || Math.random() < 0.15) hit(p, t, 0.04, s % 4 === 2 ? 0.03 : 0.018, "highpass", 7000);
            }

          } else if (T.id === "rain") {
            if (s === 0 && bar % 2 === 0) pad(p, ch, t, beat * 8 + 1, "sawtooth", 0.022, 280, 1300);
            if (s % 8 === 0 && Math.random() < 0.45) { const m = mel(p.cur[(bar * 2 + s / 8) % 4]) - 12; note(p, m, t, 3.5, "triangle", 0.045, 0.005, true); note(p, m, t, 2.5, "sine", 0.03, 0.005); }
          } else {
            if (s === 0) pad(p, ch.map((m) => m + 12), t, beat * 4 + 0.6, "sine", 0.014, 2500, 5000);
            if (s % 2 === 0 && Math.random() > 0.18) { const m = mel(p.cur[(s / 2) % 4] + (s >= 8 ? 1 : 0)); note(p, m, t, 0.55, "sine", 0.05, 0.004, true); note(p, m + 28, t, 0.08, "sine", 0.008, 0.002); }
            if (p.drums) hit(p, t, 0.05, s % 2 ? 0.022 : 0.01, "highpass", 6000);
          }
        }
        function sched() {
          const now = ctx.currentTime;
          players.forEach((p) => {
            if (p.next < now - 0.05) p.next = now + 0.02; /* tab was throttled: skip, don't burst */
            while (p.next < now + 0.1) { const sx = 60 / p.t.bpm / 4; step(p, p.next + (p.step % 2 ? p.t.swing * sx : 0)); p.step++; p.next += sx; }
          });
          const live = players.find((p) => !p.dead);
          if (mode < 0 && live && now - live.born > 180) switchTo((live.i + 1 + rnd(2)) % 3);
        }
        function label(i) { const n = document.getElementById("nowplaying"); if (n) n.textContent = "正在播放:" + (i == null ? "—" : TRACKS[i].name); }
        function kill(p) { p.nodes.forEach((n) => { try { n.stop(); } catch (e) {} }); p.out.disconnect(); p.wet.disconnect(); players = players.filter((x) => x !== p); }
        function switchTo(i) {
          const now = ctx.currentTime;
          players.filter((p) => !p.dead).forEach((p) => {
            p.dead = true; p.out.gain.cancelScheduledValues(now); p.out.gain.setValueAtTime(p.out.gain.value, now);
            p.out.gain.linearRampToValueAtTime(0.0001, now + 2); setTimeout(() => kill(p), 2300);
          });
          const T = TRACKS[i], p = { t: T, i, step: 0, next: now + 0.1, born: now, key: T.key, prog: 0, drums: true, motif: newMotif(), out: ctx.createGain(), wet: ctx.createGain(), nodes: [] };
          p.cur = p.motif; p.out.gain.setValueAtTime(0.0001, now); p.out.gain.linearRampToValueAtTime(1, now + 2);
          p.out.connect(bus); p.wet.gain.value = T.wet; p.wet.connect(echo);

          players.push(p); label(i);
        }
        function fadeTo(v) { const n = ctx.currentTime; musicGain.gain.cancelScheduledValues(n); musicGain.gain.setValueAtTime(musicGain.gain.value, n); musicGain.gain.linearRampToValueAtTime(v, n + 2); }
        function startMusic() {
          graph(); if (ctx.state === "suspended") ctx.resume();

        function stopMusic() {

          setSfx(v) { sfxOn = v; }, isSfx: () => sfxOn,
          setMusic(v) { musicOn = v; v ? startMusic() : stopMusic(); }, isMusic: () => musicOn,
          setVol(v) { vol = v; if (ctx && timer && musicOn) { const n = ctx.currentTime; musicGain.gain.cancelScheduledValues(n); musicGain.gain.setValueAtTime(musicGain.gain.value, n); musicGain.gain.linearRampToValueAtTime(vol, n + 0.3); } },

      /* ---------- state ---------- */
      const State = { xp: 0, stars: 0, perLevel: {}, badges: {}, unlocked: 1 };
      const BADGES = [
        { id: "first-pixel", name: "初见像素", hint: "看懂第一张数字图" },
        { id: "no-fear", name: "不怕失败", hint: "失败 3 次后成功" },
        { id: "coord", name: "坐标达人", hint: "第 2 关零失误放好 8 张卡" },
        { id: "perfect-line", name: "完美分界", hint: "第 3 关任一轮 100% 分对" },
        { id: "valley", name: "一步到谷底", hint: "第 4 关第 1 轮 ≤ 3 步到谷底" },
        { id: "trainer", name: "训练师", hint: "第 5 关完成全部 3 个任务" },
        { id: "space", name: "空间魔术师", hint: "第 6 关加一个特征，把猫狗 100% 分开" },
        { id: "brain", name: "造脑者", hint: "第 7 关 AI 认出你画的图" },
      ];
      const LEVELS_META = [
        { id: 1, title: "像素就是数字", sub: "图片在机器眼里是一串数" },
        { id: 2, title: "给猫画像", sub: "特征：挑出有用的几个数" },
        { id: 3, title: "一条线分开猫狗", sub: "分类与决策边界" },
        { id: 4, title: "蒙眼下山", sub: "梯度下降" },
        { id: 5, title: "让线自己学会", sub: "训练一个线性模型" },
        { id: 6, title: "扭一扭空间", sub: "非线性变换" },
        { id: 7, title: "造一个神经元大脑", sub: "BOSS 关 · 神经网络" },
      ];

      const $ = (s) => document.querySelector(s);
      function toast(msg) {
        const el = document.createElement("div"); el.className = "x-toast"; el.textContent = msg;
        $("#toasts").appendChild(el); setTimeout(() => el.remove(), 3200);
      }
      function award(id) {

      }
      function renderBadges() {

          `<span class="x-badge ${State.badges[b.id] ? "got" : ""}">${State.badges[b.id] ? "🏅" : "🔒"} ${b.name}<small style="opacity:.75"> · ${b.hint}</small></span>`

      }
      function renderBar() { $("#xp").textContent = State.xp; $("#stars").textContent = State.stars; }

        $("#nodes").innerHTML = LEVELS_META.map((m) => {
          const open = m.id <= State.unlocked && !!getLevel(m.id);
          const got = State.perLevel[m.id] || 0;

          return `<button class="x-node ${open ? "is-open" : ""}" data-level="${m.id}" ${open ? "" : "disabled"}>
            <span class="x-node__num">${m.id}</span>
            <span><span class="x-node__t">${m.title}</span><span class="x-node__s">${note}</span></span>
            <span class="x-stars">${starStr(got)}</span></button>`;

      function finishLevel(id, stars, xp) {

      /* guide bubble helper */

      }

      /* end-card helper: stars, headline, [[term, meaning]], star-map ids */

            const edge = (id, w) => { const e = q(`[data-e="${id}"]`); e.setAttribute("stroke", w >= 0 ? "var(--chart-ink)" : "var(--chart-bad)"); e.setAttribute("stroke-width", (0.6 + Math.min(7, Math.abs(w) * 1.1)).toFixed(1)); e.setAttribute("stroke-opacity", "0.8"); };
            net.W.forEach((w, j) => w.forEach((v, i) => edge(`w${j}${i}`, v))); net.v.forEach((v, j) => edge(`v${j}`, v));
            probeTxt.textContent = `指针处 (${probe[0].toFixed(1)}, ${probe[1].toFixed(1)})：网络认为是猫的概率 ${Math.round(o * 100)}%。`;
          }
          rafLoop(root, () => {
            if (training) {
              gd(0.5); steps++; if (steps % 2 === 0) plot(); sync(); const s = readout(); dirty = true;
              if (steps % 6 === 0) Audio_.play("tick", 300 + s.acc * 700);
              if (s.acc >= 0.95) win("b", `≥ 95%！梯度下降把 13 个权重一起调好了。`, set === "donut" ? "再切到「双月」数据，按训练试试，看热力图弯成月牙。" : "三条直线叠起来，弯出了月牙形的边界。");
              if ((s.acc === 1 && s.L < 0.08) || steps >= 1500) { stop(); say(s.acc === 1 ? "全部分对，误差也很小了，训练自动停下。" : "训练了很久，先停一停。", "可以换一组数据，或者重置再来。"); }
            }
            if (!dirty) return; dirty = false; render();
          });
          new MutationObserver(() => { K0 = null; dirty = true; }).observe(document.documentElement, { attributes: true });
          addEventListener("resize", () => (dirty = true));
          B.cv.addEventListener("pointermove", (e) => { const [px, py, w] = B.at(e), s = w / 6.4; probe = [(px - w / 2) / s, (w / 2 - py) / s]; dirty = true; });
          B.cv.addEventListener("pointerdown", (e) => { const [px, py, w] = B.at(e), s = w / 6.4; probe = [(px - w / 2) / s, (w / 2 - py) / s]; dirty = true; });
          function stop() { training = false; trainB.textContent = "训练 ▶"; }
          trainB.addEventListener("click", () => {
            if (training) return stop();
            Audio_.play("click"); training = true; trainB.textContent = "暂停 ⏸";
            if (!steps) plot(true);
          });
          function reset(k) {
            stop(); if (k) { set = k; P = SETS[k]; dD.setAttribute("aria-pressed", String(k === "donut")); dM.setAttribute("aria-pressed", String(k === "moons")); }
            net = fresh(); steps = 0; sync(); plot(true); readout(); dirty = true; Audio_.play("click");
          }
          resetB.addEventListener("click", () => reset());
          dD.addEventListener("click", () => { reset("donut"); say("回到甜甜圈：猫在中间，狗在外圈。"); });
          dM.addEventListener("click", () => { reset("moons"); say("双月：两弯月牙互相咬在一起，一条直线肯定不够。", "按「训练 ▶」，看网络能不能弯出一条曲线。"); });
          /* BOSS: draw, train logistic regression on 64 numbers, guess */
          let shownBoss = false;
          function showBoss() {
            if (shownBoss) return; shownBoss = true; boss.hidden = false;
            const ex = [], Wl = Array(65).fill(0);
            let trained = false;
            boss.append(el("h3", "", "BOSS：教 AI 认出你画的猫"),
              el("p", "", "第 1 关的 8×8 画板回来了！画 3 张「猫脸」和 3 张「不是猫」，再训练一个小分类器：它读的就是这 64 个数。"));
            const wrap = el("div", "x-split"), lp = el("div"), rp = el("div");
            wrap.append(lp, rp); boss.append(wrap);
            const pad = pad8(lp);
            const saveRow = el("div", "x-row"), sCat = el("button", "x-btn", "存为「猫脸」0/3"), sNot = el("button", "x-btn", "存为「不是猫」0/3"), clr = el("button", "x-btn", "清空");
            saveRow.append(sCat, sNot, clr);
            const thumbs = el("div", "x-thumbs"), trainRow = el("div", "x-row"), fit = el("button", "x-btn x-btn--go", "训练小分类器"), fitInfo = el("span", "pill", "还差 6 张");
            fit.disabled = true; trainRow.append(fit, fitInfo);
            const testRow = el("div", "x-row"), tCat = el("button", "x-btn", "我画的是猫，让 AI 猜"), tNot = el("button", "x-btn", "我画的不是猫，让 AI 猜");
            testRow.hidden = true; testRow.append(tCat, tNot);
            const result = el("div"); result.hidden = true;
            rp.append(saveRow, thumbs, trainRow, testRow, result);
            const cnt = (y) => ex.filter((e) => e.y === y).length;
            const feat = (v) => [...v, 1];
            const predict = (v) => sig(feat(v).reduce((s, q, i) => s + q * Wl[i], 0));
            function refresh() {
              const a = cnt(1), b = cnt(0);
              sCat.textContent = `存为「猫脸」${a}/3`; sNot.textContent = `存为「不是猫」${b}/3`;
              fit.disabled = a < 3 || b < 3; fitInfo.textContent = fit.disabled ? `还差 ${Math.max(0, 3 - a) + Math.max(0, 3 - b)} 张` : trained ? "已训练" : "可以训练了";
            }
            function save(y) {
              if (pad.empty()) { Audio_.play("wrong"); return say("画板是空的。", "先涂几个方块再存。"); }
              ex.push({ v: pad.v.slice(), y });
              const t = el("span", "x-opt"), cv = document.createElement("canvas"); cv.width = 48; cv.height = 48; cv.setAttribute("aria-hidden", "true");
              t.append(cv, document.createTextNode(y ? "猫" : "不是猫")); thumbs.append(t); drawArt(cv, pad.rows());
              pad.clear(); Audio_.play("correct");
              if (trained) train(); else refresh();
              if (cnt(1) >= 3 && cnt(0) >= 3 && !trained) say("示范够了！按「训练小分类器」。", "它会给 64 个方块各配一个权重：像猫的方块权重为正。");
            }
            function train() {
              Wl.fill(0);
              for (let k = 0; k < 400; k++) {
                const g = Array(65).fill(0);
                ex.forEach(({ v, y }) => { const e = predict(v) - y; feat(v).forEach((q, i) => (g[i] += e * q)); });
                for (let i = 0; i < 65; i++) Wl[i] -= 0.5 * (g[i] / ex.length + (i < 64 ? 0.01 * Wl[i] : 0));
              }
              trained = true; refresh(); testRow.hidden = false;
              const ok = ex.filter(({ v, y }) => predict(v) > 0.5 === !!y).length;
              fitInfo.textContent = `已训练 · 示范分对 ${ok}/${ex.length}`;
            }
            fit.addEventListener("click", () => {
              fit.disabled = true; let i = 0;
              const blip = setInterval(() => { Audio_.play("tick", 400 + i * 60); if (++i > 8) { clearInterval(blip); train(); Audio_.play("correct"); say("训练完成！现在画一张新图，告诉 AI 你画的是什么，看它猜不猜得对。", "这是逻辑回归：64 个数乘上权重再相加，越大越像猫。"); } }, 70);
            });
            function test(isCat) {
              if (pad.empty()) { Audio_.play("wrong"); return say("先在画板上画一张新图。"); }
              const p = predict(pad.v), guessCat = p > 0.5, conf = Math.round((guessCat ? p : 1 - p) * 100), right = guessCat === isCat;
              result.hidden = false;
              result.innerHTML = `<p class="x-big">AI：${guessCat ? "猫 🐱" : "不是猫"}</p><p class="fineprint">把握 ${conf}%</p><div class="x-conf" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${conf}" aria-label="AI 的把握"><span style="width:0%"></span></div>`;
              requestAnimationFrame(() => requestAnimationFrame(() => (result.querySelector(".x-conf span").style.width = conf + "%")));
              if (right) {
                if (got.c) { Audio_.play("correct"); say("喵～！又认对了！", `把握 ${conf}%。`); }
                else win("c", "喵～！它认出来了！", `你说「${isCat ? "猫" : "不是猫"}」，AI 也这么说（把握 ${conf}%）。你刚刚从零教会了一台机器。`);
              } else { Audio_.play("wrong"); setTimeout(() => say("喵？它猜错了。", "多存几张示范（会自动重新训练），或者画得更像你的示范，再试一次。"), 250); }
            }
            sCat.addEventListener("click", () => save(1)); sNot.addEventListener("click", () => save(0));
            clr.addEventListener("click", () => { pad.clear(); Audio_.play("click"); });
            tCat.addEventListener("click", () => test(true)); tNot.addEventListener("click", () => test(false));
            refresh();
            setTimeout(() => boss.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }), 900);
          }
          endB.addEventListener("click", finish);
          function finish() {
            if (finished) return; finished = true; stop(); endB.disabled = true;
            const stars = total();
            say("神经网络没有魔法：就是很多条小直线，叠起来，再一起下山。", stars ? "星图全部点亮，去看看你的任务总结吧。" : "拿到 1 颗星就能看到任务总结。");
            const card = endCard(stars, `完成 ${stars} / 3 个任务`, [
              ["神经网络", "= 很多个「小直线分类器」叠起来，再用梯度下降一起训练。"],
              ["隐藏神经元", "每个都是一条直线（第 3 关），tanh 把它变成柔和的开关；三条叠起来就能围出曲线边界。"],
              ["训练", "误差对 13 个权重求梯度，一起往下坡走（第 4、5 关）。BOSS 里的逻辑回归也是这样学会 64 个权重的。"],
            ], "m13 神经网络 · a20 矩阵与线性变换 · m07 梯度下降 · p20 统计学习");
            root.append(card);
            done(stars, 120 + stars * 40);
            if (stars) { const r = el("div", "x-row"), b = el("button", "x-btn x-btn--go", "查看任务总结 🎆"); r.append(b); card.append(r); b.addEventListener("click", missionComplete); }
          }
          renderTasks(); readout(); plot(true);
        },
      });

      /* ---------- mission complete ---------- */
      const STAR_PATH = ["g15", "n20", "g11", "a11", "g20", "c05", "c12", "m07", "p16", "p20", "a20", "a21", "g22", "m13"];
      function fireworks(cv) {
        if (reduced()) return;
        const c = cv.getContext("2d"), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight, cols = [1, 2, 3, 4, 5, 6, 7].map((i) => tok(`--chart-${i}`));
        cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
        const parts = [], t0 = performance.now(); let last = 0;
        const burst = () => {
          const x = W * (0.15 + Math.random() * 0.7), y = H * (0.1 + Math.random() * 0.35), col = cols[(Math.random() * 7) | 0];
          for (let i = 0; i < 46; i++) { const a = (i / 46) * 6.283, v = 1.5 + Math.random() * 2.5; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col }); }
          Audio_.play("pop");
        };
        const f = (now) => {
          if (!cv.isConnected) return;
          const t = now - t0;
          if (t < 4200 && t - last > 380) { last = t; burst(); }
          c.clearRect(0, 0, W, H);
          parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.985; p.life -= 0.012; if (p.life > 0) { c.globalAlpha = p.life; c.fillStyle = p.col; c.beginPath(); c.arc(p.x, p.y, 2.4, 0, 7); c.fill(); } });
          for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
          if (t < 4200 || parts.length) requestAnimationFrame(f); else c.clearRect(0, 0, W, H);
        };
        requestAnimationFrame(f);
      }
      function missionComplete() {
        $("#play-title").textContent = "任务完成！";
        $("#play-sub").textContent = "七关全部走完，星图已点亮。";
        const stage = $("#stage"); stage.innerHTML = "";
        const fw = document.createElement("canvas"); fw.className = "x-fw"; fw.setAttribute("aria-hidden", "true"); stage.append(fw);
        guide(stage, "你刚刚从像素一路走到了神经网络。", "喵博士给你放烟花！");
        const earned = BADGES.filter((b) => State.badges[b.id]);
        stage.append(el("section", "stats", `<div class="stat"><span class="stat__fig">${State.stars}/21</span><span class="stat__label">⭐ 星星</span></div>
          <div class="stat"><span class="stat__fig">${State.xp}</span><span class="stat__label">XP</span></div>
          <div class="stat"><span class="stat__fig">${earned.length}/${BADGES.length}</span><span class="stat__label">徽章</span></div>`));
        stage.append(el("div", "", `<p style="font:var(--type-body-strong);margin-bottom:8px">获得的徽章</p><div class="x-shelf">${earned.length ? earned.map((b) => `<span class="x-badge got">🏅 ${b.name}</span>`).join("") : '<span class="x-badge">这次还没有徽章，再玩一次试试</span>'}</div>`));
        stage.append(el("div", "", `<p style="font:var(--type-body-strong);margin-bottom:8px">点亮的星：你的路线</p><ol class="x-recap">${STAR_PATH.map((s) => `<li><span class="pill">${s}</span></li>`).join("")}</ol>`));
        stage.append(el("p", "x-big", "你刚刚从像素一路走到了神经网络。"));
        stage.append(notesCard());
        const row = el("div", "x-row"), again = el("button", "x-btn x-btn--go", "再玩一次"); row.append(again); stage.append(row);
        again.addEventListener("click", () => {
          Object.assign(State, { xp: 0, stars: 0, perLevel: {}, badges: {}, unlocked: 1 });
          renderBar(); renderBadges(); renderMap(); Audio_.play("click");
          $("#play-title").textContent = "选一关开始"; $("#play-sub").textContent = "喵博士在星图上等你。";
          stage.innerHTML = ""; guide(stage, "新的一轮！点开第 1 关「像素就是数字」，我们从一个像素重新开始。");
          $("#map").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
        });
        Audio_.play("finale"); setTimeout(() => Audio_.play("meow"), 1600);
        $("#play").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
        setTimeout(() => fireworks(fw), 60);
      }

      /* ---------- knowledge notes ---------- */
      const notesCard = () => $("#notes-tpl").content.firstElementChild.cloneNode(true);
      function notesText(card) {
        return [...card.querySelectorAll(".x-notes__body > *")].map((n) =>
          n.tagName === "H4" ? "【" + n.textContent.trim() + "】"
            : [...n.children].map((li, i) => (n.tagName === "OL" ? i + 1 + ". " : "- ") + li.textContent.trim()).join("\n")
        ).join("\n");
      }
      function copyNotes(card) {
        const txt = notesText(card), done = () => toast("已复制");
        const fallback = () => {
          const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;left:-9999px;opacity:0"; document.body.append(ta); ta.select();
          let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove();
          if (ok) return done();
          const r = document.createRange(); r.selectNodeContents(card.querySelector(".x-notes__body"));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("已选中笔记,请按 Ctrl/⌘+C 复制");
        };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-copy-notes]"); if (b) copyNotes(b.closest(".x-notes"));
        if (e.target.closest("[data-close-notes]")) $("#notes-dlg").close();
      });
      $("#notes-open").addEventListener("click", () => {
        const d = $("#notes-dlg"); if (!d.querySelector(".x-notes")) d.append(notesCard());
        d.showModal ? d.showModal() : d.setAttribute("open", "");
      });
      $("#notes-dlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

      /* ---------- boot ---------- */
      renderBar(); renderBadges(); renderMap();
      const once = () => { Audio_.unlock(); window.removeEventListener("pointerdown", once); window.removeEventListener("keydown", once); };
      window.addEventListener("pointerdown", once); window.addEventListener("keydown", once);
      $("#sfx").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.setSfx(on); if (on) Audio_.play("click");
      });
      $("#music").addEventListener("click", (e) => {
        const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on)); Audio_.unlock(); Audio_.setMusic(on); Audio_.play("click");
      });
      $("#vol").addEventListener("input", (e) => Audio_.setVol(+e.target.value / 100));
      $("#track").addEventListener("change", (e) => Audio_.setTrack(+e.target.value));
    </script>
