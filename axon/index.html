<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AXON — 垦丁</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { font: 12px/1.4 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: rgba(255,255,255,.72); }
      #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #plate { display: none; }
      .x-fallback #plate { display: block; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .x-fallback #gl { display: none; }
      .x-vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 75% at 50% 46%, transparent 65%, rgba(2,4,12,.28) 100%); }
      .x-vig::after { content: ""; position: absolute; inset: 0; opacity: .6; mix-blend-mode: soft-light; background: linear-gradient(180deg, rgba(150,160,220,.18), rgba(255,170,110,.12) 52%, rgba(10,20,50,.25)); }
      .x-error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 15px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
      .x-fallback .x-error { display: flex; }
      .x-fallback .x-intro, .x-fallback .x-ctl { display: none; }
      .x-hud { position: fixed; margin: 0; font: 300 12px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; color: rgba(255,255,255,.6); pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.5); transition: opacity 1.2s; }
      .x-tl { left: 16px; top: 14px; } .x-bl { left: 16px; bottom: 14px; } .x-br { right: 16px; bottom: 14px; text-align: right; }
      .x-ctl { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; pointer-events: auto; }
      .x-ctl button { width: 44px; height: 44px; border: 0; background: none; color: rgba(255,255,255,.7); font: inherit; font-size: 18px; cursor: pointer; border-radius: 22px; }
      .x-ctl button:hover, .x-ctl button:focus-visible { color: #fff; background: rgba(255,255,255,.08); outline: none; }
      .x-ctl span { min-width: 150px; text-align: center; }
      .x-pre > .x-hud { opacity: 0; pointer-events: none; }
      .x-intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(0,0,0,.35); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; transition: opacity 1.2s; }
      .x-intro svg { width: 88px; height: 88px; transform: rotate(-90deg); }
      .x-intro circle { fill: none; stroke-width: 1; }
      .x-intro p { position: static; font-size: 12px; color: rgba(255,255,255,.75); }
      .x-intro.x-out { opacity: 0; pointer-events: none; }
      #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      .x-tod { right: 20px; top: 50%; height: 34vh; width: 2px; transform: translateY(-50%); background: rgba(255,255,255,.18); }
      .x-tod i { position: absolute; left: -4px; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
      .x-snd { right: 8px; top: 6px; min-width: 44px; height: 44px; padding: 0 10px; border: 0; background: none; color: rgba(255,255,255,.7); cursor: pointer; border-radius: 22px; pointer-events: auto; }
      .x-snd:hover, .x-snd:focus-visible { color: #fff; background: rgba(255,255,255,.08); outline: none; }
      .x-fallback #fx, .x-fallback .x-tod, .x-fallback .x-snd { display: none; }
    </style>
  </head>
  <body class="x-pre">
    <img id="plate" src="kenting_plate.jpg" alt="垦丁海岸黄昏，灯塔与礁石" />
    <canvas id="gl"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="x-vig" aria-hidden="true"></div>
    <p class="x-error">WebGL 不可用</p>
    <p class="x-hud x-tl">AXON<br />SCENE 01 · 垦丁 KENTING · 滚动=时间 · 划过=唤醒<br /><span id="hShape">WAVE · 浪</span><br /><span id="hTod">TIME 18:20</span> <span id="hMet"></span></p>
    <div class="x-hud x-tod" aria-hidden="true"><i id="todK"></i></div>
    <button class="x-hud x-snd x-ui" id="bSnd" aria-pressed="false" aria-label="Sound">SOUND OFF</button>
    <audio id="bgm" src="kenting_dusk_shoreline.m4a" preload="auto"></audio>
    <p class="x-hud x-bl" id="hInfo">X 0000 Y 0000</p>
    <p class="x-hud x-br"><span id="hTime">--:--:--</span><br />21.90°N 120.85°E</p>
    <div class="x-hud x-ctl x-ui">
      <button id="bPrev" aria-label="Previous shape">‹</button><span id="cName">WAVE · 浪</span><button id="bNext" aria-label="Next shape">›</button><button id="bPause" aria-label="Pause">❚❚</button>
    </div>
    <div class="x-intro x-ui" id="intro">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,.15)" /><circle id="ring" cx="50" cy="50" r="46" stroke="rgba(255,255,255,.8)" stroke-dasharray="289" stroke-dashoffset="289" /></svg>
      <p class="x-hud">按住进入 · HOLD TO ENTER</p>
    </div>
    <script src="three.min.js"></script>
    <script>
      (function () {
        const canvas = document.getElementById("gl");
        const img = document.getElementById("plate");
        const fail = () => document.body.classList.add("x-fallback");

        let renderer;
        try {
          if (typeof THREE === "undefined") throw 0;
          renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
        } catch (e) { fail(); return; }
        const gl = renderer.getContext();
        if (!renderer.capabilities.isWebGL2 || !gl.getExtension("EXT_color_buffer_float")) { renderer.dispose(); fail(); return; }

        const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
        renderer.setPixelRatio(DPR);
        renderer.autoClear = false;
        let SIZE = innerWidth < 768 ? 256 : 512, N, small;

        const HASH = "float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}\n";
        const SPRAY = "float sprayPh(vec2 uv, float t){ return h(uv + 11.) < .03 ? fract(t / 7. + h(uv + 13.)) : -1.; }\n";
        const BEAM = "float beamAt(vec2 sp, vec2 lamp, vec3 b){ vec2 q = (sp - lamp) * vec2(b.z, 1.);"
          + " float da = abs(mod(atan(q.y, q.x) - b.x + 3.14159, 6.28318) - 3.14159);"
          + " return b.y * smoothstep(.15, .0, da) * smoothstep(1.8, .05, length(q)); }\n";
        const quadVS = "varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}";
        const quad = new THREE.PlaneGeometry(2, 2);
        const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        // ---------- Background plate ----------
        const plateTex = new THREE.Texture(img);
        plateTex.minFilter = THREE.LinearFilter;
        plateTex.generateMipmaps = false;
        const bgMat = new THREE.ShaderMaterial({
          depthTest: false, depthWrite: false,
          uniforms: { tPlate: { value: plateTex }, uRes: { value: new THREE.Vector2(1, 1) }, uMouse: { value: new THREE.Vector2() }, uImgAspect: { value: 2400 / 1018 }, uTime: { value: 0 },
            uFade: { value: 0 }, uLamp: { value: new THREE.Vector2(.8, .6) }, uBeam: { value: new THREE.Vector3(0, 0, 1) }, uClick: { value: new THREE.Vector2(.5, -9) }, uN: { value: 0 } },
          vertexShader: quadVS,
          fragmentShader: HASH + BEAM + `
            uniform sampler2D tPlate; uniform vec2 uRes, uMouse, uLamp, uClick; uniform vec3 uBeam; uniform float uImgAspect, uTime, uFade, uN; varying vec2 vUv;
            void main(){
              float sa = uRes.x / uRes.y;
              vec2 s = sa > uImgAspect ? vec2(1., uImgAspect / sa) : vec2(sa / uImgAspect, 1.);
              vec2 uv = (vUv - .5) * s * .94 + .5;
              uv += uMouse * mix(.03, .006, smoothstep(.05, .65, uv.y));
              float sea = smoothstep(.28, .32, uv.y) * (1. - smoothstep(.47, .5, uv.y));
              float near = .3 + clamp((.5 - uv.y) / .2, 0., 1.);
              vec2 rp = uv * vec2(40., 120.);
              uv.x += sea * near * .0015 * (sin(rp.y * .6 + uTime * 1.3) + .5 * sin(rp.x * .3 + rp.y * .4 - uTime * .9));
              uv.y += sea * near * .0008 * sin(rp.y * .5 + uv.x * 30. + uTime * 1.1);
              float ct = uTime - uClick.y, rip = 0.;
              if (ct < 2.5) {
                vec2 dq = (uv - vec2((uClick.x - .5) * s.x * .94 + .5, .4)) * vec2(uImgAspect, 5.);
                rip = sea * exp(-pow((length(dq) - ct * .4) * 28., 2.)) * exp(-ct * 1.5);
                uv.y += rip * .004;
              }
              vec3 col = texture2D(tPlate, uv).rgb + rip * .22;
              float L = dot(col, vec3(.3, .59, .11)), k1 = smoothstep(0., .5, uN), k2 = smoothstep(.45, 1., uN);
              col = mix(col, L * vec3(.55, .68, 1.05), k1 * .75) * (1. - k1 * .35);
              col = mix(col, L * vec3(.16, .2, .36) + vec3(.004, .008, .022), k2);
              vec2 sg = vUv * vec2(sa, 1.) * 160.; vec2 si = floor(sg), sf = fract(sg) - .5;
              float sr = h(si + .5), dens = mix(.997, .972, smoothstep(.5, .95, uv.y));
              float star = step(dens, sr) * smoothstep(.22, 0., length(sf - (vec2(h(si + 1.3), h(si + 2.1)) - .5) * .5)) * (.55 + .45 * sin(uTime * (1. + sr * 3.) + sr * 90.));
              col += smoothstep(.5, .54, uv.y) * smoothstep(.1, .28, L) * k2 * star * vec3(.85, .9, 1.);
              float bm = beamAt(vUv, uLamp, uBeam);
              col += (bm * .16 + smoothstep(.025, 0., length((vUv - uLamp) * vec2(uBeam.z, 1.))) * .6) * (1. + uN * 2.2) * vec3(1., .86, .62);
              vec2 g = uv * vec2(240., 520.) + vec2(uTime * 2.5, 0.);
              vec2 id = floor(g); vec2 f = fract(g) - .5;
              float r = h(id);
              float tw = pow(max(0., sin(uTime * (2. + r * 4.) + r * 40.)), 12.);
              col += sea * (1. - .7 * k2) * step(.94, r) * tw * smoothstep(.35, 0., length(f)) * vec3(1., .9, .75);
              gl_FragColor = vec4(col * uFade, 1.);
            }`,
        });
        const bgScene = new THREE.Scene();
        bgScene.add(new THREE.Mesh(quad, bgMat));

        // ---------- Target shapes ----------
        const rnd = Math.random;
        function makeTex(fill) {
          const d = new Float32Array(N * 4);
          for (let i = 0; i < N; i++) { const p = fill(i); d[i * 4] = p[0]; d[i * 4 + 1] = p[1]; d[i * 4 + 2] = p[2]; d[i * 4 + 3] = rnd() * 6.283; }
          const t = new THREE.DataTexture(d, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType);
          t.needsUpdate = true;
          return t;
        }
        const CY = 0.45;
        const gWave = () => {
          const z = (rnd() - 0.5) * 2.6;
          const k = 1 - z * 0.12;
          const s = rnd();
          let x, y, nx, ny, thick;
          if (s < 0.3) {
            const t = s / 0.3;
            x = 2.4 - t * 2.0; y = -0.95 + t * t * 0.25; nx = 0; ny = 1; thick = 0.06;
          } else {
            const phi = ((s - 0.3) / 0.7) * Math.PI * 2.3;
            const th = -0.35 * Math.PI + phi;
            const r = 1.0 * Math.exp(-0.17 * phi);
            nx = Math.cos(th); ny = Math.sin(th);
            x = 0.25 + nx * r; y = -0.05 + ny * r * 0.9; thick = 0.1 * r;
          }
          const o = (rnd() - 0.5) * thick * 2;
          return [(x + nx * o) * k + z * 0.35, (y + ny * o) * k + CY, z];
        };
        const gSphere = () => {
          const u = rnd() * 2 - 1, a = rnd() * 6.283, r = 1.3 * (0.94 + rnd() * 0.06), q = Math.sqrt(1 - u * u);
          return [Math.cos(a) * q * r, u * r + CY, Math.sin(a) * q * r];
        };
        const gLight = () => {
          const s = rnd(), a = rnd() * 6.283;
          let y, r;
          if (s < 0.62) { const t = rnd(); y = -1.3 + t * 2.1; r = 0.42 - t * 0.2; }
          else if (s < 0.72) { y = 0.8; r = 0.22 + rnd() * 0.18; }
          else if (s < 0.88) { y = 0.8 + rnd() * 0.35; r = 0.2; }
          else { const t = rnd(); y = 1.15 + t * 0.35; r = 0.27 * (1 - t); }
          r += (rnd() - 0.5) * 0.02;
          return [Math.cos(a) * r, y + CY - 0.1, Math.sin(a) * r];
        };
        const gTorus = () => {
          const u = rnd() * 6.283, v = rnd() * 6.283, w = 1.1 + 0.38 * Math.cos(v), y = w * Math.sin(u), z = 0.38 * Math.sin(v), c = Math.cos(1.1), sn = Math.sin(1.1);
          return [w * Math.cos(u), y * c - z * sn + CY, y * sn + z * c];
        };
        const gText = (() => {
          const W = 1024, H = 300, c = document.createElement("canvas");
          c.width = W; c.height = H;
          const x = c.getContext("2d");
          x.fillStyle = "#fff"; x.font = "900 230px Arial, Helvetica, sans-serif";
          x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("AXON", W / 2, H / 2);
          const px = x.getImageData(0, 0, W, H).data, pts = [];
          for (let j = 0; j < H; j += 1) for (let i = 0; i < W; i += 1) if (px[(j * W + i) * 4 + 3] > 128) pts.push(i, j);
          const n = pts.length / 2, S = 4.6;
          return () => {
            const k = (rnd() * n) | 0;
            return [((pts[k * 2] + rnd()) / W - 0.5) * S, (0.5 - (pts[k * 2 + 1] + rnd()) / H) * S * (H / W) + CY, (rnd() - 0.5) * 0.3];
          };
        })();
        const shapes = [["WAVE · 浪", gWave], ["SPHERE · 球", gSphere], ["AXON", gText], ["LIGHTHOUSE · 灯塔", gLight], ["TORUS · 环", gTorus]];
        let texs = [], shapeI = 0;

        // ---------- Simulation ----------
        const rtOpts = { type: THREE.FloatType, format: THREE.RGBAFormat, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false, stencilBuffer: false };
        let pos = [], vel = [];
        const simRes = new THREE.Vector2(SIZE, SIZE);
        const simScene = new THREE.Scene();
        const simMesh = new THREE.Mesh(quad);
        simScene.add(simMesh);

        const copyMat = new THREE.ShaderMaterial({
          uniforms: { tSrc: { value: null }, uRes: { value: simRes } },
          vertexShader: quadVS,
          fragmentShader: HASH + `uniform sampler2D tSrc; uniform vec2 uRes;
            void main(){ vec2 uv = gl_FragCoord.xy / uRes; vec3 p = texture2D(tSrc, uv).xyz;
              p += (vec3(h(uv), h(uv + 1.7), h(uv + 3.1)) - .5) * 3.; gl_FragColor = vec4(p, 1.); }`,
        });
        const velMat = new THREE.ShaderMaterial({
          uniforms: { tPos: { value: null }, tVel: { value: null }, tTarget: { value: null }, tPrev: { value: null }, uMorphT: { value: -9 }, uRes: { value: simRes }, uMouse: { value: new THREE.Vector3(99, 99, 0) }, uDown: { value: 0 }, uTime: { value: 0 }, uDt: { value: 0.016 },
            uShock: { value: new THREE.Vector4(0, 0, 0, -9) }, uGather: { value: 0 }, uSpray: { value: 0 }, uLift: { value: 0 }, uMVel: { value: new THREE.Vector3() }, uMSpd: { value: 0 } },
          vertexShader: quadVS,
          fragmentShader: HASH + SPRAY + `uniform sampler2D tPos, tVel, tTarget, tPrev; uniform vec2 uRes; uniform vec3 uMouse, uMVel; uniform vec4 uShock; uniform float uDown, uTime, uDt, uMorphT, uGather, uSpray, uLift, uMSpd;
            void main(){
              vec2 uv = gl_FragCoord.xy / uRes;
              vec4 p = texture2D(tPos, uv); vec3 v = texture2D(tVel, uv).xyz;
              vec4 tg = mix(texture2D(tPrev, uv), texture2D(tTarget, uv), step(h(uv + 4.2) * .9, uTime - uMorphT));
              vec3 goal = tg.xyz + vec3(0., sin(uTime * .8 + tg.w) * .02, 0.);
              goal = mix(tg.xyz + (vec3(h(uv + .3), h(uv + .6), h(uv + .9)) - .5) * vec3(10., 6., 4.), goal, uGather);
              vec3 acc = (goal - p.xyz) * 7.;
              vec3 q = p.xyz * .8 + .35 * sin(p.yzx * .6 + uTime * .15);
              acc += vec3(sin(q.y + uTime * .3) + cos(q.z * 1.1 + uTime * .2),
                          sin(q.z * .9 - uTime * .25) + cos(q.x + uTime * .3),
                          sin(q.x * 1.1 - uTime * .2) + cos(q.y * .9 + uTime * .15)) * .13;
              // Pass-by wake: distance to the cursor's recent path (a capsule trailing behind it).
              vec3 ab = -uMVel * .1; float tt = clamp(dot(p.xyz - uMouse, ab) / max(dot(ab, ab), 1e-5), 0., 1.);
              vec3 d = p.xyz - (uMouse + ab * tt); d.z *= .6;
              float r = length(d), R = mix(.3, 1.15, uMSpd) + uDown * .5;
              if (r < R) {
                float f = 1. - r / R; f *= f;
                float ms = length(uMVel); vec3 side = ms > 1e-3 ? vec3(-uMVel.y, uMVel.x, 0.) / ms : vec3(0.);
                acc += uMVel * f * 2.2 * (1. - tt * .5);
                acc += side * sign(dot(d, side)) * f * ms * 3.;
                acc += d / max(r, 1e-3) * f * (mix(3., 14., uMSpd) + uDown * 60.);
              }
              float st = uTime - uShock.w;
              if (st < 1.2) {
                vec3 sd = p.xyz - uShock.xyz; float sr = length(sd);
                acc += sd / max(sr, .05) * exp(-pow((sr - st * 3.5) * 3., 2.)) * exp(-st * 3.) * 90.;
              }
              acc.y += uLift * (.6 + .8 * h(uv + 5.5));
              float ph = uSpray > .5 ? sprayPh(uv, uTime) : -1.;
              if (ph >= 0. && ph < .4) {
                acc = acc * .04 + vec3(sin(uTime + tg.w) * .3, -4.5, 0.);
                if (p.w < .5) { acc = vec3(0.); v = vec3(0.); }
              } else if (ph >= .4) acc *= mix(.15, 1., smoothstep(.4, .8, ph));
              v += acc * uDt; v *= exp(-4.2 * uDt);
              gl_FragColor = vec4(v, 1.);
            }`,
        });
        const posMat = new THREE.ShaderMaterial({
          uniforms: { tPos: { value: null }, tVel: { value: null }, uRes: { value: simRes }, uDt: { value: 0.016 }, uTime: { value: 0 }, uSeaY: { value: -1 }, uHalfW: { value: 3 }, uSpray: { value: 0 } },
          vertexShader: quadVS,
          fragmentShader: HASH + SPRAY + `uniform sampler2D tPos, tVel; uniform vec2 uRes; uniform float uDt, uTime, uSeaY, uHalfW, uSpray;
            void main(){ vec2 uv = gl_FragCoord.xy / uRes;
              vec4 p = texture2D(tPos, uv);
              float ph = uSpray > .5 ? sprayPh(uv, uTime) : -1.;
              if (ph < 0. || ph >= .4) p.w = 1.;
              else if (p.w > .5 && p.y < uSeaY) p = vec4((h(uv + fract(uTime)) - .5) * 2. * uHalfW, uSeaY + (h(uv - fract(uTime)) - .5) * .3, 0., 0.);
              gl_FragColor = vec4(p.xyz + texture2D(tVel, uv).xyz * uDt, p.w); }`,
        });

        function pass(mat, rt) { simMesh.material = mat; renderer.setRenderTarget(rt); renderer.render(simScene, orthoCam); }
        let cur = 0;

        // ---------- Particles ----------
        const ptMat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, depthTest: false,
          blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
          uniforms: { tPos: { value: null }, tVel: { value: null }, uTime: { value: 0 }, uSize: { value: 1 }, uAlpha: { value: 0.8 }, uLamp: bgMat.uniforms.uLamp, uBeam: bgMat.uniforms.uBeam,
            uRes: bgMat.uniforms.uRes, uShock: velMat.uniforms.uShock, uN: bgMat.uniforms.uN },
          // Liquid-chrome flakes: per-particle shading in the vertex stage, sharp capsule in the fragment stage.
          // Premultiplied normal blending gives the cloud a dark body; glints add light without adding alpha.
          vertexShader: HASH + BEAM + `uniform sampler2D tPos, tVel; uniform float uTime, uSize, uN; uniform vec2 uLamp, uRes; uniform vec3 uBeam; uniform vec4 uShock; attribute vec2 ref;
            varying vec3 vCol, vGl; varying vec2 vDir; varying float vStr, vPS, vBlur;
            vec3 env(vec3 rd){
              float y = rd.y;
              vec3 navy = mix(vec3(.12, .13, .17), vec3(.08, .1, .16), uN), sky = mix(vec3(1.32, 1.34, 1.6), vec3(.62, .72, 1.), uN);
              vec3 c = y < 0. ? mix(navy * 2.4, navy, smoothstep(0., .5, -y)) : mix(sky * .6, sky, smoothstep(.1, .8, y));
              c += mix(vec3(1.6, 1.15, .78), vec3(.95, 1.05, 1.25), uN) * exp(-y * y * 40.);
              return c + mix(vec3(2.3, 2.1, 1.8), vec3(1.6, 1.75, 2.), uN) * smoothstep(.32, .06, length((rd.xy - vec2(.42, .5)) * vec2(1., 1.6)));
            }
            void main(){
              vec3 p = texture2D(tPos, ref).xyz, v = texture2D(tVel, ref).xyz;
              float spd = length(v), r1 = h(ref), r2 = h(ref + 1.3), r3 = h(ref + 2.7);
              vec4 mv = modelViewMatrix * vec4(p, 1.);
              gl_Position = projectionMatrix * mv;
              vec4 c1 = projectionMatrix * (modelViewMatrix * vec4(p + v * .1, 1.));
              vec2 sd = (c1.xy / c1.w - gl_Position.xy / gl_Position.w) * uRes;
              float a0 = r1 * 6.283 + uTime * (r2 - .5) * .5;
              vec2 rest = vec2(cos(a0), sin(a0)), vd = length(sd) > 1e-4 ? normalize(sd) : rest;

              for (let k = 0; k < 5; k++) burstSparks(hx - m.dx * L * k / 4, hy - m.dy * L * k / 4, 4);
              velMat.uniforms.uShock.value.set(0, CY, 0, simT); continue;
            }
            const gr = cx.createLinearGradient(hx, hy, hx - m.dx * L, hy - m.dy * L);
            gr.addColorStop(0, `rgba(235,240,255,${a})`); gr.addColorStop(1, "rgba(235,240,255,0)");
            cx.strokeStyle = gr; cx.beginPath(); cx.moveTo(hx, hy); cx.lineTo(hx - m.dx * L, hy - m.dy * L); cx.stroke();
          }
          // Ship lights
          const sa = clamp((tN - 0.4) * 4, 0, 1);
          if (sa > 0) ships.forEach((s, i) => {
            // Ship light: cursor path within 30 px → 0.56 s flare with halo, then Morse "AXON".
            if (s.m < 0 && tN > 0.4 && near(shipX[i], horY - 1, 30)) { s.m = fxT; chime(0.08); }
            let on = Math.sin(fxT * (1.1 + i * 0.4) + i * 2) > -0.8 ? 0.7 : 0.15, big = 1;
            if (s.m >= 0) {
              const u = (fxT - s.m) / 0.14 - 4; let acc = 0, k = 0;
              if (u < 0) { on = 1; big = 2.6; }
              else {
                for (; k < SEQ.length && acc + SEQ[k][1] <= u; k++) acc += SEQ[k][1];
                if (k >= SEQ.length) s.m = -1; else { on = SEQ[k][0]; big = 1.8; }
              }
              if (s.m >= 0) {
                const hr = big > 2 ? 40 : 26, hg = cx.createRadialGradient(shipX[i], horY - 1, 0, shipX[i], horY - 1, hr);
                hg.addColorStop(0, `rgba(255,232,190,${(on ? 0.5 : 0.12) * sa})`); hg.addColorStop(1, "rgba(255,232,190,0)");
                cx.fillStyle = hg; cx.beginPath(); cx.arc(shipX[i], horY - 1, hr, 0, 6.283); cx.fill();
              }
            }
            const a = on * sa;
            cx.fillStyle = `rgba(255,225,170,${a * 0.25})`; cx.beginPath(); cx.arc(shipX[i], horY - 1, 5 * big, 0, 6.283); cx.fill();
            cx.fillStyle = `rgba(255,242,215,${a})`; cx.beginPath(); cx.arc(shipX[i], horY - 1, 1.2 * big, 0, 6.283); cx.fill();
          });
          // Seabirds
          if (birds.length < 3 && rnd() < raw * 0.08) spawnBird();
          const bc = mixv([20, 18, 30, 0.8], [150, 160, 190, 0.45], tN);
          cx.strokeStyle = `rgba(${bc[0] | 0},${bc[1] | 0},${bc[2] | 0},${bc[3]})`; cx.lineWidth = 1.5; cx.lineCap = "round";
          for (let i = birds.length; i--; ) {
            const b = birds[i];
            // Seabird: cursor path within 50 px → startles away from the cursor, fast flaps, a few sparks.
            if (!b.flee && near(b.x, b.y, 50)) { b.flee = 1; b.vx = (Math.sign(b.x - px) || 1) * 300; b.vy = -170; b.fr = 18; burstSparks(b.x, b.y, 6); }
            b.ph += b.fr * raw; b.x += b.vx * raw; b.y += (b.vy + Math.sin(b.ph * 0.3) * 4) * raw;
            if (b.x < -60 || b.x > W + 60 || b.y < -60) { birds.splice(i, 1); continue; }
            const w = Math.sin(b.ph) * 0.6, s = b.s;
            cx.beginPath(); cx.moveTo(b.x - s, b.y - s * (0.3 + w)); cx.quadraticCurveTo(b.x - s * 0.45, b.y - s * 0.35, b.x, b.y);
            cx.quadraticCurveTo(b.x + s * 0.45, b.y - s * 0.35, b.x + s, b.y - s * (0.3 + w)); cx.stroke();
          }
          // Sparks
          cx.fillStyle = "rgba(225,232,245,.9)";
          for (let i = sparks.length; i--; ) {
            const p = sparks[i]; p.life -= raw;
            if (p.life <= 0) { sparks.splice(i, 1); continue; }
            p.vy += 200 * raw; p.x += p.vx * raw; p.y += p.vy * raw;
            cx.globalAlpha = p.life / 0.8; cx.fillRect(p.x - 1, p.y - 1, 2, 2);
          }
          cx.globalAlpha = 1;
          // Mercury beads
          const hov = hasMouse && ((px - poolX) / (poolR * 1.3)) ** 2 + ((py - poolY) / (poolR * 0.5)) ** 2 < 1, top = H * 0.75;
          if (hov && rnd() < raw * 1.2) addBead(4 + rnd() * 3);
          gvx *= Math.exp(-8 * raw); gvy *= Math.exp(-8 * raw);
          for (const b of beads) {
            b.jig *= Math.exp(-4 * raw);
            if (b === grab) { b.x = clamp(gpx, b.r, W - b.r); b.y = clamp(gpy, top + b.r, H - b.r); b.vx = gvx; b.vy = gvy; continue; }
            // Bead: cursor path within r+12 px while moving > 40 px/s → pushed by cursor velocity;
            // > 600 px/s marks it "hot" (merges on light contact); > 1500 px/s through a bead r > 8 splits it.
            if (pSpd > 40 && near(b.x, b.y, b.r + 12)) {
              const ax = b.x - px, ay = b.y - py, al = Math.hypot(ax, ay) || 1;
              b.vx = b.vx * 0.4 + pvx * 0.8 + (ax / al) * 60; b.vy = b.vy * 0.4 + pvy * 0.8 + (ay / al) * 60;
              if (pSpd > 600) b.hot = fxT;
              if (pSpd > 1500 && b.r > 8 && beads.length < 24 && fxT - (b.cd ?? -9) > 0.5) split(b, pvx, pvy);
            }
            const ex = (b.x - poolX) / poolR, ey = (b.y - poolY) / (poolR * 0.3), e = Math.hypot(ex, ey) || 1, k = e > 1 ? ((e - 1) * 260) / e : 0;
            b.vx += (-ex * k + (hov ? (rnd() - 0.5) * 120 : 0)) * dt; b.vy += (-ey * k * 0.6 + (hov ? (rnd() - 0.5) * 120 : 0)) * dt;
            const f = Math.exp(-1.8 * dt); b.vx *= f; b.vy *= f; b.x += b.vx * dt; b.y += b.vy * dt;
            if (b.x < b.r || b.x > W - b.r) { if (Math.abs(b.vx) > 200) chime(0.06); b.x = clamp(b.x, b.r, W - b.r); b.vx *= -0.6; }
            if (b.y < top + b.r || b.y > H - b.r) { if (Math.abs(b.vy) > 200) chime(0.06); b.y = clamp(b.y, top + b.r, H - b.r); b.vy *= -0.6; }
          }
          for (let i = 0; i < beads.length; i++) for (let j = i + 1; j < beads.length; j++) {
            const a = beads[i], b = beads[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, sr = a.r + b.r;
            if (d >= sr) continue;
            const nx = dx / d, ny = dy / d, rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny, ma = a.r * a.r, mb = b.r * b.r, M = ma + mb;
            const hot = fxT - (a.hot ?? -9) < 0.4 || fxT - (b.hot ?? -9) < 0.4, fresh = fxT - (a.cd ?? -9) < 0.5 || fxT - (b.cd ?? -9) < 0.5;
            if ((-rel > 150 || (hot && -rel > 30)) && !fresh && M < 676) {
              a.x = (a.x * ma + b.x * mb) / M; a.y = (a.y * ma + b.y * mb) / M; a.vx = (a.vx * ma + b.vx * mb) / M; a.vy = (a.vy * ma + b.vy * mb) / M;
              a.r = Math.sqrt(M); a.jig = 1; if (grab === b) grab = a;
              beads.splice(j--, 1); chime(0.12); continue;
            }
            const o = (sr - d) / 2; a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
            if (rel < 0) { const imp = (-1.7 * rel) / M; a.vx -= nx * imp * mb; a.vy -= ny * imp * mb; b.vx += nx * imp * ma; b.vy += ny * imp * ma; if (-rel > 70) chime(0.05); }
          }
          const sky = mixv([238, 238, 248], [178, 190, 215], tN), band = mixv([255, 238, 210], [218, 228, 248], tN), low = mixv([118, 122, 132], [82, 92, 112], tN), base = mixv([200, 204, 210], [172, 184, 204], tN);
          for (const b of beads) {
            const r = b.r * Math.min(1, (fxT - b.born) * 3), w = 1 + (hov ? 0.06 * Math.sin(fxT * 14 + b.ph) : 0) + b.jig * 0.15 * Math.sin(fxT * 30);
            if (r < 0.5) continue;
            cx.save(); cx.translate(b.x, b.y);
            cx.fillStyle = "rgba(0,0,0,.35)"; cx.beginPath(); cx.ellipse(0, r * 0.85, r * 0.95, r * 0.3, 0, 0, 6.283); cx.fill();
            cx.scale(w, 1 / w);
            const g = cx.createLinearGradient(0, -r, 0, r);
            g.addColorStop(0, rgb(sky)); g.addColorStop(0.42, rgb(sky, 0.82)); g.addColorStop(0.5, rgb(band)); g.addColorStop(0.6, rgb(low)); g.addColorStop(1, rgb(base));
            cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, r, 0, 6.283); cx.fill();
            cx.strokeStyle = "rgba(30,34,44,.35)"; cx.lineWidth = 1; cx.stroke();
            cx.strokeStyle = "rgba(255,255,255,.45)"; cx.lineWidth = 1.2; cx.beginPath(); cx.arc(0, 0, r - 1, 0.15, 2.99); cx.stroke();
            cx.fillStyle = "rgba(255,255,255,.95)"; cx.beginPath(); cx.ellipse(-r * 0.35, -r * 0.45, r * 0.26, r * 0.16, -0.5, 0, 6.283); cx.fill();
            cx.restore();
          }
        }

        // ---------- Loop ----------
        const clock = new THREE.Clock();
        let started = false, fq = 0, tq = 0, checked = false, hudT = 0, hf = 0, aimK = 0, aimA = Math.PI / 2;
        const wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));
        const info = document.getElementById("hInfo"), timeEl = document.getElementById("hTime");
        const fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
        const pad = (n) => String(Math.round(n)).padStart(4, "0");
        function frame() {
          const raw = clock.getDelta(), dt = Math.min(raw, 1 / 30);
          if (!checked && (fq++, (tq += raw) >= 3)) {
            checked = true;
            if (fq / tq < 40 && innerWidth >= 768 && SIZE > 256) { build(256); resize(); }
          }
          if (!entered) {
            prog = Math.max(0, Math.min(1, prog + (hold ? raw / 1.5 : -raw)));
            ring.style.strokeDashoffset = 289 * (1 - prog);
            if (prog >= 1) { entered = true; intro.classList.add("x-out"); document.body.classList.remove("x-pre"); }
          }
          const g = entered ? 1 : prog * prog * (3 - 2 * prog), time = simT;
          smooth.lerp(mouse, 0.06);
          downS += (down - downS) * 0.15;
          if (performance.now() - pts > 50) { const k = Math.exp(-12 * raw); pvx *= k; pvy *= k; }
          pSpd = hasMouse ? Math.hypot(pvx, pvy) : 0;
          const wpp = (12 * Math.tan(Math.PI / 8)) / innerHeight / points.scale.x, vk = Math.min(1, 14 / Math.max(pSpd * wpp, 1e-6));
          velMat.uniforms.uMVel.value.set(pvx * wpp * vk, -pvy * wpp * vk, 0).multiplyScalar(hasMouse ? 1 : 0);
          velMat.uniforms.uMSpd.value = Math.min(1, pSpd / 1800);

          if (!paused) {
            simT += dt;
            const vu = velMat.uniforms, pu = posMat.uniforms, nxt = 1 - cur;
            vu.tPos.value = pos[cur].texture; vu.tVel.value = vel[cur].texture;
            vu.uMouse.value.copy(mouseWorld()); vu.uDown.value = downS; vu.uTime.value = simT; vu.uDt.value = dt;
            vu.uGather.value = g; vu.uSpray.value = pu.uSpray.value = entered ? 1 : 0;
            pass(velMat, vel[nxt]);
            pu.tPos.value = pos[cur].texture; pu.tVel.value = vel[nxt].texture; pu.uDt.value = dt; pu.uTime.value = simT;
            pass(posMat, pos[nxt]);
            cur = nxt;
          }
          const bu = bgMat.uniforms;
          // Lighthouse: pointer inside the box around the lamp and tower → beam eases toward the cursor.
          const sweep = Math.PI / 2 + 1.5 * Math.sin((time * Math.PI) / 4), lx = bu.uLamp.value.x * innerWidth, ly = (1 - bu.uLamp.value.y) * innerHeight;
          const inLH = entered && hasMouse && Math.abs(px - lx) < 110 && py > ly - 120 && py < ly + innerHeight * 0.25;
          aimK += ((inLH ? 1 : 0) - aimK) * (1 - Math.exp(-3 * raw));
          if (inLH) aimA += wrapA(Math.atan2(ly - py, px - lx) - aimA) * (1 - Math.exp(-5 * raw));
          else if (aimK < 0.01) aimA = sweep;
          bu.uBeam.value.x = sweep + wrapA(aimA - sweep) * aimK;
          bu.uBeam.value.y = g;
          bu.uFade.value = g;

          hf++; hudT += raw;
          if (hudT >= 0.5) {
            info.textContent = `X ${pad(px)} Y ${pad(py)} · ${N.toLocaleString("en-US")} PTS · ${Math.round(hf / hudT)} FPS`;
            timeEl.textContent = fmt.format(new Date());
            hf = 0; hudT = 0;
          }
          fxStep(raw, dt);

          renderer.setRenderTarget(null);
          renderer.setClearColor(0x000000, 1);
          renderer.clear();
          if (started) {
            bgMat.uniforms.uTime.value = time;
            bgMat.uniforms.uMouse.value.copy(smooth);
            renderer.render(bgScene, orthoCam);
          }
          ptMat.uniforms.tPos.value = pos[cur].texture; ptMat.uniforms.tVel.value = vel[cur].texture; ptMat.uniforms.uTime.value = time;
          renderer.render(scene, camera);
          requestAnimationFrame(frame);
        }
        function onPlate() { plateTex.needsUpdate = true; started = true; }
        if (img.complete && img.naturalWidth) onPlate(); else img.addEventListener("load", onPlate);
        requestAnimationFrame(frame);
      })();
    </script>
