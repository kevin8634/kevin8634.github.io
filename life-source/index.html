<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生命源码 Life Source · 创世计划 04 · 生物</title>
<meta name="description" content="创世计划第 04 世界「生命源码」(生物):读懂生命写好的代码。从指纹放大到碱基对,亲手做遗传实验。免费、免注册。">
<meta name="theme-color" content="#060a12">
<link rel="stylesheet" href="ls.css">
<style>
html,body{overflow:hidden}
#atlas{position:fixed;inset:0}
#atlas canvas{width:100%;height:100%;display:block;touch-action:none}
#intro{position:fixed;inset:0;z-index:50;background:#060a12;transition:opacity 1s}
#intro canvas{width:100%;height:100%;display:block}
#intro .t{position:absolute;left:0;right:0;bottom:7%;text-align:center;opacity:0;transition:opacity 1.2s}
#intro .t h1{margin:0;font-size:clamp(30px,7vw,54px);letter-spacing:4px;color:#eef5f2}
#intro .t .en{color:var(--gold);letter-spacing:3px;font-size:14px;margin-top:4px}
#intro .t p{color:var(--mute);margin:10px 0 0;font-size:15px}
#intro .badge{position:absolute;right:16px;top:14px;color:var(--gold);font-size:13px;letter-spacing:1px}
#intro .badge b{display:inline-block;background:var(--em);color:#04120c;border-radius:6px;padding:1px 8px;margin-left:6px}
#skip{position:absolute;right:16px;bottom:24px}
#side{position:fixed;left:12px;top:60px;z-index:16;max-width:min(330px,calc(100% - 24px))}
#side h1{margin:0;font-size:20px}
#side .sub{color:var(--mute);font-size:13px;margin:2px 0 8px}
.task{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:12px;border:1px solid var(--line);margin-top:8px;background:rgba(6,10,18,.4)}
.task:hover{border-color:var(--em)}
.task .q{flex:1;font-size:14px;line-height:1.4}
.task .st{color:var(--gold);font-size:12px;white-space:nowrap}
#legend{position:fixed;right:12px;top:60px;z-index:16;font-size:11px;color:var(--mute);text-align:right;line-height:1.7}
#sheet{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:20;width:min(440px,calc(100% - 24px));display:none}
#sheet h3{margin:0 0 4px;font-size:16px}
#sheet .meta{font-size:12px;color:var(--mute);margin-bottom:6px}
#sheet p{margin:0 0 10px;font-size:14px;line-height:1.6}
#divebar{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:17}
#zoomov{position:fixed;inset:0;z-index:45;background:#060a12;display:none}
#zoomov .zi{position:absolute;left:12px;top:60px;z-index:3;max-width:min(360px,70vw)}
#zoomov .zi .obj{font-size:16px;font-weight:700}
#zoomov .zf{position:absolute;left:0;right:0;bottom:96px;text-align:center;color:var(--gold);z-index:3;text-shadow:0 1px 4px #000;padding:0 12px}
#zoomov .zc{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:3;display:flex;gap:10px;width:min(560px,92vw)}
#zoomov .zc input{flex:1;accent-color:#34d399}
#zoomov .x{position:absolute;right:12px;top:60px;z-index:3}
#side h1{cursor:pointer;user-select:none}
#side h1::after{content:' ▾';font-size:13px;color:var(--mute)}
#side.fold h1::after{content:' ▸'}
#side.fold #tasks,#side.fold .sub{display:none}
#scale{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:16;display:flex;flex-direction:column;align-items:center;gap:8px;user-select:none}
#scale .cap{font-size:12px;color:#ffe9b8;border:1px solid rgba(226,190,120,.7);border-radius:8px;padding:3px 8px;background:rgba(6,10,18,.7)}
#scale .rail{position:relative;height:min(52vh,420px);width:14px;border-radius:7px;border:1px solid rgba(226,190,120,.7);background:linear-gradient(#2a2412cc,#120e06cc);box-shadow:0 0 14px rgba(226,190,120,.35)}
#scale input{position:absolute;left:50%;top:50%;width:min(52vh,420px);transform:translate(-50%,-50%) rotate(-90deg);accent-color:#e2be78;margin:0;background:transparent}
#scale .ticks{position:absolute;inset:14px 0;pointer-events:none}
#scale .tk{position:absolute;right:24px;transform:translateY(-50%);pointer-events:auto;background:none;border:0;color:var(--mute);font:12px inherit;white-space:nowrap;cursor:pointer;padding:2px 4px}
#scale .tk.on{color:#bff5dc;text-shadow:0 0 8px #34d399}
#scale .lv{display:none}
#scale .all{font-size:12px;padding:4px 10px}
#legend{display:none}
#chain{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:16;display:flex;align-items:center;gap:2px;padding:6px 12px;border:1px solid rgba(110,231,183,.6);border-radius:10px;background:rgba(6,10,18,.75);box-shadow:0 0 16px rgba(52,211,153,.25);white-space:nowrap}
#chain button{background:none;border:0;color:#eefcf6;font:600 14px inherit;cursor:pointer;padding:2px 4px}
#chain button.on{color:#6ee7b7;text-shadow:0 0 8px #34d399}
#chain i{color:var(--mute);font-style:normal;font-size:12px}
@media (max-width:640px){#chain{bottom:84px;padding:4px 6px}#chain button{font-size:12px;padding:2px 1px}#chain i{font-size:10px}#scale{right:4px;top:auto;bottom:100px;transform:none}#scale .rail{height:26vh;width:26px}#scale input{width:26vh}#scale .cap,#scale .all{display:none}#scale .tk{font-size:11px;right:38px}#dive .long{display:none}#legend{display:none}#side{top:56px}.task{padding:6px 8px}}
</style></head><body>
<div id="lsi-pre" style="position:fixed;inset:0;z-index:49;background:#060a12"></div>
<div id="atlas"><canvas></canvas></div>
<div id="side" class="ls-panel">
  <h1>生命源码 <span class="ls-tag">04 · 生物</span></h1>
  <div class="sub">读懂生命写好的代码。点亮的星是可以玩的任务;拖动、双指或滚轮缩放可以探索。</div>
  <div id="tasks"></div>
</div>
<div id="legend"></div>
<div id="chain"></div>
<div id="scale"><div class="cap">穿越尺度</div><div class="rail"><input type="range" min="0" max="5" step="0.01" value="2.5" aria-label="穿越尺度:从分子到生态"><div class="ticks"></div></div><div class="lv">全景</div><button class="all ls-btn">全景</button></div>
<div id="sheet" class="ls-panel"></div>
<div id="divebar"><button class="ls-btn primary" id="dive">🔬 一镜到底<span class="long">:从指纹到碱基对</span></button></div>
<div id="zoomov"><div class="zw" style="position:absolute;inset:0"></div><div class="zi ls-panel"></div><div class="zf"></div>
  <button class="ls-btn x" id="zx">✕ 返回图谱</button>
  <div class="zc"><button class="ls-btn primary" id="zp">▶ 播放</button><input id="zs" type="range" min="0" max="5" step="0.001" value="0"></div></div>

<script type="module">
import { chrome, TASKS, taskStars, reducedMotion, sound, store } from './ls.js';
import { LAYERS, CONS, STARS } from './atlas-data.js';
import { mountAlbum, cards } from './ls-cards.js';
mountAlbum(chrome({ title: '' }).top);
const $ = s => document.querySelector(s);

/* ---------- 开场:编译生命(ls-intro.js) ---------- */
const pre = () => document.getElementById('lsi-pre')?.remove();
import('./ls-intro.js').then(m => { m.playIntro({ onDive: () => $('#dive').click() }); pre(); }).catch(pre);

/* ---------- 任务列表 ---------- */
for (const [id, t] of Object.entries(TASKS)) {
  const a = document.createElement('a'); a.className = 'task'; a.href = `${id}/`;
  a.innerHTML = `<span class="q"></span><span class="st">★ ${taskStars(id)}/${t.levels * 3}</span>`;
  a.querySelector('.q').textContent = t.title; $('#tasks').append(a);
}
$('#legend').innerHTML = Object.values(CONS).map(c => `<span style="color:${c.color}">●</span> ${c.name}`).join('<br>');

/* ---------- 图谱(ls-atlas.js) ---------- */
const { createAtlas } = await import('./ls-atlas.js');
const showSheet = s => {
  const sh = $('#sheet');
  if (!s) { sh.style.display = 'none'; $('#divebar').style.display = ''; return; }
  const c = CONS[s.con];
  if (s.task) sound.sparkle(5); else sound.tone(587.33 * 2 ** (s.layer / 5), .5, { gain: .1 });
  sh.innerHTML = `<h3></h3><div class="meta">${LAYERS[s.layer]}层 · <span style="color:${c.color}">${c.name}</span>座</div><p></p><div class="ls-actions"></div>`;
  sh.querySelector('h3').textContent = s.name;
  sh.querySelector('p').textContent = s.task ? `任务 · ★ ${taskStars(s.task)}/${TASKS[s.task].levels * 3}` : s.soon ? '这颗星即将点亮,下一批任务正在制作中。' : s.note;
  const act = sh.querySelector('.ls-actions');
  if (s.task) { const a = document.createElement('a'); a.className = 'ls-btn primary'; a.style.textDecoration = 'none'; a.textContent = '出发 ›'; a.href = `${s.task}/`; act.append(a); }
  const x = document.createElement('button'); x.className = 'ls-btn'; x.textContent = '关闭'; x.onclick = () => { showSheet(null); atlas.clear(); }; act.append(x);
  sh.style.display = 'block'; $('#divebar').style.display = 'none';
};
const atlas = createAtlas($('#atlas canvas'), {
  onSelect: showSheet,
  onBridge: br => { location.href = br.href; },
  isDone: id => taskStars(id) > 0,
  litCon: k => STARS.some(st => st.task && st.con === k && Object.keys(cards()[st.task] || {}).length >= TASKS[st.task].levels),
});
/* 尺度滑杆:滑杆 = 穿越尺度(上 生态 … 下 分子) */
const sc = $('#scale'), si = $('#scale input'), sl = $('#scale .lv');
const setL = v => { const i = Math.round(v); atlas.setFocus(i); sl.textContent = i < 0 ? '全景' : LAYERS[i]; document.querySelectorAll('#scale .tk,#chain button').forEach(t => t.classList.toggle('on', +t.dataset.i === i)); if (i >= 0) si.value = i; };
LAYERS.forEach((n, i) => { if (i) $('#chain').insertAdjacentHTML('beforeend', '<i>→</i>'); const b = document.createElement('button'); b.dataset.i = i; b.textContent = n; b.onclick = () => setL(atlas.focus === i ? -1 : i); $('#chain').append(b); });
LAYERS.forEach((n, i) => { const t = document.createElement('button'); t.className = 'tk'; t.dataset.i = i; t.textContent = n; t.style.top = `${(5 - i) / 5 * 100}%`; t.onclick = () => { si.value = i; setL(i); }; $('#scale .ticks').append(t); });
let lastI = -2; si.oninput = () => { const i = Math.round(+si.value); if (i !== lastI) { lastI = i; setL(i); } };
$('#scale .all').onclick = () => { lastI = -1; setL(-1); };
/* 任务面板:手机端默认收起 */
const sideT = $('#side h1'); sideT.onclick = () => $('#side').classList.toggle('fold');
$('#side').classList.add('fold');

/* ---------- 一镜到底浮层 ---------- */
let zm = null;
$('#dive').onclick = async () => {
  $('#zoomov').style.display = 'block';
  if (!zm) {
    const { createZoom, FACTS } = await import('./ls-zoom.js');
    zm = createZoom($('#zoomov .zw'), { onLevel(i, L) {
      $('#zoomov .zi').innerHTML = `<div style="color:var(--gold);font-size:12px">观察方式 · ${L.tool}</div><div class="obj">${L.obj}</div><div style="font-size:12px;color:var(--mute)">比例尺 ${L.bar} ${L.tag ? `<span class="ls-tag">${L.tag}</span>` : ''}</div>`;
      $('#zoomov .zf').textContent = FACTS[i] || '';
    } });
    const sl = $('#zs'); sl.oninput = () => zm.setZ(+sl.value);
    setInterval(() => { if (document.activeElement !== sl && zm) sl.value = zm.z; }, 120);
    $('#zp').onclick = () => zm.dive({ from: zm.z > 4.9 ? 0 : Math.round(zm.z) });
  }
  zm.dive({ from: 0 });
};
$('#zx').onclick = () => { $('#zoomov').style.display = 'none'; };
</script>
</body></html>
