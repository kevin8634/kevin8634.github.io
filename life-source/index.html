<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生命源码 Life Source · 创世计划 04 · 生物</title>
<meta name="description" content="创世计划第 04 世界「生命源码」(生物):读懂生命写好的代码。从指纹放大到碱基对,亲手做遗传实验。免费、免注册。">
<meta name="theme-color" content="#060a12">
<link rel="stylesheet" href="ls.css">
<style>
html,body{overflow:hidden}
#atlas{position:fixed;inset:0}
#atlas canvas{width:100%;height:100%;display:block;touch-action:none}
#intro{position:fixed;inset:0;z-index:50;background:#060a12;transition:opacity 1s}
#intro canvas{width:100%;height:100%;display:block}
#intro .t{position:absolute;left:0;right:0;bottom:7%;text-align:center;opacity:0;transition:opacity 1.2s}
#intro .t h1{margin:0;font-size:clamp(30px,7vw,54px);letter-spacing:4px;color:#eef5f2}
#intro .t .en{color:var(--gold);letter-spacing:3px;font-size:14px;margin-top:4px}
#intro .t p{color:var(--mute);margin:10px 0 0;font-size:15px}
#intro .badge{position:absolute;right:16px;top:14px;color:var(--gold);font-size:13px;letter-spacing:1px}
#intro .badge b{display:inline-block;background:var(--em);color:#04120c;border-radius:6px;padding:1px 8px;margin-left:6px}
#skip{position:absolute;right:16px;bottom:24px}
#side{position:fixed;left:12px;top:60px;z-index:16;max-width:min(330px,calc(100% - 24px))}
#side h1{margin:0;font-size:20px}
#side .sub{color:var(--mute);font-size:13px;margin:2px 0 8px}
.task{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:12px;border:1px solid var(--line);margin-top:8px;background:rgba(6,10,18,.4)}
.task:hover{border-color:var(--em)}
.task .q{flex:1;font-size:14px;line-height:1.4}
.task .st{color:var(--gold);font-size:12px;white-space:nowrap}
#legend{position:fixed;right:12px;top:60px;z-index:16;font-size:11px;color:var(--mute);text-align:right;line-height:1.7}
#sheet{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:20;width:min(440px,calc(100% - 24px));display:none}
#sheet h3{margin:0 0 4px;font-size:16px}
#sheet .meta{font-size:12px;color:var(--mute);margin-bottom:6px}
#sheet p{margin:0 0 10px;font-size:14px;line-height:1.6}
#divebar{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:17}
#zoomov{position:fixed;inset:0;z-index:45;background:#060a12;display:none}
#zoomov .zi{position:absolute;left:12px;top:60px;z-index:3;max-width:min(360px,70vw)}
#zoomov .zi .obj{font-size:16px;font-weight:700}
#zoomov .zf{position:absolute;left:0;right:0;bottom:96px;text-align:center;color:var(--gold);z-index:3;text-shadow:0 1px 4px #000;padding:0 12px}
#zoomov .zc{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:3;display:flex;gap:10px;width:min(560px,92vw)}
#zoomov .zc input{flex:1;accent-color:#34d399}
#zoomov .x{position:absolute;right:12px;top:60px;z-index:3}
@media (max-width:640px){#dive .long{display:none}#legend{display:none}#side{top:56px}.task{padding:6px 8px}}
</style></head><body>
<div id="lsi-pre" style="position:fixed;inset:0;z-index:49;background:#060a12"></div>
<div id="atlas"><canvas></canvas></div>
<div id="side" class="ls-panel">
  <h1>生命源码 <span class="ls-tag">04 · 生物</span></h1>
  <div class="sub">读懂生命写好的代码。点亮的星是可以玩的任务;拖动、双指或滚轮缩放可以探索。</div>
  <div id="tasks"></div>
</div>
<div id="legend"></div>
<div id="sheet" class="ls-panel"></div>
<div id="divebar"><button class="ls-btn primary" id="dive">🔬 一镜到底<span class="long">:从指纹到碱基对</span></button></div>
<div id="zoomov"><div class="zw" style="position:absolute;inset:0"></div><div class="zi ls-panel"></div><div class="zf"></div>
  <button class="ls-btn x" id="zx">✕ 返回图谱</button>
  <div class="zc"><button class="ls-btn primary" id="zp">▶ 播放</button><input id="zs" type="range" min="0" max="5" step="0.001" value="0"></div></div>

<script type="module">
import { chrome, TASKS, taskStars, reducedMotion, sound, store } from './ls.js';
import { LAYERS, CONS, STARS } from './atlas-data.js';
chrome({ title: '' });
const $ = s => document.querySelector(s);

/* ---------- 开场:编译生命(ls-intro.js) ---------- */
const pre = () => document.getElementById('lsi-pre')?.remove();
import('./ls-intro.js').then(m => { m.playIntro(); pre(); }).catch(pre);

/* ---------- 任务列表 ---------- */
for (const [id, t] of Object.entries(TASKS)) {
  const a = document.createElement('a'); a.className = 'task'; a.href = `${id}/`;
  a.innerHTML = `<span class="q"></span><span class="st">★ ${taskStars(id)}/${t.levels * 3}</span>`;
  a.querySelector('.q').textContent = t.title; $('#tasks').append(a);
}
$('#legend').innerHTML = Object.values(CONS).map(c => `<span style="color:${c.color}">●</span> ${c.name}`).join('<br>');

/* ---------- 图谱 ---------- */
const cv = $('#atlas canvas'), g = cv.getContext('2d');
let W, H, D, pts = [], sel = null, hover = null, rip = null;
const V = { s: 1, ox: 0, oy: 0 }; // 视图:缩放与平移
const T = (x, y) => [(x - W / 2) * V.s + W / 2 + V.ox, (y - H / 2) * V.s + H / 2 + V.oy];
const bg = []; for (let i = 0; i < 260; i++) bg.push([Math.random(), Math.random(), Math.random()]);
function layout() {
  D = devicePixelRatio; W = cv.width = innerWidth * D; H = cv.height = innerHeight * D;
  const narrow = innerWidth < 640, top = (narrow ? 250 : 90) * D, bottom = H - 96 * D, left = (narrow ? 50 : 380) * D, right = W - (narrow ? 20 : 120) * D;
  const lh = (bottom - top) / LAYERS.length;
  pts = STARS.map((s, i) => ({ s, x: left + s.x * (right - left), y: bottom - (s.layer + .5) * lh + Math.sin(i * 2.3) * lh * .22 }));
  layout.m = { top, bottom, left, right, lh };
}
function draw(now = 0) {
  const { top, bottom, left, right, lh } = layout.m;
  g.clearRect(0, 0, W, H);
  for (const [x0, y0, z] of bg) { const x = ((x0 + V.ox / W * z * .3) % 1 + 1) % 1, y = ((y0 + V.oy / H * z * .3) % 1 + 1) % 1; g.fillStyle = `rgba(200,255,230,${.15 + z * .35 * (reducedMotion() ? 1 : (.6 + .4 * Math.sin(now / 900 + z * 20)))})`; g.fillRect(x * W, y * H, 1.2 * D, 1.2 * D); }
  LAYERS.forEach((name, i) => {
    const y = T(0, bottom - (i + 1) * lh)[1], lhs = lh * V.s;
    g.strokeStyle = 'rgba(110,231,183,.08)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    g.fillStyle = 'rgba(148,163,168,.75)'; g.font = `${12 * D}px "PingFang SC","Noto Sans SC",sans-serif`; g.fillText(name, 8 * D, y + lhs / 2 + 4 * D);
  });
  // 星座连线(最小生成树,避免长线交叉)
  for (const k of Object.keys(CONS)) {
    const ps = pts.filter(p => p.s.con === k); if (ps.length < 2) continue;
    const focus = (hover || sel) && (hover || sel).s.con, on = focus === k;
    const inT = [ps[0]], out = ps.slice(1); g.strokeStyle = CONS[k].color + (on ? 'dd' : focus ? '22' : '55'); g.lineWidth = (on ? 2.2 : 1.2) * D; g.beginPath();
    while (out.length) {
      let bi = 0, bj = 0, bd = Infinity;
      inT.forEach((a, i) => out.forEach((b, j) => { const d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2; if (d < bd) { bd = d; bi = i; bj = j; } }));
      const a = inT[bi], b = out.splice(bj, 1)[0]; g.moveTo(...T(a.x, a.y)); g.lineTo(...T(b.x, b.y)); inT.push(b);
    }
    g.stroke();
  }
  if (rip) { const k = (now - rip.t) / 900; if (k > 1) rip = null; else { const [rx, ry] = T(rip.p.x, rip.p.y); for (const d of [0, .25]) { const kk = Math.max(0, k - d); g.beginPath(); g.arc(rx, ry, (8 + kk * 70) * D, 0, 7); g.strokeStyle = CONS[rip.p.s.con].color; g.globalAlpha = (1 - kk) * .8; g.lineWidth = 2 * D; g.stroke(); } g.globalAlpha = 1; } }
  for (const p0 of pts) {
    const [X, Y] = T(p0.x, p0.y), p = { ...p0, x: X, y: Y };
    const c = CONS[p.s.con].color, isTask = !!p.s.task, r = (isTask ? 7 : p.s.soon ? 5 : 3.2) * D;
    const pulse = isTask && !reducedMotion() ? 1 + .25 * Math.sin(now / 500) : 1;
    g.globalAlpha = p.s.soon ? .45 : 1;
    g.beginPath(); g.arc(p.x, p.y, r * pulse, 0, 7); g.fillStyle = c; g.shadowColor = c; g.shadowBlur = (isTask ? 22 : 8) * D; g.fill(); g.shadowBlur = 0;
    if (isTask || p.s.soon) { g.beginPath(); g.arc(p.x, p.y, r * 2.1, 0, 7); g.strokeStyle = c; g.lineWidth = 1.2 * D; g.setLineDash(p.s.soon ? [3 * D, 3 * D] : []); g.stroke(); g.setLineDash([]); }
    if (isTask || p0 === hover || p0 === sel || V.s > 1.8) { g.fillStyle = '#eef5f2'; g.font = `${(isTask ? 13 : 12) * D}px "PingFang SC","Noto Sans SC",sans-serif`; const label = isTask ? p.s.name : p.s.name; const tw = g.measureText(label).width; g.fillText(label, Math.min(Math.max(p.x - tw / 2, 6 * D), W - tw - 6 * D), p.y - r * 2.4 - 4 * D); }
    g.globalAlpha = 1;
  }
  requestAnimationFrame(draw);
}
const near = e => { const x = e.clientX * D, y = e.clientY * D; let best = null, bd = (26 * D) ** 2; for (const p of pts) { const [px, py] = T(p.x, p.y), d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = p; } } return best; };
cv.addEventListener('pointermove', e => { hover = near(e); cv.style.cursor = hover ? 'pointer' : ''; });
cv.addEventListener('click', e => {
  if (moved) return;
  sel = near(e); if (sel) rip = { p: sel, t: performance.now() }; const sh = $('#sheet');
  if (!sel) { sh.style.display = 'none'; $('#divebar').style.display = ''; return; }
  const s = sel.s, c = CONS[s.con];
  if (s.task) sound.sparkle(5); else sound.tone(587.33 * 2 ** (s.layer / 5), .5, { gain: .1 });
  sh.innerHTML = `<h3></h3><div class="meta">${LAYERS[s.layer]}层 · <span style="color:${c.color}">${c.name}</span>座</div><p></p><div class="ls-actions"></div>`;
  sh.querySelector('h3').textContent = s.name;
  sh.querySelector('p').textContent = s.task ? `任务 · ★ ${taskStars(s.task)}/${TASKS[s.task].levels * 3}` : s.soon ? '这颗星即将点亮,下一批任务正在制作中。' : s.note;
  const act = sh.querySelector('.ls-actions');
  if (s.task) { const a = document.createElement('a'); a.className = 'ls-btn primary'; a.style.textDecoration = 'none'; a.textContent = '出发 ›'; a.href = `${s.task}/`; act.append(a); }
  const x = document.createElement('button'); x.className = 'ls-btn'; x.textContent = '关闭'; x.onclick = () => { sh.style.display = 'none'; $('#divebar').style.display = ''; sel = null; }; act.append(x);
  sh.style.display = 'block'; $('#divebar').style.display = 'none';
});
addEventListener('resize', layout); layout(); requestAnimationFrame(draw);
/* 手势:拖动平移、双指或滚轮缩放(以手指/光标为中心)、双击复位 */
const ptr = new Map(); let moved = false, pinch0 = null;
const zoomAt = (f, cx, cy) => { const s2 = Math.min(3.2, Math.max(1, V.s * f)), k = s2 / V.s; V.ox = cx - W / 2 - (cx - W / 2 - V.ox) * k; V.oy = cy - H / 2 - (cy - H / 2 - V.oy) * k; V.s = s2; clampV(); };
const clampV = () => { const m = (V.s - 1) / 2 + .15; V.ox = Math.max(-W * m, Math.min(W * m, V.ox)); V.oy = Math.max(-H * m, Math.min(H * m, V.oy)); if (V.s === 1) { V.ox *= .5; V.oy *= .5; } };
cv.addEventListener('pointerdown', e => { ptr.set(e.pointerId, [e.clientX, e.clientY]); moved = false; if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: V.s }; } });
cv.addEventListener('pointermove', e => {
  const q = ptr.get(e.pointerId); if (!q) return;
  if (ptr.size === 1) { const dx = e.clientX - q[0], dy = e.clientY - q[1]; if (Math.abs(dx) + Math.abs(dy) > 2) moved = true; if (moved) { V.ox += dx * D; V.oy += dy * D; clampV(); } }
  ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptr.size === 2 && pinch0) { const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); moved = true; zoomAt(pinch0.s * d / pinch0.d / V.s, (a[0] + b[0]) / 2 * D, (a[1] + b[1]) / 2 * D); }
});
const up = e => { ptr.delete(e.pointerId); if (ptr.size < 2) pinch0 = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX * D, e.clientY * D); }, { passive: false });
cv.addEventListener('dblclick', () => { V.s = 1; V.ox = V.oy = 0; sound.whoosh(.6, false); });

/* ---------- 一镜到底浮层 ---------- */
let zm = null;
$('#dive').onclick = async () => {
  $('#zoomov').style.display = 'block';
  if (!zm) {
    const { createZoom, FACTS } = await import('./ls-zoom.js');
    zm = createZoom($('#zoomov .zw'), { onLevel(i, L) {
      $('#zoomov .zi').innerHTML = `<div style="color:var(--gold);font-size:12px">观察方式 · ${L.tool}</div><div class="obj">${L.obj}</div><div style="font-size:12px;color:var(--mute)">比例尺 ${L.bar} ${L.tag ? `<span class="ls-tag">${L.tag}</span>` : ''}</div>`;
      $('#zoomov .zf').textContent = FACTS[i] || '';
    } });
    const sl = $('#zs'); sl.oninput = () => zm.setZ(+sl.value);
    setInterval(() => { if (document.activeElement !== sl && zm) sl.value = zm.z; }, 120);
    $('#zp').onclick = () => zm.dive({ from: zm.z > 4.9 ? 0 : Math.round(zm.z) });
  }
  zm.dive({ from: 0 });
};
$('#zx').onclick = () => { $('#zoomov').style.display = 'none'; };
</script>
</body></html>
