<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>JARVIS singularity speaking</title>
  <defs>
    <clipPath id="back"><rect x="0" y="0" width="512" height="262"/></clipPath>
    <clipPath id="front"><rect x="0" y="262" width="512" height="250"/></clipPath>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.28" stop-color="#FFE7B0" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#FFD58A" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FF8A3D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3A6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A2E" stop-opacity="0.15"/>
      <stop offset="0.3" stop-color="#FFC56B"/>
      <stop offset="0.5" stop-color="#FFF4DA"/>
      <stop offset="0.7" stop-color="#FFC56B"/>
      <stop offset="1" stop-color="#FF7A2E" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB45C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFE9C2"/>
      <stop offset="1" stop-color="#FFB45C" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>
  <g fill="none" stroke="#9FD8FF" stroke-width="2.5">
    <circle cx="256" cy="256" r="70"><animate attributeName="r" values="64;200" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="256" cy="256" r="70"><animate attributeName="r" values="64;200" dur="1.5s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="1.5s" begin="0.75s" repeatCount="indefinite"/></circle>
  </g>
  <!-- accretion disk (near side), swirling -->
  <g filter="url(#soft)" clip-path="url(#back)" opacity="0.9">
    <ellipse cx="256" cy="262" rx="190" ry="26" fill="none" stroke="url(#disk)" stroke-width="12"/>
    <ellipse cx="256" cy="262" rx="150" ry="18" fill="none" stroke="#FFE2A8" stroke-width="3" stroke-dasharray="40 26 12 30" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-216" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="256" cy="262" rx="210" ry="30" fill="none" stroke="#FF9A4A" stroke-width="2" stroke-dasharray="18 40 6 50" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-228" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- lensed far side of disk: arcs over and under the shadow -->
  <g filter="url(#soft)" fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M172 262 A84 100 0 0 1 340 262" stroke-width="9"/>
    <path d="M184 262 A72 80 0 0 0 328 262" stroke-width="4" opacity="0.65"/>
  </g>
  <!-- photon ring -->
  <circle cx="256" cy="256" r="66" fill="none" stroke="#FFF1D2" stroke-width="5" filter="url(#soft)"><animate attributeName="stroke-width" values="5;9;5" dur="0.6s" repeatCount="indefinite"/></circle>
  <!-- event horizon shadow -->
  <circle cx="256" cy="256" r="60" fill="#05060B"/>
  <!-- accretion disk (near side), swirling -->
  <g filter="url(#soft)" clip-path="url(#front)">
    <ellipse cx="256" cy="262" rx="190" ry="26" fill="none" stroke="url(#disk)" stroke-width="12"/>
    <ellipse cx="256" cy="262" rx="150" ry="18" fill="none" stroke="#FFE2A8" stroke-width="3" stroke-dasharray="40 26 12 30" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-216" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="256" cy="262" rx="210" ry="30" fill="none" stroke="#FF9A4A" stroke-width="2" stroke-dasharray="18 40 6 50" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-228" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
