(function () {

    if (!CU.c.isConnected) return; var x = CU.x, W = CU.W, H = CU.H; x.clearRect(0, 0, W, H);

      x.fillStyle = '#d8d0e6'; x.font = '11px system-ui'; x.textAlign = 'right'; x.fillText('n=' + n, W * 0.16, y + 4); x.textAlign = 'left'; x.fillStyle = 'rgba(200,200,220,.7)'; x.fillText(FW.En(n).toFixed(2) + ' eV', W * 0.68, y + 4); }
    x.fillStyle = 'rgba(200,200,220,.55)'; x.font = '10px system-ui'; x.textAlign = 'left'; x.fillText('台阶间距为示意(非等比)', 6, 14);

    photons = photons.filter(function (p) { p.x += EF.reduced ? 30 : 2.2; p.l -= 0.008; var vis = p.nm >= 380 && p.nm <= 780, c = vis ? FW.wl(p.nm) : [180, 160, 255];
      x.strokeStyle = FW.css(c, vis ? 1 : 0.5); x.lineWidth = 2; x.beginPath(); for (var i = 0; i < 26; i++) { var xx = p.x - i * 2, yy = p.y + Math.sin((xx) / (p.nm / 60)) * 5; i ? x.lineTo(xx, yy) : x.moveTo(xx, yy); } x.stroke(); x.lineWidth = 1;

  var CM = EF.canvas(T.pane.macro, 270);

/* ---------- L3 光谱认元素(三窗联动) ---------- */
var ROUNDS = [{ ks: ['Sr', 'Cu'], q: '一朵<b style="color:#c06cff">紫色</b>烟花。' }, { ks: ['Na', 'Ba'], q: '一朵<b style="color:#d6ff4a">黄绿色</b>烟花。' }, { ks: ['Li', 'K'], q: '一朵<b style="color:#ff6fb8">粉紫色</b>的虚拟烟花(练习用:真实火焰里钾的浅紫很弱,会被锂的红光盖住,肉眼几乎看不出来)。' }];

    b.classList.toggle('on', p.indexOf(k) > -1); EF.play('tick'); EF.tone(BY[k].z % 21 + 1, 0, 0.15); T.set({ pick: p }, 'ctl'); }; });
  ctl.querySelector('#chk').onclick = function () {
    if (done) return; var want = ROUNDS[st.r].ks, p = st.pick, ok = p.length === want.length && want.every(function (k) { return p.indexOf(k) > -1; });

      if (st.r === ROUNDS.length - 1) { done = true; msg.innerHTML = '三朵都认出来了!只看光就能知道里面有什么元素。天文学家用的是同一把"尺子":星光彩带里缺掉的几条<b>暗线</b>,正好落在这些元素亮线的位置上。'; setTimeout(api.complete, 1700); }
      else { setTimeout(function () { ctl.querySelectorAll('.chip').forEach(function (z) { z.classList.remove('on'); }); T.set({ r: st.r + 1, pick: [] }, 'ctl'); intro(); }, 1100); msg.innerHTML = '完全对上!这朵烟花是' + want.map(function (k) { return BY[k].n; }).join(' + ') + '。' + (want.indexOf('Na') > -1 ? '钠的黄光特别亮,真实火焰里一点点就会盖过别的颜色。' : ''); } }
    else { miss++; EF.play('tick'); var extra = p.filter(function (k) { return want.indexOf(k) < 0; }), lack = want.filter(function (k) { return p.indexOf(k) < 0; });
      msg.innerHTML = (extra.length ? '多了一些烟花里没有的谱线。' : '') + (lack.length ? '烟花的光谱里还有没对上的线或亮带。' : '') + '看看哪些亮线没有被你选的元素"解释"。';
      if (miss >= 2) api.say('一条一条对:先找最亮的那片颜色,是哪种元素的指纹?'); }
  };

  var CM = EF.canvas(T.pane.macro, 260), BB = [], last = 0;
  (function loop(t) {

var LEVELS = [
  { title: '夜空点单', setup: pick(L0, 'L0'), task: '七颗颜色星各放一朵虚拟烟花,再按订单放出绿色、黄色、蓝色的烟花。',

    ask: { q: '锂和锶的火焰都是红色的。怎样把它们分开?', opts: ['分不开', '用分光镜看它们的光谱', '闻气味'], ok: 1 },
