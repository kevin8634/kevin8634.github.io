<script>
/* ---------- 共享数据与水果电池控制器(2D/3D 共用) ---------- */
(function () {
/* 水果电池用的三种金属。p 为"柠檬里"的相对电位(示意,使 锌-铜≈0.9 V、铁-铜≈0.5 V、锌-铁≈0.4 V) */
var FM = [{ k: 'Zn', n: '锌片', c: '#9fb3c8', p: 0 }, { k: 'Cu', n: '铜片', c: '#e08a4a', p: 0.9 }, { k: 'Fe', n: '铁钉', c: '#6f7480', p: 0.4 }];
var FBY = {}; FM.forEach(function (m) { FBY[m.k] = m; });
/* 金属梯子:标准电极电势 E°(V,25 °C,各金属在自己 1 mol/L 的盐溶液里;Fe 指 Fe²⁺/Fe) */
var LAD = [{ k: 'Mg', n: '镁', E: -2.37, c: '#c8d0d8' }, { k: 'Zn', n: '锌', E: -0.76, c: '#9fb3c8' }, { k: 'Fe', n: '铁', E: -0.44, c: '#6f7480' }, { k: 'Cu', n: '铜', E: 0.34, c: '#e08a4a' }, { k: 'Ag', n: '银', E: 0.80, c: '#e6e9ee' }];
var LBY = {}; LAD.forEach(function (m) { LBY[m.k] = m; });
var DANGER = '<b style="color:#ff7a7a">锂电池实验请勿在现实中尝试!</b><br>这里的扎破、过充都是虚拟的。真锂电池不要拆、扎、压、摔、烧,不要泡水,也不要放在暴晒的车里或暖气旁。鼓包、发烫、有怪味或冒烟时立刻停用,人离开它,别用手去碰,告诉大人;起火时马上离开房间并拨打 119(烟有毒)。用合格的原装充电器,线破了不要用,别整夜放在床上或枕边充电。电动自行车和它的电池不要推进楼道、电梯,也不要带回家充电。纽扣电池要放在小孩够不着的地方:万一吞下,不要催吐、不要吃喝,立刻去医院,带上电池包装。新旧电池、不同牌子的电池不要混着用;普通干电池不能充电。废锂电池、纽扣电池属于有害垃圾:先用胶带贴住两极,再投进有害垃圾桶或电池回收点。不要把导线插进墙上的插座,也不要用金属把电池两极直接连起来(短路会发烫)。水果电池可以在大人陪同下用锌片、铜片做:金属片边缘可能很锋利,做完洗手,做过实验的水果不要吃。';
var SAFE = '<b style="color:#ff9a7a">安全常识</b>:水果电池可以在大人陪同下做,金属片边缘可能锋利,做完洗手,做过实验的水果不要吃;镁、银这些组合只在屏幕里试。锂电池不要拆、扎、压、烧;鼓包、发烫时立刻停用并告诉大人。';
function txt(stage, h, cls) { var p = document.createElement('p'); p.className = cls || 'note-sm'; p.innerHTML = h || ''; stage.appendChild(p); return p; }
function card(stage, h, warn) { var d = document.createElement('div'); d.className = 'cab-card' + (warn ? ' warn' : ''); d.innerHTML = h; stage.appendChild(d); return d; }

/* L0 控制器:view(stage) 先挂出画面,再生成控件、说明、安全卡;每次状态改变调用 view.draw(st) */
var LED_ON = 2.4;
function lemon(stage, api, view) {
  var st = { a: 'Cu', b: 'Cu', n: 1, V: 0, led: false, done: false, tried: {} };
  view.mount(stage);
  var ctl = document.createElement('div'); ctl.className = 'ctl chips';
  function seg(id, lab) { return '<span>' + lab + '</span><span class="seg" id="' + id + '">' + FM.map(function (m) { return '<button data-v="' + m.k + '"' + (st[id] === m.k ? ' class="on"' : '') + '>' + m.n + '</button>'; }).join('') + '</span>'; }
  ctl.innerHTML = seg('a', '左边(接 COM 黑表笔)') + seg('b', '右边(接红表笔)') + '<span class="seg" id="nn"><button data-d="-1">− 拿走柠檬</button><button data-d="1">+ 串一个柠檬</button></span>';
  stage.appendChild(ctl);
  var msg = txt(stage, '两片一样的铜片插在柠檬里,电压表几乎不动。换一换金属,让电压表的指针动起来。');
  card(stage, DANGER, true);
  ['a', 'b'].forEach(function (id) { ctl.querySelectorAll('#' + id + ' button').forEach(function (b) { b.onclick = function () { ctl.querySelectorAll('#' + id + ' button').forEach(function (z) { z.classList.toggle('on', z === b); }); st[id] = b.dataset.v; EF.play('tick'); upd(); }; }); });
  ctl.querySelectorAll('#nn button').forEach(function (b) { b.onclick = function () { var n = Math.max(1, Math.min(4, st.n + (+b.dataset.d))); if (n === st.n) { EF.play('tick'); msg.innerHTML = n === 4 ? '桌上最多放 4 个柠檬。' : '至少要 1 个柠檬。'; return; } st.n = n; EF.play('select'); upd(); }; });
  function upd() {
    if (st.done) return;
    var A = FBY[st.a], B = FBY[st.b], cell = Math.round((B.p - A.p) * 100) / 100; st.V = Math.round(cell * st.n * 100) / 100; st.led = st.V >= LED_ON;
    st.tried[[st.a, st.b].sort().join('')] = 1;
    var vs = (st.V < 0 ? '−' : '') + Math.abs(st.V).toFixed(2) + ' V';
    if (cell === 0) msg.innerHTML = '两片都是' + A.n.slice(0, 1) + ':读数 ' + vs + '。一样的金属"交出电子"的本领一样,谁也推不动谁,电压是 0。';
    else if (cell < 0) msg.innerHTML = '读数 <b>' + vs + '</b>:负号说明表笔接反了——交出电子的那片(更活泼的' + (A.p > B.p ? B.n : A.n) + ')应该放在左边接黑表笔。' + (st.n > 1 ? 'LED 只让电流朝一个方向走,接反不会亮。' : '');
    else if (st.led) {
      st.done = true; EF.play('fuse'); EF.tone(12);
      msg.innerHTML = st.n + ' 个柠檬串起来:<b>' + vs + '</b>,红色 LED 微微亮了!(水果电池电流很小,真实的灯只是暗暗的一点光)每个柠檬的电压加在一起——这就是<b>串联</b>。';
      setTimeout(api.complete, 1700);
    } else if (st.n === 1) msg.innerHTML = A.n + ' + ' + B.n + ':一个柠檬 <b>' + vs + '</b>。指针动了!可是红色 LED 要接近 2 V 才开始导通;水果电池内阻大,一接上灯电压就往下掉。所以电压表上(没接灯时)的读数大约要到 2.4 V 以上,灯才看得出微光——试试多串几个柠檬。';
    else msg.innerHTML = st.n + ' 个柠檬串起来:<b>' + vs + '</b>,LED 还不亮(没接灯时的读数约要 ' + LED_ON + ' V 以上,接上灯才剩下接近 2 V 的电压,示意)。' + (st.n === 4 ? '4 个都串上了还不够?换一对电压更高的金属。' : '再串一个,或者换一对金属。');
    view.draw(st);
  }
  upd();
  return st;
}

/* 2D 水果电池台 */
function lemon2D() {
  var C, st = { a: 'Cu', b: 'Cu', n: 1, V: 0, led: false }, needle = 0;
  return {
    mount: function (stage) {
      C = EF.canvas(stage, 330);
      (function loop() {
        if (!C.c.isConnected) return; var x = C.x, W = C.W, H = C.H; x.clearRect(0, 0, W, H);
        x.fillStyle = 'rgba(40,52,70,.6)'; x.fillRect(0, H * 0.78, W, H * 0.22);
        var n = st.n, gap = Math.min(150, (W - 40) / n), x0 = W / 2 - gap * (n - 1) / 2, ly = H * 0.66, A = FBY[st.a], B = FBY[st.b], pts = [];
        for (var i = 0; i < n; i++) {
          var cx = x0 + i * gap, rx = Math.min(58, gap * 0.4), ry = rx * 0.68;
          var g = x.createRadialGradient(cx - rx * 0.3, ly - ry * 0.4, 4, cx, ly, rx * 1.1); g.addColorStop(0, '#fff6a8'); g.addColorStop(0.5, '#f2d33a'); g.addColorStop(1, '#a8860e');
          x.fillStyle = g; x.beginPath(); x.ellipse(cx, ly, rx, ry, 0, 0, 7); x.fill();
          var la = cx - rx * 0.42, lb = cx + rx * 0.42;
          x.fillStyle = A.c; x.fillRect(la - 4, ly - ry - 34, 8, 46); x.fillStyle = B.c; x.fillRect(lb - 4, ly - ry - 34, 8, 46);
          pts.push([la, lb, ly - ry - 34]);
        }
        /* 串联导线:每个柠檬的右片接下一个的左片 */
        x.strokeStyle = '#cfd8e6'; x.lineWidth = 2; for (var j = 0; j < n - 1; j++) { x.beginPath(); x.moveTo(pts[j][1], pts[j][2]); x.quadraticCurveTo((pts[j][1] + pts[j + 1][0]) / 2, pts[j][2] - 30, pts[j + 1][0], pts[j + 1][2]); x.stroke(); }
        /* 电压表 + LED */
        var mx = W / 2, my = H * 0.2, R = 54, Vabs = Math.max(-1, Math.min(3.2, st.V)); needle += ((Vabs / 3.2) - needle) * (EF.reduced ? 1 : 0.12);
        x.strokeStyle = '#9aa3b0'; x.beginPath(); x.moveTo(pts[0][0], pts[0][2]); x.lineTo(pts[0][0], my); x.lineTo(mx - R - 6, my); x.stroke();
        x.strokeStyle = '#ff4a4a'; x.beginPath(); x.moveTo(pts[n - 1][1], pts[n - 1][2]); x.lineTo(pts[n - 1][1], my); x.lineTo(mx + R + 6, my); x.stroke();
        x.fillStyle = '#1a2230'; x.beginPath(); x.arc(mx, my + 14, R, Math.PI, 0); x.closePath(); x.fill(); x.strokeStyle = '#7ad7ff'; x.lineWidth = 1.5; x.stroke();
        for (var t = -1; t <= 3; t++) { var a = Math.PI + (t + 1) / 4.2 * Math.PI; x.strokeStyle = 'rgba(200,220,240,.6)'; x.beginPath(); x.moveTo(mx + Math.cos(a) * R * 0.8, my + 14 + Math.sin(a) * R * 0.8); x.lineTo(mx + Math.cos(a) * R * 0.95, my + 14 + Math.sin(a) * R * 0.95); x.stroke(); }
        var an = Math.PI + (needle * 3.2 + 1) / 4.2 * Math.PI; x.strokeStyle = '#ffd27a'; x.lineWidth = 2.5; x.beginPath(); x.moveTo(mx, my + 14); x.lineTo(mx + Math.cos(an) * R * 0.85, my + 14 + Math.sin(an) * R * 0.85); x.stroke();
        x.fillStyle = '#c8d6e6'; x.font = '10px system-ui'; x.textAlign = 'center'; x.fillText('COM', mx - R - 16, my - 6); x.fillText('V+', mx + R + 16, my - 6);
        x.fillStyle = '#e8f4ff'; x.font = '700 15px system-ui'; x.fillText((st.V < 0 ? '−' : '') + Math.abs(st.V).toFixed(2) + ' V', mx, my + 6);
        var lx = W - 40, lyy = my; if (st.led) { var gl = x.createRadialGradient(lx, lyy, 2, lx, lyy, 40); gl.addColorStop(0, 'rgba(255,60,60,.7)'); gl.addColorStop(1, 'rgba(255,60,60,0)'); x.fillStyle = gl; x.fillRect(lx - 40, lyy - 40, 80, 80); }
        x.fillStyle = st.led ? '#ff5050' : '#5a2a2a'; x.beginPath(); x.arc(lx, lyy, 9, Math.PI, 0); x.lineTo(lx + 9, lyy + 10); x.lineTo(lx - 9, lyy + 10); x.fill();
        x.fillStyle = '#c8d6e6'; x.font = '11px system-ui'; x.fillText('红色 LED', lx, lyy + 26);
        x.textAlign = 'left'; x.fillText(A.n + ' | 柠檬汁 | ' + B.n + (n > 1 ? ' × ' + n + '(串联)' : ''), 12, H - 10);
        x.lineWidth = 1; requestAnimationFrame(loop);
      })();
    },
    draw: function (s) { st = s; }
  };
}

EF.BT = { FM: FM, FBY: FBY, LAD: LAD, LBY: LBY, DANGER: DANGER, SAFE: SAFE, txt: txt, card: card, lemon: lemon, lemon2D: lemon2D, LED_ON: LED_ON };
})();

<script>
(function () {
var BT = EF.BT, txt = BT.txt, card = BT.card;

/* ---------- L0 柠檬电池(平面版) ---------- */
function L0(stage, api) { BT.lemon(stage, api, BT.lemon2D()); }

/* ---------- L1 电子去哪儿(三窗联动) ---------- */
var STEPS = [
  { q: '电子从哪一片出发,沿导线流出去?', o: [['Zn', '锌片'], ['Cu', '铜片']], ok: 'Zn', no: '看中间窗口:小蓝点(电子)是从哪片金属里钻出来的?' },
  { q: '铜片表面冒出的小气泡是什么?', o: [['H2', '氢气 H₂'], ['O2', '氧气 O₂'], ['CO2', '二氧化碳 CO₂']], ok: 'H2', no: '看铜片旁边:两个 H⁺ 各拿到一个电子,合成了什么?' },
  { q: '锌原子把电子交出去,这叫——', o: [['ox', '氧化(失去电子)'], ['re', '还原(得到电子)']], ok: 'ox', no: '记一句口诀:失电子是氧化,得电子是还原。' }];
function L1(stage, api) {
  var T = EF.tri(stage, { state: { on: false, s: 0 }, h: 260 }), st = T.state, done = false;
  var ctl = document.createElement('div'); ctl.className = 'ctl chips'; stage.appendChild(ctl);
  var msg = txt(stage, '烧杯里是柠檬汁(酸性,里面有 H⁺),插着一片锌、一片铜,用导线连着一只电流表。先合上开关。');
  card(stage, BT.SAFE, true);
  function drawCtl() {
    if (!st.on) { ctl.innerHTML = '<button class="ef-btn" id="sw">合上开关</button>'; ctl.querySelector('#sw').onclick = function () { EF.play('select'); T.set({ on: true }, 'ctl'); msg.innerHTML = '电流表的指针偏转了——有电流!' + STEPS[0].q; drawCtl(); }; return; }
    if (st.s >= STEPS.length) { ctl.innerHTML = ''; return; }
    var S = STEPS[st.s]; ctl.innerHTML = '<span>' + S.q + '</span>' + S.o.map(function (o) { return '<button class="ef-btn ghost chip" data-k="' + o[0] + '">' + o[1] + '</button>'; }).join('');
    ctl.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () {
      if (b.dataset.k === S.ok) { EF.play('select'); var s = st.s + 1; T.set({ s: s }, 'ctl');
        if (s === 1) msg.innerHTML = '对!锌比铜活泼,锌原子交出 2 个电子,自己变成 Zn²⁺ 溜进溶液。电子只能沿导线走到铜片。' + STEPS[1].q;
        else if (s === 2) msg.innerHTML = '对!溶液里的 H⁺ 在铜片上接过电子,两个 H 合成一个氢气分子 H₂。(真实水果电池电流很小,气泡很少,这里放大了;真做实验时锌片上也可能冒少量气泡,那是一部分锌直接和酸反应了,电子没走导线)' + STEPS[2].q;
        else { done = true; EF.play('fuse'); msg.innerHTML = '对!锌<b>失去</b>电子是<b>氧化</b>,H⁺ <b>得到</b>电子是<b>还原</b>,两件事同时发生——这就是<b>氧化还原反应</b>。电流的方向规定得和电子相反:从铜片经导线流向锌片。'; setTimeout(api.complete, 1700); }
        drawCtl(); }
      else { EF.play('tick'); msg.innerHTML = '再想想。' + S.no; if (st.s === 0) api.say('电子带负电,是从"交出电子"的那片金属出发的。'); }
    }; });
  }
  drawCtl();
  /* 宏观:烧杯、两片金属、电流表、气泡 */
  var CM = EF.canvas(T.pane.macro, 260), zw = 14, bub = [], nd = 0;
  (function loop(t) {
    if (!CM.c.isConnected) return; var x = CM.x, W = CM.W, H = CM.H; x.clearRect(0, 0, W, H);
    var bx = W * 0.15, bw = W * 0.7, by = H * 0.42, bh = H * 0.5;
    x.fillStyle = 'rgba(242,211,58,.28)'; x.fillRect(bx, by + 16, bw, bh - 16); x.strokeStyle = 'rgba(200,230,255,.7)'; x.lineWidth = 2; x.strokeRect(bx, by, bw, bh);
    var zx = bx + bw * 0.22, cx = bx + bw * 0.72; if (st.on && zw > 7 && !EF.reduced) zw -= 0.004;
    x.fillStyle = '#9fb3c8'; x.fillRect(zx - zw / 2, by - 30, zw, bh * 0.8 + 30); x.fillStyle = '#e08a4a'; x.fillRect(cx - 7, by - 30, 14, bh * 0.8 + 30);
    x.fillStyle = '#dfe8f2'; x.font = '12px system-ui'; x.textAlign = 'center'; x.fillText('锌', zx, by + bh + 16); x.fillText('铜', cx, by + bh + 16);
    var mx = (zx + cx) / 2, my = H * 0.14; nd += ((st.on ? 0.5 : 0) - nd) * (EF.reduced ? 1 : 0.08);
    x.strokeStyle = '#cfd8e6'; x.lineWidth = 2; x.beginPath(); x.moveTo(zx, by - 30); x.lineTo(zx, my); x.lineTo(mx - 22, my); x.moveTo(mx + 22, my); x.lineTo(cx, my); x.lineTo(cx, by - 30); x.stroke();
    x.fillStyle = '#1a2230'; x.beginPath(); x.arc(mx, my, 22, 0, 7); x.fill(); x.strokeStyle = '#7ad7ff'; x.stroke();
    var an = -Math.PI / 2 + nd; x.strokeStyle = '#ffd27a'; x.beginPath(); x.moveTo(mx, my + 6); x.lineTo(mx + Math.cos(an) * 16, my + 6 + Math.sin(an) * 16); x.stroke();
    x.fillStyle = '#dfe8f2'; x.font = '10px system-ui'; x.fillText('A', mx, my + 16);
    if (!st.on) { x.fillStyle = 'rgba(255,210,122,.9)'; x.fillText('开关断开', mx, my - 28); }
    if (st.on && Math.random() < (EF.reduced ? 0 : 0.12)) bub.push({ x: cx + 9 + Math.random() * 6, y: by + bh * 0.7 * Math.random() + 30, r: 1.5 + Math.random() * 2 });
    bub = bub.filter(function (b) { b.y -= 0.7; x.strokeStyle = 'rgba(230,245,255,.8)'; x.lineWidth = 1; x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.stroke(); return b.y > by + 18; });
    if (st.on && EF.reduced) { x.fillStyle = 'rgba(230,245,255,.8)'; x.fillText('○ 气泡', cx + 22, by + 40); }
    x.lineWidth = 1; requestAnimationFrame(loop);
  })(0);
  /* 微观:锌原子交出电子 → 电子走导线 → H⁺ 在铜片上变 H₂ */
  var CU = EF.canvas(T.pane.micro, 260), el = [], ions = [], hp = [], h2 = [], zn = [], last = 0;
  for (var r = 0; r < 6; r++) for (var c = 0; c < 2; c++) zn.push({ r: r, c: c, on: 1 });
  for (var i = 0; i < 9; i++) hp.push({ x: 0.35 + Math.random() * 0.3, y: 0.45 + Math.random() * 0.45, vx: 0, vy: 0 });
  (function loop(t) {
    if (!CU.c.isConnected) return; var x = CU.x, W = CU.W, H = CU.H; x.clearRect(0, 0, W, H);
    var zx = W * 0.14, cx = W * 0.82, top = H * 0.36, wy = H * 0.12;
    x.fillStyle = 'rgba(242,211,58,.08)'; x.fillRect(0, top, W, H - top);
    x.strokeStyle = 'rgba(207,216,230,.8)'; x.lineWidth = 2; x.beginPath(); x.moveTo(zx + 10, top); x.lineTo(zx + 10, wy); x.lineTo(cx, wy); x.lineTo(cx, top); x.stroke(); x.lineWidth = 1;
    zn.forEach(function (a) { if (!a.on) return; EF.ball(x, zx + a.c * 16, top + 14 + a.r * 19, 8, '#9fb3c8', ''); });
    for (var r2 = 0; r2 < 6; r2++) for (var c2 = 0; c2 < 2; c2++) EF.ball(x, cx + c2 * 16, top + 14 + r2 * 19, 8, '#e08a4a', '');
    x.fillStyle = '#dfe8f2'; x.font = '11px system-ui'; x.textAlign = 'center'; x.fillText('锌 Zn', zx + 8, H - 6); x.fillText('铜 Cu', cx + 8, H - 6);
