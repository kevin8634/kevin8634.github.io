    if (i > -1) { drag = { i: i, sx: p.x, sy: p.y, mx: p.x, my: p.y, moved: false, link: i === sel && M.free(mol, i) > 0 }; if (!drag.link) snap(); }

  });
  cv.addEventListener('pointermove', function (ev) {
    if (!drag) return; var p = pos(ev); drag.mx = p.x; drag.my = p.y;
    if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 4) drag.moved = true;
    if (!drag.link && drag.moved) { var A = mol.atoms[drag.i]; A.x = Math.max(16, Math.min(W - 16, p.x)); A.y = Math.max(16, Math.min(H - 16, p.y)); }
    draw();
  });
  cv.addEventListener('pointerup', function (ev) {
    if (!drag) return; var p = pos(ev), d = drag; drag = null;
    if (d.link) { var j = hit(p.x, p.y); if (d.moved && j > -1 && j !== d.i) bond(d.i, j); else if (!d.moved) { sel = -1; } draw(); return; }
    if (!d.moved) { hist.pop(); sel = sel === d.i ? -1 : d.i; draw(); }
  });
  /* 键盘 */
  var prev = -1;
  cv.addEventListener('keydown', function (ev) {
    var k = ev.key;
    var dir = (k === 'ArrowRight' || k === 'ArrowDown') ? 1 : (k === 'ArrowLeft' || k === 'ArrowUp') ? -1 : 0;
    if (dir && mol.atoms.length) { ev.preventDefault(); prev = sel; sel = (sel + (dir < 0 ? mol.atoms.length - 1 : 1)) % mol.atoms.length; if (sel < 0) sel = 0; var A = mol.atoms[sel]; say('选中 ' + ZH[A.e] + ' 原子,空插槽 ' + M.free(mol, sel)); draw(); return; }
    var up = k.length === 1 ? k.toUpperCase() : k; if (up === 'L') up = 'Cl';
    if ((opt.els || ['H', 'C', 'N', 'O']).indexOf(up) > -1) { ev.preventDefault(); add(up); return; }
    if ((k === '1' || k === '2' || k === '3') && sel > -1 && prev > -1 && prev !== sel) { ev.preventDefault(); setOrder(prev, sel, +k); return; }

  });
  wrap.querySelectorAll('.mb-at').forEach(function (b) { b.onclick = function () { add(b.dataset.e); }; });
  var g3 = null, g3p = null;
  function show3d(on) {
    if (!on) { if (g3) g3.show(false); return; }
    if (!g3p) g3p = import('../ef-molecule3d.js?v=1').then(function (m) { g3 = m.mountMol3D(wrap.querySelector('.mb-view')); return g3; }, function (e) { console.warn('[ef] 3D 视图加载失败', e); });
    g3p.then(function (g) { if (g && view === '3d') { g.set(mol); g.show(true); } });
  }
  wrap.querySelectorAll('.mb-views button').forEach(function (b) { b.onclick = function () { view = b.dataset.v; wrap.querySelectorAll('.mb-views button').forEach(function (x) { x.classList.toggle('on', x === b); }); show3d(view === '3d'); say(view === '3d' ? '3D 视图:拖动旋转;要继续搭建请切回球棍。' : ''); draw(); }; });
  wrap.querySelectorAll('[data-a]').forEach(function (b) {

      if (a === 'fill') fill(); else if (a === 'undo') { if (hist.length) { mol = JSON.parse(hist.pop()); sel = -1; changed(); } }
      else if (a === 'del') del(sel); else if (a === 'clear') { snap(); mol = { atoms: [], bonds: [] }; sel = -1; changed(); } };
  });
  var ro = window.ResizeObserver ? new ResizeObserver(rs) : null; ro ? ro.observe(cv) : window.addEventListener('resize', rs); setTimeout(rs, 0);
  var api = { get mol() { return mol; }, key: function () { return M.key(mol); }, status: function () { return M.status(mol); }, formula: function () { return M.formula(mol); }, wrap: wrap,
    load: function (m) { mol = JSON.parse(JSON.stringify(m)); sel = -1; changed(); }, stop: function () { cancelAnimationFrame(raf); ro && ro.disconnect(); } };
  window.EFMB = api; /* 自测钩子 */
  return api;
}

/* ---------- 结果卡 ---------- */
function resultHTML(b) {
  var k = b.key(), r = lookup(k), f = fm(b.formula());
  if (r && r.core) { var c = r.core; return '<b>已知 · ' + EF.esc(c.zh) + '</b> ' + f + '<br>' + EF.esc(c.u) + '<br>' + safeTag(c.s) + (c.w ? '<span style="color:#d9cbb0">为什么要小心:' + EF.esc(c.w) + '</span>' : ''); }
  if (r && r.auto) return '<b>已知 · 数据库收录</b> ' + f + '<br>英文名:' + EF.esc(r.auto[1]) + '<br><small style="color:#a8a090">来自 NCBI PubChem(编号 CID ' + r.auto[3] + ')。本台只显示名称,不提供用途和制法。</small>';
  return '<b>库中未收录</b> ' + f + '<br>能画出来 ≠ 能合成,也 ≠ 世界上不存在:本台离线库只收了 3000 多个 PubChem 早期登记的小分子。真实世界还要看这个结构稳不稳定、有没有人做出来过。';
}

/* ---------- 四关 ---------- */
var GOAL0 = [['H2O', '水 H₂O'], ['H3N', '氨 NH₃'], ['CH4', '甲烷 CH₄'], ['CO2', '二氧化碳 CO₂']];
function L0(stage, api) {
  var got = {}, keys = {};
  GOAL0.forEach(function (g) { var c = DB.core.filter(function (x) { return x.f === g[0] && x.b; })[0]; if (c) keys[c.k] = g[0]; });
  stage.insertAdjacentHTML('beforeend', '<div class="mb-goals">' + GOAL0.map(function (g) { return '<span data-g="' + g[0] + '">' + g[1] + '</span>'; }).join('') + '</div>');
  var b = Builder(stage, { els: ['H', 'C', 'N', 'O'], onChange: function (B) {
    if (B.status() !== 'ok') return; var f = keys[B.key()]; if (!f || got[f]) return;
    got[f] = 1; stage.querySelector('[data-g="' + f + '"]').classList.add('got');
    api.say('咔哒!' + fm(f) + ' 插满了,所有插槽都配上了对。' + (Object.keys(got).length < 4 ? '清空再拼下一个。' : ''));
    if (Object.keys(got).length === 4) { b.stop(); api.complete(); }
  } });
}
function L1(stage, api) {
  var n = 0;
  var b = Builder(stage, { els: ['H', 'C', 'N', 'O', 'S', 'Cl', 'F', 'Br'], fillH: 1, extra: '<button class="ef-btn" data-q>查一查</button>' });
  stage.insertAdjacentHTML('beforeend', '<div class="mb-res" aria-live="polite"></div>');
  var res = stage.querySelector('.mb-res');
  b.wrap.querySelector('[data-q]').onclick = function () {
    var st = b.status(); if (st !== 'ok') { res.innerHTML = st === 'open' ? '还有空插槽亮着:先插满(可以点「自动补氢」)。' : st === 'split' ? '台上是几块分开的碎片,连成一个分子再查。' : '先拼一个分子。'; return; }
    res.innerHTML = resultHTML(b); EF.play && EF.play('select'); n++;
    var heavy = b.mol.atoms.filter(function (a) { return a.e !== 'H'; }).length;
    if (heavy >= 3 && n >= 2) { b.stop(); api.complete(); } else if (n >= 1) api.say('再拼一个重原子(非氢)≥ 3 个的分子查查看,试试库里有没有它。');
  };
}
function L2(stage, api) {
  var P = DB.pairs[0], seen = {};
  stage.insertAdjacentHTML('beforeend', '<div class="mb-goals"><span data-k="' + P[0] + '">C₂H₆O · 第一种</span><span data-k="' + P[1] + '">C₂H₆O · 第二种</span></div>');
  var b = Builder(stage, { els: ['H', 'C', 'O'], fillH: 1, onChange: function (B) {
    if (B.status() !== 'ok' || B.formula() !== 'C2H6O') return; var k = B.key(); if (seen[k]) return;
    if (k !== P[0] && k !== P[1]) return; seen[k] = 1;
    var sp = stage.querySelectorAll('.mb-goals span'), i = Object.keys(seen).length - 1; sp[i].classList.add('got'); sp[i].textContent = 'C₂H₆O · ' + CORE[k].zh;
    if (i === 0) api.say('拼出了 ' + CORE[k].zh + '!同样 2 个 C、6 个 H、1 个 O,还能换一种连法吗?');
    else { b.stop(); table(); api.complete(); }
  } });
  function table() {
    var rows = DB.pairs.map(function (p) { var a = CORE[p[0]], c = CORE[p[1]]; return '<tr><td>' + fm(a.f) + '</td><td>' + a.zh + ' ' + a.bp + ' °C</td><td>' + c.zh + ' ' + c.bp + ' °C</td></tr>'; }).join('');
    stage.insertAdjacentHTML('beforeend', '<div class="mb-res"><b>同一个分子式,沸点(1 个大气压)</b><table class="mb-tbl"><tr><th>分子式</th><th>A</th><th>B</th></tr>' + rows + '</table><small style="color:#a8a090">数据来源:CRC Handbook / NCBI PubChem(1 atm)</small></div>');
  }
}
/* 平均键能(kJ/mol,教材常用值) */
var BE = { 'C-H': 413, 'C-C': 348, 'C=C': 614, 'C#C': 839, 'H-H': 436, 'O-H': 463, 'C-O': 358, 'C=O': 799, 'N-H': 391, 'O=O': 498 };
function ledger(mol) {
  var c = {}, sum = 0, miss = 0;
  mol.bonds.forEach(function (b) { var e = [mol.atoms[b.a].e, mol.atoms[b.b].e].sort(function (x, y) { return x === 'C' ? -1 : y === 'C' ? 1 : x < y ? -1 : 1; }); var t = e[0] + ['', '-', '=', '#'][b.o] + e[1]; c[t] = (c[t] || 0) + 1; if (BE[t]) sum += BE[t]; else miss++; });
  return { c: c, sum: sum, miss: miss };
}
function L3(stage, api) {
  var stepE = false;
  stage.insertAdjacentHTML('beforeend', '<div class="mb-goals"><span data-s="1">① 拼乙烯 C₂H₄</span><span data-s="2">② 加氢变乙烷 C₂H₆</span></div>');
  var b = Builder(stage, { els: ['H', 'C'], onChange: function (B) {
    var L = ledger(B.mol); res.innerHTML = '<b>键的账本</b> ' + (Object.keys(L.c).map(function (t) { return t.replace('-', '–').replace('#', '≡') + ' ×' + L.c[t]; }).join(' · ') || '—') + '<br>拆开全部的键,约需 ' + L.sum + ' kJ/mol(平均键能估算)';
    if (B.status() !== 'ok') return; var f = B.formula();
    if (f === 'C2H4' && !stepE) { stepE = true; stage.querySelector('[data-s="1"]').classList.add('got'); api.say('乙烯有一根 C=C 双键。现在点一下双键把它变回单键,再给两个碳各接一个 H。'); }
    else if (f === 'C2H6' && stepE) { stage.querySelector('[data-s="2"]').classList.add('got'); b.stop(); acct(); api.complete(); }
  } });
  stage.insertAdjacentHTML('beforeend', '<div class="mb-res" aria-live="polite"></div>');
  var res = stage.querySelector('.mb-res:last-child');
  function acct() {
    res.innerHTML = '<b>账本结算:C₂H₄ + H₂ → C₂H₆</b><table class="mb-tbl"><tr><th></th><th>键</th><th>kJ/mol</th></tr>' +
      '<tr><td>拆(吸热)</td><td>C=C ×1 + H–H ×1</td><td>614 + 436 = 1050</td></tr>' +
      '<tr><td>成(放热)</td><td>C–C ×1 + C–H ×2</td><td>348 + 826 = 1174</td></tr>' +
      '<tr><td>估算 ΔH</td><td>1050 − 1174</td><td><b>≈ −124</b></td></tr><tr><td>实测 ΔH</td><td>标准状态</td><td><b>−137</b></td></tr></table>' +
      '<small style="color:#a8a090">平均键能是许多分子的平均值,估算误差约 10%;实测值由 298 K 气态标准生成焓计算(NIST:乙烷 −84.0、乙烯 +52.4 kJ/mol,得 −136,教材常取 −137)。</small>';
  }
}

var LEVELS = [
  { title: '插满就稳', setup: L0, task: '从元素托盘把原子放上台:点一下台上的原子选中它,再点托盘里的元素,新原子就接在它的空插槽上;按住选中的原子拖到另一个原子上,可以把两者连起来。拼出水、氨、甲烷、二氧化碳四个分子(点键可以变成双键)。',
    ask: { q: '一个碳原子(C)最多能连几个氢原子(H)?', opts: ['2 个', '3 个', '4 个', '6 个'], ok: 2, yes: '没错,碳有 4 个插槽。上台验证一下。' },
    hints: ['亮着的琥珀色光点 = 空插槽。H 有 1 个,O 有 2 个,N 有 3 个,C 有 4 个。', '选中一个原子,再点托盘里的 H,氢会自动接上去。', '二氧化碳:C 在中间,两边各一个 O;点一下 C–O 键,它会变成双键 C=O。'],
    explain: '原子靠共用电子对成键。每种原子能成的键数大致固定(这里叫"插槽",课本里叫化合价或成键数):H 1、O 2、N 3、C 4。所有插槽都配上了对,就满足了成键规则,这是成为稳定分子的第一步;双键算 2 个插槽,三键算 3 个。CO₂ 里碳用两根双键,正好插满。' },
  { title: '世界上真的有吗', setup: L1, task: '自由拼一个分子(可以用 S、Cl、F、Br),插满后点「查一查」,和离线分子库比对。查两次,其中一次的分子要有 3 个以上非氢原子。',
    ask: { q: '一个分子,只要能在纸上画出来(每个原子都插满),现实中就一定存在吗?', opts: ['一定存在', '不一定'], ok: 1, yes: '对,画得出 ≠ 做得出。我们查查看。', no: '先别急,查查数据库就知道了。' },
    hints: ['拼好骨架后点「自动补氢」,空插槽会全部补上 H。', '试试 3 个碳连成一串再加一个 O——有几种连法?', '查不到也是一种结果:本台库只收 3000 多个 PubChem 早期登记的小分子;有些分子(比如 CO、SO₂)要用到本台没有的成键方式,拼不出来。'],
    explain: '化学家把已知物质登记在数据库里,PubChem 收录了一亿多种。可光是 13 个以内的 C、N、O、S、Cl 原子,按成键规则能画出的合理分子就有近 10 亿种,绝大多数还没人做出来过。"能画出来"只说明成键规则允许;它能不能稳定存在,还要看键的强弱、环的张力等。危险物质本台只告诉你为什么危险,不提供任何制法。' },
  { title: '同一个公式,两种性格', setup: L2, task: '用 2 个 C、6 个 H、1 个 O,拼出两种不同的分子(连法不同)。',
    ask: { q: '乙醇和二甲醚的分子式都是 C₂H₆O,谁的沸点更高?', opts: ['乙醇', '二甲醚', '一样高'], ok: 0, yes: '直觉很准!拼出来看看为什么。', no: '分子式一样,性质可不一定一样。拼出来看看。' },
    hints: ['O 有 2 个插槽:可以夹在两个 C 中间,也可以挂在一端。', 'C–C–O–H 是一种,C–O–C 是另一种。', '点「自动补氢」把剩下的插槽补满。'],
    explain: '分子式相同、结构不同的物质叫同分异构体。乙醇有 O–H,分子之间能形成氢键,要更多能量才能分开,沸点 78 °C;二甲醚没有 O–H,沸点约 −25 °C,常温是气体。正丁烷和异丁烷都没有氢键,差别来自分子形状:支链越多、分子越"圆",分子之间接触面越小,作用力越弱,沸点越低(正丁烷 −0.5 °C,异丁烷 −11.7 °C)。结构决定性质。' },
  { title: '键的账本', setup: L3, task: '先拼乙烯 C₂H₄(碳碳双键),再把它变成乙烷 C₂H₆:点双键变单键,再补两个 H。看账本怎么算热量。可以切换「电子式」看共用电子对。',
    ask: { q: '乙烯和氢气反应生成乙烷,是放热还是吸热?', opts: ['放热', '吸热', '不放热也不吸热'], ok: 0, yes: '对!新成的键比拆掉的键更"牢"。', no: '我们用键能记一笔账看看。' },
    hints: ['拆键要吸收能量,成键会放出能量。', '拆:1 根 C=C、1 根 H–H;成:1 根 C–C、2 根 C–H。', '成键放出的比拆键吸收的多,差值就是放出的热。'],
    explain: '化学反应 = 旧键断开 + 新键形成。拆键吸热,成键放热;用平均键能可以估算反应热:乙烯加氢约 −124 kJ/mol,实测 −137 kJ/mol,负号表示放热。估算有误差,因为同一种键在不同分子里强弱略有不同。电子式里,两个原子之间的一对点是共用电子对:单键 1 对,双键 2 对;只挨着一个原子的成对的点是孤对电子,没有拿去成键。' }
];
var NOTES = { title: '元素工坊 · 随手拼一个分子,世界上真的有吗?', items: [
  '共价键 = 共用电子对。成键数:H 1、O 2、N 3、C 4;双键占 2、三键占 3。插满 = 满足成键规则(本台简化版);稳不稳定还要看别的。',
  '能画出来的结构不一定存在或能合成;已知物质登记在 PubChem 等数据库里。',
  '同分异构体:分子式相同、结构不同,性质可以差很多(乙醇 78 °C vs 二甲醚 −25 °C)。',
  '反应热 ≈ 拆键吸收的能量 − 成键放出的能量;平均键能估算有误差。',
  '安全:🔴 危险物质本台只说明为什么危险,不提供用途细节、制法、用量或获取渠道。请勿在现实中尝试。'],
  bridge: '<a href="../react/">把两种东西混在一起,会发生什么?</a> · <a href="../carbon/">为什么钻石和铅笔芯是同一种东西?</a>' };

/* v2.3:从反应台图鉴跳来 ?look=<分子键>,在关卡上方展开一张结构卡(可拖动/切 3D,不计关卡进度) */

  if (!c) return;
  var app = document.getElementById('app'), box = document.createElement('section');

  box.innerHTML = '<div class="mb-look-h"><b>' + EF.esc(c.zh) + '</b> ' + fm(c.f) + ' <span style="color:#a8a090;font-size:12px">· 来自反应台图鉴</span> <a class="ef-btn ghost" href="../react/">← 回反应台</a> <button class="ef-btn ghost" data-x>收起</button></div>' +
    '<div class="mb-look-c">' + EF.esc(c.u) + '<br>' + safeTag(c.s) + (c.w ? '<span style="color:#d9cbb0">为什么要小心:' + EF.esc(c.w) + '</span>' : '') + '</div><div class="mb-look-s"></div>';
  app.insertBefore(box, app.firstChild);
  var els = []; c.m[0].forEach(function (a) { if (els.indexOf(a[0]) < 0) els.push(a[0]); });
  var lvl = window.EFMB, b = Builder(box.querySelector('.mb-look-s'), { els: els });
  var cx = 0, cy = 0; setTimeout(function () { var cv = box.querySelector('canvas'), r = cv ? cv.getBoundingClientRect() : { width: 600, height: 300 }; cx = r.width / 2; cy = r.height / 2;
    b.load({ atoms: c.m[0].map(function (a) { return { e: a[0], x: cx + a[1], y: cy + a[2] }; }), bonds: c.m[1].map(function (q) { return { a: q[0], b: q[1], o: q[2] }; }) }); }, 30);
  if (lvl) window.EFMB = lvl;
  box.querySelector('[data-x]').onclick = function () { b.stop(); box.remove(); };
  box.scrollIntoView({ block: 'start' });
}
fetch('../data/ef.molecule.json').then(function (r) { return r.json(); }).then(function (j) {
  DB = j; j.core.forEach(function (c) { if (c.b) CORE[c.k] = c; }); j.db.forEach(function (d) { AUTO[d[0]] = d; });
  EF.mission('molecule', LEVELS, NOTES);
  lookMode();
}, function (e) { console.warn('[ef] 分子库加载失败', e); document.getElementById('app').innerHTML = '<p style="padding:40px">分子库没加载出来,请联网后刷新。</p>'; });
})();
