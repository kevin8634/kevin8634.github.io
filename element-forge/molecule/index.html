      (C.n > 1 ? '这个分子有 ' + C.n + ' 个手性碳,镜子里先只看第 1 个。小提示:有两个以上手性碳的分子,偶尔整体左右对称,镜像反而能重合。' : '') + '点「照镜子」。');
  } });
  p0.querySelector('[data-ex]').onclick = function () {
    var c = CORE[Object.keys(CORE).filter(function (k) { return CORE[k].zh === '乳酸'; })[0]]; if (!c || !c.m) return;
    var cv = p0.querySelector('canvas'), r = cv.getBoundingClientRect();
    b.load({ atoms: c.m[0].map(function (a) { return { e: a[0], x: r.width / 2 + a[1], y: r.height / 2 + a[2] }; }), bonds: c.m[1].map(function (q) { return { a: q[0], b: q[1], o: q[2] }; }) });
  };
  p0.querySelector('[data-go]').onclick = function () { EF.play && EF.play('whoosh'); show(1); };
  /* ② */
  var p1 = panes[1], ask = p1.querySelector('.cx-ask'), ctrl = false;
  function startMirror() {
    if (!C) return; var w = p1.querySelector('.cx-mirwrap');
    if (!mir) mir = Mirror(w, C.labels, function (n, best) {
      if (ctrl) { if (n === 4) api.say('对照组:这个碳连着两个 –H,镜像一转就和原来完全重合——它<b>不是</b>手性碳。点「换回我的分子」。'); return; }
      if (best >= 2 && !gave) { gave = true; ask.hidden = false; ask.innerHTML = '最多只能对上 2 个?再转转,能到 4 / 4 吗?<div class="mb-row"><button class="ef-btn ghost" data-k="more">我再试试</button><button class="ef-btn" data-k="never">永远到不了 4 / 4</button></div>';
        ask.querySelector('[data-k="more"]').onclick = function () { api.say('试试「帮我对齐到最好」,或者用方向键慢慢转。'); };
        ask.querySelector('[data-k="never"]').onclick = function () { ask.innerHTML = '<b>对!</b>像左手和右手:镜像怎么转都不能和原来重合。这样的分子叫<b>手性分子</b>;它和它的镜像是一对<b>对映异构体</b>。'; unlock(2); EF.play && EF.play('unlock'); api.say('原来分子也分左右手。去第 ③ 步看看生活里的例子。'); };
      }
    });
    else mir.setLabels(ctrl ? ['H', 'H', 'CH₃', 'OH'] : C.labels);
  }
  p1.querySelector('[data-a="snap"]').onclick = function () { mir && mir.snap(); };
  p1.querySelector('[data-a="ctrl"]').onclick = function () { ctrl = true; mir && mir.setLabels(['H', 'H', 'CH₃', 'OH']); p1.querySelector('[data-a="back"]').hidden = false; this.hidden = true; api.say('对照组:乙醇里连着 –OH 的那个碳(–H、–H、–CH₃、–OH)。转转看,能重合吗?'); };
  p1.querySelector('[data-a="back"]').onclick = function () { ctrl = false; mir && mir.setLabels(C.labels); p1.querySelector('[data-a="ctrl"]').hidden = false; this.hidden = true; };
  /* ③ */
  panes[2].querySelectorAll('.cx-card').forEach(function (el) { el.onclick = function () {
    var c = CARDS[+el.dataset.c]; el.classList.add('open'); el.setAttribute('aria-expanded', 'true'); el.querySelector('span').innerHTML = c.t; seen[el.dataset.c] = 1; EF.play && EF.play('select');
    if (Object.keys(seen).length === 3) { unlock(3); api.say('最后一个问题:一开始左右只差一点点,怎样才能变成"清一色"?去第 ④ 步。'); }
  }; });
  /* ④ */
  var doneA = false;
  function startAmp() { if (amp) return; amp = Amplify(panes[3].querySelector('.cx-ampwrap'), function (x, mode, k, tried) {
    if (mode === 'copy' && k >= 6) api.say('只会自催化:一轮轮下来,左右的比例一点没变。光复制不够,还得让左右两种相遇时结对退出。');
    if (mode === 'auto' && x >= .99 && !doneA) { doneA = true; if (b) b.stop(); if (mir) mir.stop(); amp.stop(); api.complete(); }
  }); }
  api.say('先在搭建台上找出一个<b>手性碳</b>:它连着 4 个互不相同的基团。');
}

var LEVELS = [
  { title: '插满就稳', setup: L0, task: '从元素托盘把原子放上台:点一下台上的原子选中它,再点托盘里的元素,新原子就接在它的空插槽上;按住选中的原子拖到另一个原子上,可以把两者连起来。拼出水、氨、甲烷、二氧化碳四个分子(点键可以变成双键)。',
    ask: { q: '一个碳原子(C)最多能连几个氢原子(H)?', opts: ['2 个', '3 个', '4 个', '6 个'], ok: 2, yes: '没错,碳有 4 个插槽。上台验证一下。' },
    hints: ['亮着的琥珀色光点 = 空插槽。H 有 1 个,O 有 2 个,N 有 3 个,C 有 4 个。', '选中一个原子,再点托盘里的 H,氢会自动接上去。', '二氧化碳:C 在中间,两边各一个 O;点一下 C–O 键,它会变成双键 C=O。'],
    explain: '原子靠共用电子对成键。每种原子能成的键数大致固定(这里叫"插槽",课本里叫化合价或成键数):H 1、O 2、N 3、C 4。所有插槽都配上了对,就满足了成键规则,这是成为稳定分子的第一步;双键算 2 个插槽,三键算 3 个。CO₂ 里碳用两根双键,正好插满。' },
  { title: '世界上真的有吗', setup: L1, task: '自由拼一个分子(可以用 S、Cl、F、Br),插满后点「查一查」,和离线分子库比对。查两次,其中一次的分子要有 3 个以上非氢原子。',
    ask: { q: '一个分子,只要能在纸上画出来(每个原子都插满),现实中就一定存在吗?', opts: ['一定存在', '不一定'], ok: 1, yes: '对,画得出 ≠ 做得出。我们查查看。', no: '先别急,查查数据库就知道了。' },
    hints: ['拼好骨架后点「自动补氢」,空插槽会全部补上 H。', '试试 3 个碳连成一串再加一个 O——有几种连法?', '查不到也是一种结果:本台库只收 3000 多个 PubChem 早期登记的小分子;有些分子(比如 CO、SO₂)要用到本台没有的成键方式,拼不出来。'],
    explain: '化学家把已知物质登记在数据库里,PubChem 收录了一亿多种。可光是 13 个以内的 C、N、O、S、Cl 原子,按成键规则能画出的合理分子就有近 10 亿种,绝大多数还没人做出来过。"能画出来"只说明成键规则允许;它能不能稳定存在,还要看键的强弱、环的张力等。危险物质本台只告诉你为什么危险,不提供任何制法。' },
  { title: '同一个公式,两种性格', setup: L2, task: '用 2 个 C、6 个 H、1 个 O,拼出两种不同的分子(连法不同)。',
    ask: { q: '乙醇和二甲醚的分子式都是 C₂H₆O,谁的沸点更高?', opts: ['乙醇', '二甲醚', '一样高'], ok: 0, yes: '直觉很准!拼出来看看为什么。', no: '分子式一样,性质可不一定一样。拼出来看看。' },
    hints: ['O 有 2 个插槽:可以夹在两个 C 中间,也可以挂在一端。', 'C–C–O–H 是一种,C–O–C 是另一种。', '点「自动补氢」把剩下的插槽补满。'],
    explain: '分子式相同、结构不同的物质叫同分异构体。乙醇有 O–H,分子之间能形成氢键,要更多能量才能分开,沸点 78 °C;二甲醚没有 O–H,沸点约 −25 °C,常温是气体。正丁烷和异丁烷都没有氢键,差别来自分子形状:支链越多、分子越"圆",分子之间接触面越小,作用力越弱,沸点越低(正丁烷 −0.5 °C,异丁烷 −11.7 °C)。结构决定性质。' },
  { title: '键的账本', setup: L3, task: '先拼乙烯 C₂H₄(碳碳双键),再把它变成乙烷 C₂H₆:点双键变单键,再补两个 H。看账本怎么算热量。可以切换「电子式」看共用电子对。',
    ask: { q: '乙烯和氢气反应生成乙烷,是放热还是吸热?', opts: ['放热', '吸热', '不放热也不吸热'], ok: 0, yes: '对!新成的键比拆掉的键更"牢"。', no: '我们用键能记一笔账看看。' },
    hints: ['拆键要吸收能量,成键会放出能量。', '拆:1 根 C=C、1 根 H–H;成:1 根 C–C、2 根 C–H。', '成键放出的比拆键吸收的多,差值就是放出的热。'],
    explain: '化学反应 = 旧键断开 + 新键形成。拆键吸热,成键放热;用平均键能可以估算反应热:乙烯加氢约 −124 kJ/mol,实测 −137 kJ/mol,负号表示放热。估算有误差,因为同一种键在不同分子里强弱略有不同。电子式里,两个原子之间的一对点是共用电子对:单键 1 对,双键 2 对;只挨着一个原子的成对的点是孤对电子,没有拿去成键。' },
  { title: '镜子里的分子', setup: L4, task: '分四步:① 在搭建台上做出一个手性碳;② 照镜子,转动镜像看能不能重合;③ 看三个生活里的例子;④ 用简化模型看"一点点偏心"怎样变成"清一色"。',
    ask: { q: '把你的左手举到镜子前,镜子里是哪只手?不许翻过来,只能转一转:它能和你的左手完全叠在一起吗?', opts: ['能叠在一起', '不能,镜子里是一只右手'], ok: 1, yes: '对,左右手互为镜像,却叠不到一起。分子也有这种"左右手"。', no: '试试把左手和右手掌心朝下叠一叠……分子里也有一样的事,我们动手看看。' },
    hints: ['手性碳 = 一个碳连着 4 个互不相同的基团,例如 –H、–OH、–CH₃、–COOH(乳酸)。也可以试试一个碳上接 H、F、Cl、Br 各一个。', '照镜子时点「帮我对齐到最好」:不管怎么转,镜像最多只能和原来对上 2 个基团。', '第 ④ 步:只会复制的话,左右比例不变;要"会复制 + 左右结对退出"一起,才会越来越偏向一边。'],
    explain: '一个碳连着 4 个互不相同的基团,就是<b>手性碳</b>。只有一个手性碳的分子和它的镜像像左手和右手,怎么转都不能重合,这样的分子叫<b>手性分子</b>,它和镜像是一对<b>对映异构体</b>。两者成分、连法完全一样,熔点、沸点这些性质也一样,但遇到同样"有手性"的东西(比如鼻子里的受体、身体里的蛋白质)时,表现可能完全不同。生命几乎只用一只手:蛋白质里是 L 型氨基酸,DNA 里是 D 型糖。2026 年诺贝尔化学奖授予法国的 Henri B. Kagan 和日本的硖合宪三(Kenso Soai),表彰他们"发现不对称有机合成中的非线性效应和自催化"。Kagan 在 1986 年发现,产物的偏向可以比催化剂本身更强;Soai 在 1995 年做出会"自己造自己"的手性分子(起始只偏 2%,产物偏到 87%),2003 年更做到只靠偶然的一点点偏差,就放大到几乎只剩一种镜像。第 ④ 步只是简化模型。' }
];

var NOTES = { title: '元素工坊 · 随手拼一个分子,世界上真的有吗?', items: [
  '共价键 = 共用电子对。成键数:H 1、O 2、N 3、C 4;双键占 2、三键占 3。插满 = 满足成键规则(本台简化版);稳不稳定还要看别的。',
  '能画出来的结构不一定存在或能合成;已知物质登记在 PubChem 等数据库里。',
  '同分异构体:分子式相同、结构不同,性质可以差很多(乙醇 78 °C vs 二甲醚 −25 °C)。',
  '反应热 ≈ 拆键吸收的能量 − 成键放出的能量;平均键能估算有误差。',
  '手性碳:一个碳连着 4 个互不相同的基团。手性分子和它的镜像(对映异构体)不能重合,像左右手;生命里蛋白质用 L 型氨基酸、DNA 用 D 型糖。2026 年诺贝尔化学奖(Kagan、硖合宪三):Kagan 发现产物的偏向可以比催化剂更强(非线性效应);Soai 让分子自催化,把一点点偏差放大到几乎只剩一种镜像。L、D 按结构命名,和左旋、右旋不是一回事。',
  '安全:🔴 危险物质本台只说明为什么危险,不提供用途细节、制法、用量或获取渠道。请勿在现实中尝试。'],
  bridge: '<a href="../../life-source/dna/">四个字母怎么写出一个人?(生命源码 · DNA 也是一个分子,里面的糖只用一只「手」)</a> · <a href="../react/">把两种东西混在一起,会发生什么?</a> · <a href="../carbon/">为什么钻石和铅笔芯是同一种东西?</a>' };

/* v2.3:从反应台图鉴跳来 ?look=<分子键>,在关卡上方展开一张结构卡(可拖动/切 3D,不计关卡进度) */
function lookMode() {
  var k = (location.search.match(/[?&]look=([0-9a-f]{8})/) || [])[1], c = k && DB.core.filter(function (x) { return x.k === k && x.m; })[0];
  if (!c) return;
  var app = document.getElementById('app'), box = document.createElement('section');
  box.className = 'mb-look'; box.setAttribute('aria-label', c.zh + ' 的结构');
  box.innerHTML = '<div class="mb-look-h"><b>' + EF.esc(c.zh) + '</b> ' + fm(c.f) + ' <span style="color:#a8a090;font-size:12px">· 来自反应台图鉴</span> <a class="ef-btn ghost" href="../react/">← 回反应台</a> <button class="ef-btn ghost" data-x>收起</button></div>' +
    '<div class="mb-look-c">' + EF.esc(c.u) + '<br>' + safeTag(c.s) + (c.w ? '<span style="color:#d9cbb0">为什么要小心:' + EF.esc(c.w) + '</span>' : '') + '</div><div class="mb-look-s"></div>';
  app.insertBefore(box, app.firstChild);
  var els = []; c.m[0].forEach(function (a) { if (els.indexOf(a[0]) < 0) els.push(a[0]); });
  var lvl = window.EFMB, b = Builder(box.querySelector('.mb-look-s'), { els: els });
  var cx = 0, cy = 0; setTimeout(function () { var cv = box.querySelector('canvas'), r = cv ? cv.getBoundingClientRect() : { width: 600, height: 300 }; cx = r.width / 2; cy = r.height / 2;
    b.load({ atoms: c.m[0].map(function (a) { return { e: a[0], x: cx + a[1], y: cy + a[2] }; }), bonds: c.m[1].map(function (q) { return { a: q[0], b: q[1], o: q[2] }; }) }); }, 30);
  if (lvl) window.EFMB = lvl;
  box.querySelector('[data-x]').onclick = function () { b.stop(); box.remove(); };
  box.scrollIntoView({ block: 'start' });
}
fetch('../data/ef.molecule.json').then(function (r) { return r.json(); }).then(function (j) {
  DB = j; j.core.forEach(function (c) { if (c.b) CORE[c.k] = c; }); j.db.forEach(function (d) { AUTO[d[0]] = d; });
  EF.mission('molecule', LEVELS, NOTES);
  lookMode();
}, function (e) { console.warn('[ef] 分子库加载失败', e); document.getElementById('app').innerHTML = '<p style="padding:40px">分子库没加载出来,请联网后刷新。</p>'; });
})();
