var SAFE = '<b style="color:#ff9a7a">安全常识</b>:干燥剂只用<b>透明小珠子的硅胶干燥剂</b>,整包放进去,不拆开、不入口、不进眼睛;<b>不要用</b>写着"生石灰"的白色块状干燥剂(遇水会发烫、伤眼伤皮肤),也不要用装黑色粉末的"脱氧剂"。不用盐酸和除锈剂;生锈的铁钉边缘可能扎手,做完洗手。';

/* 2D 场景画法:k = 档位,x 画布,W/H,t 时间 */
var R0 = rnd(5), DOTS = []; for (var i = 0; i < 260; i++) DOTS.push([R0(), R0(), R0(), R0()]);
function marsBall(x, cx, cy, r, t) {
  var g = x.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, '#f2a46a'); g.addColorStop(0.55, '#c1562c'); g.addColorStop(1, '#4a1a0e');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.clip();
  for (var i = 0; i < 40; i++) { var d = DOTS[i], px = cx + ((d[0] + t * 0.01) % 1 * 2.4 - 1.2) * r, py = cy + (d[1] * 1.6 - 0.8) * r; x.fillStyle = 'rgba(70,24,12,' + (0.12 + d[2] * 0.2) + ')'; x.beginPath(); x.ellipse(px, py, r * (0.06 + d[3] * 0.18), r * (0.03 + d[2] * 0.08), d[0] * 3, 0, 7); x.fill(); }
  x.fillStyle = 'rgba(255,255,255,.85)'; x.beginPath(); x.ellipse(cx, cy - r * 0.93, r * 0.28, r * 0.09, 0, 0, 7); x.fill();
  x.restore();
  x.strokeStyle = 'rgba(255,190,140,.35)'; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, r + 2, 0, 7); x.stroke(); x.lineWidth = 1;

function ground(x, W, H) {
  var g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#e8b98a'); g.addColorStop(0.42, '#d49a6a'); g.addColorStop(0.43, '#b4552c'); g.addColorStop(1, '#6a2a14'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  [[0.25, 0.68, 0.11], [0.62, 0.78, 0.15], [0.84, 0.6, 0.07]].forEach(function (r, i) {
    var cx = r[0] * W, cy = r[1] * H, rr = r[2] * Math.min(W, H) * 1.6;
    x.fillStyle = '#3e3a38'; x.beginPath(); x.ellipse(cx, cy, rr, rr * 0.55, 0, 0, 7); x.fill();
    x.fillStyle = '#b55a30'; x.beginPath(); x.ellipse(cx, cy - rr * 0.18, rr * 0.98, rr * 0.42, 0, Math.PI, 2 * Math.PI); x.fill();
    if (i === 1) { x.fillStyle = '#4c4846'; x.beginPath(); x.ellipse(cx + rr * 0.35, cy, rr * 0.3, rr * 0.2, 0, 0, 7); x.fill(); x.fillStyle = 'rgba(255,255,255,.8)'; x.font = '11px system-ui'; x.textAlign = 'center'; x.fillText('被风吹掉尘土的一角', cx + rr * 0.35, cy + rr * 0.45); }
  });
}
function dust(x, W, H, t) {

  x.fillStyle = 'rgba(255,255,255,.7)'; x.font = '11px system-ui'; x.textAlign = 'center'; x.fillText('中间:一粒灰黑色的岩石碎屑;周围:极细的红褐色颗粒(示意)', cx, H - 10);

function atoms(x, W, H, t) {

  var s = Math.min(W, H) / 6.2, ox = W / 2 - s * 2.5, oy = H / 2 - s * 1.6;
  for (var r = 0; r < 4; r++) for (var c = 0; c < 6; c++) { var px = ox + c * s, py = oy + r * s + (c % 2) * s * 0.5;
    if (c < 5) { x.strokeStyle = 'rgba(255,200,150,.25)'; x.beginPath(); x.moveTo(px, py); x.lineTo(px + s, py + (c % 2 ? -s * 0.5 : s * 0.5)); x.stroke(); }
    if ((r + c) % 2 === 0) EF.ball(x, px, py, s * 0.24, '#c8743c', 'Fe'); else EF.ball(x, px, py, s * 0.18, '#ff4a4a', 'O');
    if ((r * 7 + c) % 5 === 1) { var hx = px + s * 0.35 + Math.sin(t / 700 + c) * 2, hy = py - s * 0.32; EF.ball(x, hx, hy, s * 0.14, '#ff4a4a', 'O'); EF.ball(x, hx - s * 0.15, hy - s * 0.12, s * 0.08, '#f4f4f4', ''); EF.ball(x, hx + s * 0.15, hy - s * 0.12, s * 0.08, '#f4f4f4', ''); } }
  x.fillStyle = 'rgba(255,255,255,.7)'; x.font = '11px system-ui'; x.textAlign = 'center'; x.fillText('示意:铁(Fe)和氧(O)排在一起,夹着水分子(红白小球);未按真实比例,真实结构更乱', W / 2, H - 10);

/* 尺度镜控制器:view.mount(stage, setK) / view.draw(st) */
function lens(stage, api, view) {
  var st = { k: 0, ok: {}, done: false, wrong: 0 };
  var ctl = document.createElement('div'); ctl.className = 'ctl';
  ctl.innerHTML = '<span>尺度镜</span><input type="range" id="lk" min="0" max="3" step="1" value="0" style="flex:1;min-width:140px" aria-label="尺度镜档位"><b id="ln" style="min-width:8em"></b>';
  var opts = document.createElement('div'); opts.className = 'ctl chips';
  var msg;
  function setK(k) { k = Math.max(0, Math.min(3, k)); if (k > 0 && !st.ok[k - 1]) { EF.play('tick'); msg.innerHTML = '先回答这一档的问题,再往下拧。'; ctl.querySelector('#lk').value = st.k; return; }
    st.k = k; ctl.querySelector('#lk').value = k; EF.play('whoosh'); show(); view.draw(st); }
  view.mount(stage, setK);
  stage.appendChild(ctl); stage.appendChild(opts);
  msg = txt(stage, '');

    msg.innerHTML = '<b>' + L.n + '</b>(' + L.s + '):' + L.q + (st.ok[st.k] ? '<br>这一档已经弄清了' + (st.k < 3 ? ',继续往下拧。' : '。') : '');
    opts.innerHTML = st.ok[st.k] ? '' : L.opts.map(function (o, i) { return '<button class="ef-btn ghost chip" data-i="' + i + '">' + o[0] + '</button>'; }).join('');
    opts.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { var o = L.opts[+b.dataset.i];
      if (o[1]) { EF.play('fuse'); st.ok[st.k] = 1; msg.innerHTML = o[2]; opts.innerHTML = ''; view.draw(st);
        if (Object.keys(st.ok).length === 4 && !st.done) { st.done = true; setTimeout(function () { msg.innerHTML = '找到了:火星的红,来自尘土里<b>铁和氧结合成的含铁矿物</b>——也就是"铁锈"一类的东西。'; }, 1800); setTimeout(api.complete, 2800); }
        else if (st.k < 3) setTimeout(function () { if (st.k < 3 && st.ok[st.k]) setK(st.k + 1); }, 2400); }
      else { st.wrong++; EF.play('tick'); msg.innerHTML = '不对哦:' + o[2]; if (st.wrong >= 2) api.say('红色是"铁锈色"。顺着这个想。'); } }; });
  }
  ctl.querySelector('#lk').oninput = function () { setK(+this.value); };
  card(stage, '<b style="color:#ffd27a">尺度镜</b>:拖动滑杆或点画面上的档位,从一整颗行星一路放大到原子。每档回答一个问题才能往下拧。');
  show(); view.draw(st);
  EF.MR._lens = { setK: setK, st: st, answer: function (i) { var b = opts.querySelector('[data-i="' + i + '"]'); if (b) b.click(); } };
}
function lens2D() {
  var C, st = { k: 0, ok: {} }, cb, shown = 0;
  return {
    mount: function (stage, setK) { cb = setK; C = EF.canvas(stage, 300);
      C.c.addEventListener('pointerdown', function (e) { var q = C.pt(e); if (q.y < 34) { var k = Math.floor(q.x / (C.W / 4)); cb(k); } });
      (function loop(t) { if (!C.c.isConnected) return; var x = C.x, W = C.W, H = C.H; shown += (st.k - shown) * (EF.reduced ? 1 : 0.12); x.clearRect(0, 0, W, H);
        var k = Math.round(shown);
        x.save(); x.translate(0, 34); var h2 = H - 34;
        if (k === 0) { x.fillStyle = '#0a0610'; x.fillRect(0, 0, W, h2); marsBall(x, W / 2, h2 / 2, h2 * 0.4, t / 1000); }
        else if (k === 1) ground(x, W, h2); else if (k === 2) dust(x, W, h2, t / 1000); else atoms(x, W, h2, t);
        var a = Math.abs(shown - k); if (a > 0.02) { x.fillStyle = 'rgba(255,150,70,' + Math.min(0.6, a) + ')'; x.fillRect(0, 0, W, h2); }
        x.restore();
        LENS.forEach(function (L, i) { var bx = i * W / 4; x.fillStyle = i === st.k ? 'rgba(255,150,70,.35)' : 'rgba(20,10,10,.75)'; x.fillRect(bx + 2, 2, W / 4 - 4, 28); x.strokeStyle = 'rgba(255,170,90,.6)'; x.strokeRect(bx + 2, 2, W / 4 - 4, 28);
          x.fillStyle = st.ok[i] ? '#ffd27a' : '#f4ede1'; x.font = '12px system-ui'; x.textAlign = 'center'; x.fillText((i + 1) + ' ' + L.n + (st.ok[i] ? ' ✓' : ''), bx + W / 8, 21); });
        requestAnimationFrame(loop); })(0); },
    draw: function (s) { st = s; }
  };
}
EF.MR = { LENS: LENS, SAFE: SAFE, HOME: HOME, DANGER: DANGER, txt: txt, card: card, rnd: rnd, lens: lens, lens2D: lens2D, marsBall: marsBall };
})();

<script>
(function () {

/* ---------- L0 红色藏在哪一层?(平面版) ---------- */
function L0(stage, api) { MR.lens(stage, api, MR.lens2D()); }

/* ---------- L1 铁是怎样生锈的?(三窗联动) ---------- */
var CASES = { '10': '只有空气(氧气),没有水', '01': '只有水,几乎没有氧气', '11': '有水,也有空气', '00': '既没有水,也没有空气(示意)' };
function L1(stage, api) {

  var ctl = document.createElement('div'); ctl.className = 'ctl chips';
  ctl.innerHTML = '<button class="ef-btn ghost chip on" id="sO" style="--c:#7ad7ff">氧气(空气):有</button><button class="ef-btn ghost chip" id="sW" style="--c:#5aa8ff">水:无</button><button class="ef-btn" id="go">放 7 天</button>';

  var ans = document.createElement('div'); ans.className = 'ctl chips'; stage.appendChild(ans);

    ctl.querySelector('#sW').textContent = '水:' + (st.w ? '有' : '无'); ctl.querySelector('#sW').classList.toggle('on', !!st.w); }

  ctl.querySelector('#go').onclick = function () {
    if (done) return; EF.play('whoosh'); var k = key(), tr = Object.assign({}, st.tried); tr[k] = 1;
    var lv = { '11': 1, '01': 0.08, '10': 0.03, '00': 0 }[k], ru = Object.assign({}, st.rust); ru[k] = lv;

    if (Object.keys(tr).length >= 3 && tr['11'] && !asked) { asked = true; setTimeout(ask, 1200); }
  };
  function ask() {
    msg.innerHTML += '<br><b>结论:铁生锈需要——</b>';
    ans.innerHTML = [['只要氧气', 0], ['只要水', 0], ['氧气和水都要', 1]].map(function (o, i) { return '<button class="ef-btn ghost chip" data-ok="' + o[1] + '">' + o[0] + '</button>'; }).join('');
    ans.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { if (done) return;
      if (b.dataset.ok === '1') { done = true; EF.play('fuse'); ans.innerHTML = ''; msg.innerHTML = '对!铁和<b>氧气、水</b>同时接触,才会明显生锈。火星今天又干又冷,地表几乎没有液态水,空气里的氧气也不到 0.2%,铁很难像在地球上这样生锈。许多科学家认为,火星的"锈"有相当一部分形成于远古、还有液态水的时候(仍在研究)。'; setTimeout(api.complete, 2200); }
      else { EF.play('tick'); msg.innerHTML = '看看四支铁钉:只有一种组合锈得最厉害,它身边有哪两样?'; api.say('比一比"只有空气"和"有水也有空气"那两支。'); } }; });
  }
  sync();
  /* 宏观:试管 + 铁钉 */
  var CM = EF.canvas(T.pane.macro, 250);
  (function loop(t) {
    if (!CM.c.isConnected) return; var x = CM.x, W = CM.W, H = CM.H; x.clearRect(0, 0, W, H);
    var k = key(), tw = Math.min(70, W * 0.3), tx = W / 2 - tw / 2, ty = 20, th = H - 70;
    x.strokeStyle = 'rgba(220,235,255,.7)'; x.lineWidth = 2; x.beginPath(); x.moveTo(tx, ty); x.lineTo(tx, ty + th - tw / 2); x.arc(tx + tw / 2, ty + th - tw / 2, tw / 2, Math.PI, 0, true); x.lineTo(tx + tw, ty); x.stroke();
    if (st.w) { var wy = st.o2 ? ty + th * 0.55 : ty + 10; x.fillStyle = 'rgba(90,168,255,.28)'; x.fillRect(tx + 2, wy, tw - 4, ty + th - tw / 2 - wy); x.beginPath(); x.arc(tx + tw / 2, ty + th - tw / 2, tw / 2 - 2, 0, Math.PI); x.fill();
