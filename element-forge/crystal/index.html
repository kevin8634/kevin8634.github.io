(function () {

function L2(stage, api) {

  var ctl = document.createElement('div'); ctl.className = 'ctl'; ctl.innerHTML = '<span>蒸发速度</span><input type="range" min="1" max="10" value="7" id="sp"><output id="so"></output><button class="ef-btn" id="go">开始结晶</button>'; stage.appendChild(ctl);

function flakeType(T, wet) { return T > -4 ? 'plate' : T > -10 ? (wet ? 'needle' : 'column') : T > -22 ? ((wet && T <= -12 && T >= -17) ? 'dendrite' : wet ? 'sector' : 'plate') : 'column'; }

function L3(stage, api) {

    else if (type) { gt = Math.min(1, gt + 0.012); var R = 120 * (0.1 + 0.9 * gt), cx = W / 2, cy = H / 2, rot = EF.reduced ? 0 : t / 6000; x.strokeStyle = '#cfefff'; x.fillStyle = 'rgba(207,239,255,.35)'; x.lineCap = 'round';
