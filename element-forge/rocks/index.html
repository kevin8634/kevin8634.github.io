<script>
/* ---------- 共享数据:岩石样本、程序纹理、分类控制器(2D/3D 共用) ---------- */
(function () {
function rnd(seed) { var s = seed || 7; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
/* 六块样本。cat:ig 岩浆岩 / sed 沉积岩 / met 变质岩 */
var ROCKS = [
  { k: 'granite', n: '花岗岩', cat: 'ig', clue: '看得见一颗颗大的矿物颗粒:粉红、白、黑,像芝麻糖。' },
  { k: 'basalt', n: '玄武岩', cat: 'ig', clue: '黑灰色,颗粒细得几乎看不见,有时有小气孔。' },
  { k: 'sandstone', n: '砂岩', cat: 'sed', clue: '摸起来粗糙,是一粒粒沙子粘在一起的,常有一层层的纹。' },
  { k: 'limestone', n: '石灰岩', cat: 'sed', clue: '浅灰色,常能看到贝壳一样的化石。' },
  { k: 'marble', n: '大理岩', cat: 'met', clue: '白色,有花纹,闪着细小的晶粒——它原来是石灰岩。' },
  { k: 'slate', n: '板岩', cat: 'met', clue: '深灰色,能剥成一片片薄板——它原来是页岩(泥巴变成的岩石)。' }];
var RBY = {}; ROCKS.forEach(function (r, i) { r.i = i; RBY[r.k] = r; });
var CAT = { ig: ['岩浆岩', '#ff8a4a'], sed: ['沉积岩', '#e6c27a'], met: ['变质岩', '#c9a6ff'] };
/* 程序纹理:画在任意 2D 上下文里 */
function tex(x, kind, X, Y, W, H, seed) {
  var r = rnd(seed || 11), i, n;
  function dots(cols, cnt, rmin, rmax) { for (i = 0; i < cnt; i++) { x.fillStyle = cols[Math.floor(r() * cols.length)]; var px = X + r() * W, py = Y + r() * H, rr = rmin + r() * (rmax - rmin); x.beginPath(); x.ellipse(px, py, rr, rr * (0.6 + r() * 0.5), r() * 3, 0, 7); x.fill(); } }
  if (kind === 'granite') { x.fillStyle = '#d8c2b4'; x.fillRect(X, Y, W, H); dots(['#f0e6e0', '#e8a890', '#c98a78', '#2a2626', '#f6f2ee'], W * H / 60, 2, 6); }
  else if (kind === 'basalt') { x.fillStyle = '#3a3a3e'; x.fillRect(X, Y, W, H); dots(['#2a2a2e', '#4a4a50', '#323236'], W * H / 6, 0.5, 1.4); dots(['#1a1a1c'], W * H / 500, 1.5, 3); }
  else if (kind === 'sandstone') { x.fillStyle = '#d8b07a'; x.fillRect(X, Y, W, H); for (i = 0; i < 6; i++) { x.fillStyle = 'rgba(160,100,50,' + (0.08 + r() * 0.12) + ')'; x.fillRect(X, Y + i * H / 6 + r() * 4, W, H / 14); } dots(['#e8c896', '#c89a62', '#b08050'], W * H / 10, 0.6, 1.6); }

}
var DANGER = '<b style="color:#ff7a7a">请勿在现实中尝试!</b><br>这里的岩浆、火山都是虚拟的。真实熔岩约有七八百到一千多摄氏度,火山气体有毒——不要靠近活火山口和流动的熔岩;去火山景区走规定步道,听管理人员的。野外找岩石要有大人陪同,远离悬崖、陡坡和落石区,下雨后、涨水时不要进山谷河滩,在海边要留意涨潮;不要进入矿坑和采石场。自然保护区和地质公园里不要敲打或带走岩石;化石属于国家所有,不能私自挖掘。敲岩石要在大人指导下戴护目镜,旁边不要站人,碎片会飞溅。矿物不要舔、不要尝,摸完洗手。用酸检验石灰岩只能在实验室由老师做。';
var SAFE = '<b style="color:#ff9a7a">安全常识</b>:岩浆和火山只在屏幕里看。野外找岩石要有大人陪同,远离悬崖和落石区;保护区里的岩石不要敲、不要带走。';
function txt(stage, h, cls) { var p = document.createElement('p'); p.className = cls || 'note-sm'; p.innerHTML = h || ''; stage.appendChild(p); return p; }
function card(stage, h, warn) { var d = document.createElement('div'); d.className = 'cab-card' + (warn ? ' warn' : ''); d.innerHTML = h; stage.appendChild(d); return d; }

/* L0 分类控制器:view.mount(stage) 挂画面,view.pickCb 设为选中回调,view.draw(st) 重画 */
function sorter(stage, api, view) {
  var st = { sel: -1, put: {}, wrong: 0, done: false };
  var pickRock = function (i) { if (st.done || st.put[i]) return; st.sel = i; EF.play('select'); var R = ROCKS[i]; msg.innerHTML = '<b>' + R.n + '</b>:' + R.clue + '它属于哪一家?'; view.draw(st); };
  EF.RK._pick = pickRock; view.mount(stage, pickRock);
  var ctl = document.createElement('div'); ctl.className = 'ctl chips';
  ctl.innerHTML = Object.keys(CAT).map(function (k) { return '<button class="ef-btn ghost chip" data-c="' + k + '" style="--c:' + CAT[k][1] + '">' + CAT[k][0] + '</button>'; }).join('');
  stage.appendChild(ctl);
  var msg = txt(stage, '架子上有六块岩石样本。先点一块,看它的样子,再把它放进三个"家"之一:<b>岩浆岩</b>(岩浆冷却凝固成的)、<b>沉积岩</b>(碎屑、生物遗体或水中析出的物质一层层沉积、压实固结成的)、<b>变质岩</b>(老岩石被高温高压"重新改造"的)。');
  card(stage, DANGER, true);
  ctl.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () {
    if (st.done) return; if (st.sel < 0) { EF.play('tick'); msg.innerHTML = '先点一块岩石样本。'; return; }
    var R = ROCKS[st.sel], c = b.dataset.c;

      msg.innerHTML = '对!' + R.n + '是<b>' + CAT[c][0] + '</b>。' + ({ granite: '大颗粒说明它在地下深处慢慢冷却。', basalt: '颗粒细说明它在地表较快冷却。', sandstone: '沙粒被水冲下来,一层层堆起再压紧粘牢。', limestone: '贝壳和碳酸钙在海底一层层堆积。', marble: '石灰岩在高温高压下没有熔化,方解石重新结晶;它也可能被附近的岩浆"烤"出来。"大理石"是石材名,"大理岩"是地质名称。', slate: '页岩受挤压,矿物排成一个方向,所以能剥成片。' })[R.k] + (left ? '还剩 ' + left + ' 块。' : '');
      st.sel = -1; if (!left) { st.done = true; setTimeout(function () { msg.innerHTML = '六块都回家了!看岩石的样子,就能猜出它是怎么"长"出来的。'; }, 1200); setTimeout(api.complete, 2200); } }
    else { st.wrong++; EF.play('tick'); msg.innerHTML = R.n + '不属于' + CAT[c][0] + '。再看看线索:' + R.clue; if (st.wrong >= 2) api.say('大理岩和板岩都是"原来是别的岩石"——被改造过的。'); }
    view.draw(st);
  }; });
  view.draw(st);
}
function sorter2D() {
  var C, st = { sel: -1, put: {} }, cb;
  function pos(i, W, H) { var cols = W < 520 ? 3 : 6, row = Math.floor(i / cols), col = i % cols, rows = Math.ceil(6 / cols); return { x: W * (col + 0.5) / cols, y: H * (row + 0.5) / rows - 8, r: Math.min(W / cols, H / rows) * 0.32 }; }
  return {
    mount: function (stage, pick) { cb = pick; C = EF.canvas(stage, 300);
      C.c.addEventListener('pointerdown', function (e) { var q = C.pt(e); ROCKS.forEach(function (R, i) { var p = pos(i, C.W, C.H); if (Math.hypot(q.x - p.x, q.y - p.y) < p.r + 8) cb(i); }); });
      (function loop() { if (!C.c.isConnected) return; var x = C.x, W = C.W, H = C.H; x.clearRect(0, 0, W, H);
        ROCKS.forEach(function (R, i) { var p = pos(i, W, H), put = st.put[i];
          x.save(); x.beginPath(); x.moveTo(p.x - p.r, p.y); for (var k = 1; k < 9; k++) { var a = k / 9 * 6.283, rr = p.r * (0.85 + 0.15 * Math.sin(k * 2.3 + i)); x.lineTo(p.x + Math.cos(a + Math.PI) * rr, p.y + Math.sin(a + Math.PI) * rr * 0.8); } x.closePath(); x.clip();
          tex(x, R.k, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2, 31 + i); x.restore();
          if (st.sel === i) { x.strokeStyle = '#ffd27a'; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, p.r + 6, 0, 7); x.stroke(); x.lineWidth = 1; }
          x.fillStyle = put ? CAT[put][1] : '#efe6f6'; x.font = '12px system-ui'; x.textAlign = 'center'; x.fillText(R.n + (put ? ' · ' + CAT[put][0] : ''), p.x, p.y + p.r * 0.8 + 16); });
        requestAnimationFrame(loop); })(); },
    draw: function (s) { st = s; }
  };

EF.RK = { ROCKS: ROCKS, RBY: RBY, CAT: CAT, tex: tex, rnd: rnd, DANGER: DANGER, SAFE: SAFE, txt: txt, card: card, sorter: sorter, sorter2D: sorter2D };
})();

<script>
(function () {
var RK = EF.RK, txt = RK.txt, card = RK.card;

/* ---------- L0 岩石三兄弟(平面版) ---------- */
function L0(stage, api) { RK.sorter(stage, api, RK.sorter2D()); }

/* ---------- L1 冷却快慢(三窗联动):晶核少 → 晶粒大 ---------- */
var GOALS = [{ t: 'coarse', w: '<b>粗粒</b>的岩石(像花岗岩,颗粒一眼就看得见)' }, { t: 'fine', w: '<b>细粒</b>的岩石(像玄武岩,颗粒细得几乎看不见)' }, { t: 'glass', w: '<b>玻璃一样</b>的岩石(像黑曜岩,几乎没有晶粒)' }];
function kindOf(v) { return v <= 3 ? 'coarse' : v <= 8 ? 'fine' : 'glass'; }
var KN = { coarse: '粗粒', fine: '细粒', glass: '玻璃质' };
function L1(stage, api) {
  var T = EF.tri(stage, { state: { v: 2, run: 0, res: null, g: 0 }, h: 250 }), st = T.state, done = false, miss = 0;
  var ctl = document.createElement('div'); ctl.className = 'ctl';
  ctl.innerHTML = '<span>冷却速度</span><input type="range" id="rate" min="1" max="10" value="2" style="flex:1;min-width:120px" aria-label="冷却速度"><b id="rv" style="min-width:5em">很慢</b><button class="ef-btn" id="cool">开始冷却</button>';
  stage.appendChild(ctl);
  var msg = txt(stage, '');
  card(stage, RK.SAFE, true);
  function lab(v) { return v <= 3 ? '很慢(地下深处)' : v <= 8 ? '较快(地表熔岩)' : '极快(示意)'; }
  function intro() { msg.innerHTML = '订单 ' + (st.g + 1) + '/3:做一块' + GOALS[st.g].w + '。调好冷却速度,点"开始冷却"。'; }
  intro();
  var rate = ctl.querySelector('#rate'), rv = ctl.querySelector('#rv'); rv.textContent = lab(2);
  rate.oninput = function () { rv.textContent = lab(+rate.value); T.set({ v: +rate.value }, 'ctl'); };
  ctl.querySelector('#cool').onclick = function () { if (done) return; EF.play('whoosh'); T.set({ run: st.run + 1, res: null }, 'ctl'); };
  /* 微观:格子里的晶核生长 */
  var CU = EF.canvas(T.pane.micro, 250), GW = 64, GH = 40, grid = new Int16Array(GW * GH), cols = [], phase = 'idle', tick = 0, lastRun = 0, frozenAt = 0;
  for (var i = 0; i < 400; i++) { var r = Math.random(); var b0 = r < 0.4 ? [236, 228, 222] : r < 0.7 ? [222, 160, 140] : r < 0.85 ? [200, 196, 190] : [52, 46, 46], f = 0.72 + Math.random() * 0.38; cols.push(b0.map(function (c) { return Math.min(255, Math.round(c * f)); })); }
  function start(v) {
    grid.fill(0); tick = 0; phase = 'grow';
    if (kindOf(v) === 'glass') { phase = 'glass'; finish('glass'); return; }
    var n = Math.round(v <= 3 ? 3 + v * 3 : 18 + (v - 3) * 28);   /* 冷得越快,同时冒出的晶核越多(示意) */
    for (var k = 1; k <= n; k++) grid[Math.floor(Math.random() * GW * GH)] = k;
  }
  function grow() {
    var nxt = grid.slice(), empty = 0;
    for (var y = 0; y < GH; y++) for (var x = 0; x < GW; x++) { var j = y * GW + x; if (grid[j]) continue; empty++;
      var nb = [x > 0 ? grid[j - 1] : 0, x < GW - 1 ? grid[j + 1] : 0, y > 0 ? grid[j - GW] : 0, y < GH - 1 ? grid[j + GW] : 0].filter(Boolean);
      if (nb.length && Math.random() < 0.55) nxt[j] = nb[Math.floor(Math.random() * nb.length)]; }
    grid = nxt; return empty;
  }
  function finish(k) { phase = 'done'; T.set({ res: k }, 'micro'); }
  (function loop() {
    if (!CU.c.isConnected) return; var x = CU.x, W = CU.W, H = CU.H; x.clearRect(0, 0, W, H);
    if (st.run !== lastRun) { lastRun = st.run; start(st.v); }
    if (phase === 'grow') { var steps = EF.reduced ? 200 : 2; for (var s = 0; s < steps && phase === 'grow'; s++) { if (grow() === 0) finish(kindOf(st.v)); } }
    var cw = W / GW, ch = (H - 24) / GH;
    for (var y = 0; y < GH; y++) for (var xx = 0; xx < GW; xx++) { var v = grid[y * GW + xx];
      if (phase === 'glass' || (phase === 'done' && st.res === 'glass')) x.fillStyle = 'rgba(30,28,40,' + (0.85 + 0.15 * ((xx * 7 + y * 13) % 5) / 5) + ')';
      else if (!v) x.fillStyle = phase === 'idle' ? 'rgba(255,120,40,.55)' : 'rgba(255,' + (100 + 40 * Math.sin(xx + y)) + ',40,.6)';
      else { var c = cols[v % cols.length]; x.fillStyle = 'rgb(' + c.join(',') + ')'; }
      x.fillRect(xx * cw, y * ch, cw + 0.5, ch + 0.5); }
    x.fillStyle = '#e6dff0'; x.font = '11px system-ui'; x.textAlign = 'left';
    x.fillText(phase === 'idle' ? '一滩热岩浆(示意)' : phase === 'grow' ? '晶核长大中……' : st.res === 'glass' ? '晶体几乎长不出来,凝成"玻璃"' : '凝固了:相邻色块是不同晶粒(颜色只为区分)', 4, H - 6);

  })();
  /* 宏观:地下/地表示意 + 结果岩石 */
  var CM = EF.canvas(T.pane.macro, 250);
  (function loop() {
    if (!CM.c.isConnected) return; var x = CM.x, W = CM.W, H = CM.H; x.clearRect(0, 0, W, H);
    x.fillStyle = '#2a3a5a'; x.fillRect(0, 0, W, H * 0.22); x.fillStyle = '#5a4436'; x.fillRect(0, H * 0.22, W, H * 0.5);
    x.fillStyle = 'rgba(255,255,255,.75)'; x.font = '10px system-ui'; x.textAlign = 'left'; x.fillText('地表', 6, H * 0.2); x.fillText('地下深处', 6, H * 0.68);
    var k = kindOf(st.v), py = k === 'coarse' ? H * 0.58 : H * 0.2;
    var g = x.createRadialGradient(W * 0.6, py, 2, W * 0.6, py, 34); g.addColorStop(0, 'rgba(255,200,80,.95)'); g.addColorStop(1, 'rgba(255,80,20,0)'); x.fillStyle = g; x.beginPath(); x.ellipse(W * 0.6, py, 46, 20, 0, 0, 7); x.fill();
    x.fillStyle = '#ffd9b0'; x.textAlign = 'center'; x.fillText(k === 'coarse' ? '岩浆在地下慢慢冷却' : k === 'fine' ? '熔岩流到地表,较快冷却' : '黏稠岩浆难结晶,凝成玻璃', W * 0.6, py + 34);
    if (st.res) { var rx = W * 0.3, ry = H * 0.78, rw = W * 0.4, rh = H * 0.2; x.save(); x.beginPath(); x.roundRect ? x.roundRect(rx, ry, rw, rh, 8) : x.rect(rx, ry, rw, rh); x.clip(); RK.tex(x, st.res === 'coarse' ? 'granite' : st.res === 'fine' ? 'basalt' : 'obsidian', rx, ry, rw, rh, 5); x.restore();
      x.fillStyle = '#efe6f6'; x.textAlign = 'left'; x.font = '12px system-ui'; x.fillText('→ ' + KN[st.res], rx + rw + 8, ry + rh / 2 + 4); }
    requestAnimationFrame(loop);
  })();
  /* 符号 */
  var sy = document.createElement('div'); sy.className = 'tri-sym'; T.pane.sym.appendChild(sy);
  T.on(function (s, ch) {
    sy.innerHTML = '<div class="eq" style="font-size:16px">冷却越慢 → 晶核越少 → 晶粒越大</div>' +
      '<p class="note-sm">冷却速度:<b>' + lab(s.v) + '</b></p>' +
      '<p class="note-sm">地下深处:岩浆被岩石裹着,散热很慢,可能要几百年到上百万年才凝固——少数晶核有充足的时间长大,成了<b>粗粒</b>(侵入岩,如花岗岩)。</p>' +
      '<p class="note-sm">地表:熔岩表面几分钟就结壳,整体几天到几年凝固,晶核一下子冒出很多,每颗都长不大,成了<b>细粒</b>(喷出岩,如玄武岩)。如果岩浆富含二氧化硅、非常黏稠,原子很难排成晶体,冷却又较快,就成了几乎没有晶粒的<b>火山玻璃</b>(如黑曜岩)。</p>' +
      '<p class="note-sm">(示意:真实的花岗岩和玄武岩成分也不一样,这里只比冷却快慢。同成分对照:花岗岩那样的岩浆冷得快成流纹岩,玄武岩那样的岩浆冷得慢成辉长岩;黑曜岩成分接近花岗岩)</p>';
    if (ch.indexOf('res') > -1 && s.res && !done) {
      var G = GOALS[s.g];
