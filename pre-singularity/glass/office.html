<body class="glass office" data-nostars="1">
<canvas id="gl" aria-label="写实办公室与玻璃心智 3D 舞台"></canvas>
<canvas id="g2" hidden aria-hidden="true"></canvas>
<div class="gtop"><header class="top"></header></div>

<aside class="acts" id="acts" aria-label="三幕">
  <div class="mono k">2.0 · GLASS MIND · B</div>
  <h1>透过玻璃心智看决策</h1>
  <p class="q">它替你做了决定,也告诉了你理由。理由是真的吗?</p>
  <button class="act on" data-a="1"><b>①</b> 它看见了什么<i></i></button>
  <button class="act" data-a="2"><b>②</b> 它没告诉你的<i></i></button>
  <button class="act" data-a="3"><b>③</b> 你会怎么问<i></i></button>
  <a class="btn hb back" href="../">← 回大厅</a>
  <a class="btn hb back" href="./" style="font-size:12px;opacity:.75">玻璃心智经典版</a>
</aside>

<div class="ybox" id="ybox" role="status" aria-live="polite">
  <div class="who mono"><b class="live"></b>萤 YING · 只提问</div>
  <div id="say"></div>
  <div class="scn" id="pick" aria-label="它的光路其实落在哪张方案上?">
    <button class="btn hb" data-c="0">方案 A</button><button class="btn hb" data-c="1">方案 B</button><button class="btn hb" data-c="2">方案 C</button>
  </div>
  <div class="cmp" id="cmp" hidden style="--x:50%"><div class="cl" id="cmpL"></div><div class="cr" id="cmpR"></div><input type="range" id="cmpS" min="0" max="100" value="50" aria-label="对照条:左边它说的,右边光路显示的"></div>
  <div class="row"><button class="btn hb" id="hint">再给我一点提示</button><span class="mono muted" id="stat"></span></div>
</div>

<div class="dock" id="dock" aria-label="三枚玻璃滑块">
  <label><span>目标 <em class="mono" id="vg"></em></span><input type="range" id="sg" min="0" max="100" value="60" aria-label="目标偏移:它真正追的,和你要的差多少"><small>贴合你 ↔ 偏一点</small></label>
  <label><span>能力 <em class="mono" id="vc"></em></span><input type="range" id="sc" min="0" max="100" value="45" aria-label="能力"><small>普通 ↔ 远超人类</small></label>
  <label><span>透明度 <em class="mono" id="vt"></em></span><input type="range" id="st" min="0" max="100" value="15" aria-label="透明度:你能看见它内部多少"><small>起雾 ↔ 通透</small></label>
</div>
