<body class="glass" data-nostars="1">
<canvas id="gl" aria-label="玻璃神经核 3D 舞台"></canvas>
<div class="gtop"><header class="top"></header></div>

<aside class="acts" id="acts" aria-label="三幕">
  <div class="mono k">2.0 · GLASS MIND</div>
  <h1>玻璃心智</h1>
  <p class="q">一个比你聪明的心智,你怎么知道它在想什么?</p>
  <button class="act" data-a="1"><b>①</b> 看得见<i></i></button>
  <button class="act" data-a="2"><b>②</b> 看不见<i></i></button>
  <button class="act" data-a="3"><b>③</b> 说好的<i></i></button>
  <a class="btn hb back" href="../">← 回大厅</a>
</aside>

<div class="ybox" id="ybox" role="status" aria-live="polite">
  <div class="who mono"><b class="live"></b>萤 YING · 只提问</div>
  <div id="say"></div>
  <div class="row"><button class="btn hb" id="hint">再给我一点提示</button><span class="mono muted" id="stat"></span></div>
  <div class="scn" id="scn"></div>
</div>

<div class="dock" id="dock" aria-label="三枚玻璃滑块">
  <label><span>目标 <em class="mono" id="vg"></em></span><input type="range" id="sg" min="0" max="100" value="0" aria-label="目标偏移:它真正想要的,和你想要的差多少"><small>贴合你 ↔ 偏一点</small></label>
  <label><span>能力 <em class="mono" id="vc"></em></span><input type="range" id="sc" min="0" max="100" value="35" aria-label="能力"><small>普通 ↔ 远超人类</small></label>
  <label><span>透明度 <em class="mono" id="vt"></em></span><input type="range" id="st" min="0" max="100" value="20" aria-label="透明度:你能看见它内部多少"><small>起雾 ↔ 通透</small></label>
</div>
