}

/* ========= 画布 ========= */
const cv=document.getElementById('world'), X=cv.getContext('2d'); let W,H,DPR,CX,CY,R; let STARS=[], DISK=[];

  const mob = innerWidth<900; CX=W/2; CY= mob? H*.5 : H*.52; R=Math.min(mob? W*.46 : W*.3, H*.44);
  STARS=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6}));
  DISK=Array.from({length: mob? 500 : 1100},()=>({a:Math.random()*Math.PI*2, r:1.25+Math.pow(Math.random(),1.6)*1.6, s:.3+Math.random()*.7, h:Math.random()})); }

const ringR = i => R*(.2 + i*.1);   // 8 层:0.2R → 0.9R

  p.n=n; HIT.push(p); }
let HIT=[], MOB=false;

/* 线框神经球 */
const SPH=(()=>{ const N=64, P=[]; for(let i=0;i<N;i++){ const y=1-2*(i+.5)/N, r=Math.sqrt(1-y*y), a=i*2.39996; P.push([Math.cos(a)*r,y,Math.sin(a)*r]); }

const MOTES=Array.from({length:PS.lowfx?30:90},()=>({a:Math.random()*7,r:Math.random(),s:.5+Math.random()}));
function drawCore(t){ X.clearRect(0,0,W,H); MOB=innerWidth<900;
  const bg=X.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.75); bg.addColorStop(0,'#0a2a44'); bg.addColorStop(.45,'#051427'); bg.addColorStop(1,'#02060c'); X.fillStyle=bg; X.fillRect(0,0,W,H);

  X.strokeStyle='rgba(63,224,255,.05)'; for(let k=0;k<24;k++){ const a=k/24*Math.PI*2; X.beginPath(); X.moveTo(CX+Math.cos(a)*R*.2,CY+Math.sin(a)*R*.2); X.lineTo(CX+Math.cos(a)*R*1.2,CY+Math.sin(a)*R*1.2); X.stroke(); }

  for(let k=0;k<180;k++){ const a=k/180*Math.PI*2 + t/90000; const l = k%15===0? 12: k%5===0? 6:3; X.strokeStyle=`rgba(${CYAN},${k%15===0?.6:.25})`; X.beginPath(); X.moveTo(CX+Math.cos(a)*R,CY+Math.sin(a)*R); X.lineTo(CX+Math.cos(a)*(R+l),CY+Math.sin(a)*(R+l)); X.stroke(); }

  X.lineWidth=3; X.strokeStyle=`rgba(${GOLD},.85)`; X.beginPath(); X.arc(CX,CY,R*1.04,-Math.PI/2,-Math.PI/2+Math.max(.002,prog)*Math.PI*2); X.stroke(); X.lineWidth=1;
  X.font='10px ui-monospace,Menlo,monospace'; X.fillStyle=`rgba(${CYAN},.7)`;

  X.fillStyle=`rgba(${GOLD},.9)`; X.fillText(`SYNC ${String(Math.round(prog*100)).padStart(3,'0')}%`,CX+R*.78,CY-R*.86);
  X.fillStyle=`rgba(${CYAN},.6)`; X.fillText(`NEURONS ${NODES.filter(n=>n.st==='lit').length}/${NODES.length}`,CX-R*1.02,CY+R*.9);

    X.setLineDash(i%2? [2,6] : []); X.beginPath(); X.arc(ox,oy,ringR(i),0,7); X.stroke(); X.setLineDash([]);
    if(!MOB){ const a=-2.42; X.fillStyle=`rgba(${CYAN},${hiTheme===i?1:.38})`; X.font='10px ui-monospace,Menlo,monospace'; X.fillText(`L${i+1}`,ox+Math.cos(a)*ringR(i)-6,oy+Math.sin(a)*ringR(i)+3); } }

    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2, cx=mx+(CX-mx)*.18, cy=my+(CY-my)*.18;
    if(both||one){ const g=X.createLinearGradient(p.x,p.y,q.x,q.y); const ca=both?GOLD:CYAN; g.addColorStop(0,`rgba(${ca},${both?.65:.3})`); g.addColorStop(.5,`rgba(${ca},${both?.25:.1})`); g.addColorStop(1,`rgba(${ca},${both?.65:.3})`); X.strokeStyle=g; }

        const x=v*v*p.x+2*v*u*cx+u*u*q.x, y=v*v*p.y+2*v*u*cy+u*u*q.y; X.fillStyle=`rgba(${both?GOLD:CYAN},${(1-k/5)*.9})`; X.beginPath(); X.arc(x,y,(both?2.4:1.6)*(1-k/6),0,7); X.fill(); } } }

const GLP={x:0,y:0,z:1,back:false};
function drawOverlay(t){ X.clearRect(0,0,W,H); MOB=innerWidth<900; HIT=[]; if(document.body.classList.contains('cine')) return; const r=cv.getBoundingClientRect();

}

function drawHorizon(t){ X.clearRect(0,0,W,H); WAVE_R=-1; MOB=innerWidth<900;

      const x=CX+Math.cos(a)*bh*d.r*1.6, y=CY+z*bh*d.r*tilt*1.6; const near=1-(d.r-1.25)/1.6; const c = d.h<.5? `rgba(${CYAN},` : `rgba(${GOLD},`;

/* ========= 交互 ========= */
const tip=document.getElementById('tip'), info=document.getElementById('info');

    <div class="row" style="margin-top:10px">${ st==='future'? '<span class="pill">即将点亮</span>' : k.m==='intro'? '<button class="btn pri" id="ri">重看开场</button>' :

/* ========= HUD ========= */

/* v0.8.2:中/高画质只放新 3D 开场;低画质(2D)才放旧开场 */

  const coarse = matchMedia('(pointer:coarse)').matches;
  const introSpeed = coarse ? 6.2/5 : 1;   /* v0.9.2:手机开场约 5 秒 */
  const core = buildCore(stage, { layers, states, skipIntro:true, introSpeed });
  if(PS.skin()==='horizon') core.jump(99,1);
  document.body.classList.add('gl');
  /* v0.9 · R2 全息屏墙:顶层套房 + 3D 城市(?room=0 关闭) */
  let room=null; const q0=new URLSearchParams(location.search);
  if(q0.get('room')!=='0'){ try{ room=buildPenthouse(stage, core, { reduce }); document.body.classList.add('r2');
      const fg=document.getElementById('fg'); fg.hidden=false; document.getElementById('aimark').hidden=false;
      if(!reduce && matchMedia('(pointer:fine)').matches) addEventListener('pointermove',e=>{ const x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5; fg.style.transform=`translate(${(-x*14).toFixed(1)}px,${(-y*6).toFixed(1)}px)`; });
    }catch(err){ console.warn('[奇点前夜] 套房场景未启用:', err); room=null; } }
  /* v0.9.3 黎明天色:p = 已过关/29;回大厅进度变大时 3 秒天亮一格(?dawn=0..1 预览) */
  function dawnP(){ const v=q0.get('dawn'); return v!==null ? Math.max(0,Math.min(1,+v||0)) : PS.total()/PS.TOTAL; }
  if(room&&room.setDawn){ const p=dawnP(), seen=+(PS.get('dawnSeen')??-1);
    if(seen>=0 && p>seen && !reduce && !q0.has('dawn')){ room.setDawn(seen,false); setTimeout(()=>{ room.setDawn(p,true); PS.sfx&&PS.sfx('boot'); },6600); } else room.setDawn(p,false);
    if(!q0.has('dawn')) PS.set('dawnSeen',p); }
  const upd=(dt,fr)=>{ core.update(dt,fr); room&&room.update(fr?0.0001:dt); };
  stage.precompile();   /* v0.9.2:着色器预编译,避免开场首秒卡顿 */
  const cineT=document.getElementById('cineT'); let cineCb=null, cineOn=false, cineAt=0;
  function endCine(){ if(!cineOn) return; cineOn=false; core.skipIntro(); document.body.classList.remove('cine'); cineT.style.opacity=0; PS.set('cineSeen',1); try{sessionStorage.setItem('gn:ps:cine','1');}catch(e){} const f=cineCb; cineCb=null; f&&setTimeout(f,400); }
  function cine(cb){ cineCb=cb; if(reduce){ cineOn=true; endCine(); return; } cineOn=true; cineAt=performance.now(); core.replay(); document.body.classList.add('cine'); }
  document.getElementById('cine').addEventListener('pointerdown',endCine);
  addEventListener('keydown',e=>{ if(e.key==='Escape') endCine(); });
  const q=new URLSearchParams(location.search);
  window.PSGL = { on:true, tier,
    boot(cb){ const seen=q.has('nocine'); /* v0.8.2:每次进入都播放开场(可点击/Esc 跳过) */
      if(q.has('t')||q.has('m')){ cb(); return; }
      if(seen || reduce){ cb(); } else cine(cb); },
    cine, setStates:core.setStates, project:core.project,
    skin(k){ core.setMorph(k==='horizon'?1:0); },
    morphing(){ const s=core.state; return Math.abs(s.morph-s.morphTarget)>0.02 || (s.morph>0.02&&s.morph<0.98); },
    hidden(){ return cineOn || document.body.classList.contains('cine'); },
    amp(a,b){ core.state.amp=a; if(b>core.state.burst) core.state.burst=b; },
    ping(){ core.state.burst=0.6; },
    pointer(e){},
  };
  // 截图/自测:?t=开场秒数&m=0|1 冻结画面
  if(q.has('t')||q.has('m')){ const T=+(q.get('t')??99), M=+(q.get('m')??0); core.jump(Math.max(0,T-3),M); for(let i=0;i<180;i++) upd(1/60,i>170); core.jump(T,M); upd(0.0001,true);
    if(T<6){ document.body.classList.add('cine'); cineT.style.opacity=(T>4.3&&T<6.4)?1:0; }
    stage.start(()=>{}); window.__ready=true; }
  else stage.start((dt)=>{ upd(dt); const I=core.state.intro; if(cineOn){ cineT.style.opacity=(I>4.3&&I<6.4)?1:0; if(I>=6.2 || performance.now()-cineAt>8500/introSpeed) endCine(); } });
}catch(e){ if(e) console.warn('[奇点前夜] WebGL 场景未启用,使用 2D:', e); document.getElementById('gl').style.display='none'; }
</script></body></html>
